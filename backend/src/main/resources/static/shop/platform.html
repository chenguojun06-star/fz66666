<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ff5000">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23ff5000'/%3E%3Ctext x='32' y='45' font-size='38' text-anchor='middle' fill='%23fff' font-family='PingFang SC,Microsoft YaHei,sans-serif'%3E%E4%BA%91%3C/text%3E%3C/svg%3E">
<title>云裳智链 · 商城</title>
<style>
  :root{
    --o:#ff5000; --o2:#ff7a1a; --bg:#f4f4f4; --card:#fff;
    --text:#1a1a1a; --sub:#999; --line:#f0f0f0; --r:10px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
       background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;padding-bottom:20px;}
  img{display:block;} button{font-family:inherit;cursor:pointer;}
  input{font-family:inherit;}

  .top{position:sticky;top:0;z-index:30;background:linear-gradient(135deg,var(--o),var(--o2));
       padding:12px 12px 12px;padding-top:calc(12px + env(safe-area-inset-top));}
  .top .r1{display:flex;align-items:center;gap:8px;}
  .top .brand{color:#fff;font-size:17px;font-weight:700;flex:1;letter-spacing:.5px;}
  .top .tbtn{border:none;background:rgba(255,255,255,.95);color:var(--o);font-size:12.5px;
             font-weight:600;border-radius:14px;padding:6px 12px;position:relative;}
  .top .tbtn .badge{position:absolute;top:-4px;right:-4px;min-width:16px;height:16px;line-height:16px;
                    border-radius:8px;background:#ff0036;color:#fff;font-size:10px;padding:0 4px;font-weight:700;}
  .search{display:flex;align-items:center;background:#fff;border-radius:18px;overflow:hidden;height:36px;margin-top:10px;}
  .search input{flex:1;border:none;outline:none;font-size:14px;height:100%;padding:0 12px;background:transparent;}
  .search button{border:none;background:var(--o);color:#fff;height:100%;padding:0 18px;font-size:14px;font-weight:600;}

  .cats{display:flex;gap:8px;overflow-x:auto;padding:10px 12px 4px;-webkit-overflow-scrolling:touch;}
  .cats::-webkit-scrollbar{display:none;}
  .chip{flex:none;background:#fff;border:1px solid var(--line);color:#555;font-size:12.5px;
        border-radius:14px;padding:5px 13px;white-space:nowrap;}
  .chip.on{background:var(--o);border-color:var(--o);color:#fff;font-weight:600;}

  .sec{padding:6px 12px 0;}
  .sec h2{font-size:14px;font-weight:700;margin:10px 0 8px;display:flex;align-items:center;gap:6px;}
  .sec h2 i{width:3px;height:13px;background:var(--o);border-radius:2px;display:inline-block;}

  .shops{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch;}
  .shops::-webkit-scrollbar{display:none;}
  .shop{flex:none;width:150px;background:#fff;border-radius:var(--r);padding:10px 12px;box-shadow:0 1px 4px rgba(0,0,0,.04);}
  .shop .nm{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .shop .mt{font-size:11.5px;color:var(--sub);margin-top:5px;}
  .shop .mt b{color:var(--o);}
  .shop .tag{display:inline-block;font-size:10.5px;border-radius:8px;padding:1px 6px;margin-top:6px;}
  .shop .tag.on{background:#fff2e8;color:var(--o);}
  .shop .tag.off{background:#f2f2f2;color:#999;}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 12px;}
  .pc{background:#fff;border-radius:var(--r);overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.04);}
  .pc .th{position:relative;width:100%;aspect-ratio:1/1;background:#f2f2f2;overflow:hidden;}
  .pc .th img{width:100%;height:100%;object-fit:cover;}
  .pc .th .ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#cfcfcf;font-size:26px;}
  .pc .th .shopTag{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.55);color:#fff;
                   font-size:10.5px;border-radius:8px;padding:2px 7px;max-width:80%;white-space:nowrap;
                   overflow:hidden;text-overflow:ellipsis;}
  .pc .in{padding:8px 9px 10px;}
  .pc .nm{font-size:13px;line-height:1.35;height:35px;overflow:hidden;}
  .pc .pr{display:flex;align-items:baseline;justify-content:space-between;margin-top:6px;}
  .pc .pr .p{color:var(--o);font-weight:700;font-size:15px;}
  .pc .pr .p small{font-size:11px;font-weight:600;}
  .pc .pr .s{font-size:11px;color:var(--sub);}
  .pc .acts{display:flex;gap:6px;margin-top:8px;}
  .pc .acts button{flex:1;border:none;border-radius:14px;font-size:12px;font-weight:600;padding:6px 0;}
  .pc .acts .add{background:linear-gradient(135deg,var(--o),var(--o2));color:#fff;}
  .pc .acts .store{background:#fff;border:1px solid var(--line);color:#666;}

  .more{text-align:center;padding:14px 12px 4px;}
  .more button{border:1px solid var(--line);background:#fff;color:#666;font-size:13px;
               border-radius:16px;padding:8px 26px;}
  .empty{text-align:center;color:var(--sub);font-size:13px;padding:40px 20px;line-height:1.7;}
  .empty .big{font-size:34px;margin-bottom:8px;}

  /* ── 抽屉 ── */
  .mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:none;}
  .mask.show{display:block;}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--bg);
         border-radius:14px 14px 0 0;max-height:88vh;overflow-y:auto;transform:translateY(102%);
         transition:transform .26s ease;padding-bottom:calc(16px + env(safe-area-inset-bottom));}
  .sheet.show{transform:translateY(0);}
  .sheet .hd{position:sticky;top:0;background:#fff;padding:14px 16px;display:flex;align-items:center;
             justify-content:space-between;border-bottom:1px solid var(--line);z-index:2;}
  .sheet .hd b{font-size:15px;}
  .sheet .hd .x{border:none;background:none;font-size:20px;color:#bbb;line-height:1;}

  .tabs{display:flex;background:#fff;margin:10px 12px 0;border-radius:var(--r);overflow:hidden;}
  .tabs div{flex:1;text-align:center;padding:11px 0;font-size:14px;color:#666;}
  .tabs div.on{color:var(--o);font-weight:700;box-shadow:inset 0 -2px 0 var(--o);}
  .form{background:#fff;margin:10px 12px;border-radius:var(--r);padding:6px 14px 16px;}
  .form label{display:block;font-size:12.5px;color:#666;margin:12px 0 6px;}
  .form input{width:100%;border:1px solid var(--line);border-radius:8px;height:42px;padding:0 12px;font-size:14px;outline:none;}
  .form input:focus{border-color:var(--o);}
  .form .btn{width:100%;border:none;background:linear-gradient(135deg,var(--o),var(--o2));color:#fff;
             height:44px;border-radius:22px;font-size:15px;font-weight:700;margin-top:18px;}
  .form .hint{font-size:11.5px;color:var(--sub);margin-top:10px;line-height:1.6;}

  .meCard{background:#fff;margin:10px 12px;border-radius:var(--r);padding:14px 16px;}
  .meCard .row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;font-size:13.5px;}
  .meCard .row+.row{border-top:1px solid var(--line);}
  .meCard .row .k{color:#888;}
  .meCard .row .v{font-weight:600;}
  .meCard .logout{width:100%;border:1px solid var(--line);background:#fff;color:#e34d4d;
                  height:40px;border-radius:20px;font-size:13.5px;margin-top:12px;}

  .order{background:#fff;margin:10px 12px;border-radius:var(--r);padding:12px 14px;}
  .order .o1{display:flex;justify-content:space-between;font-size:12.5px;color:#888;}
  .order .o2{margin-top:7px;font-size:13.5px;line-height:1.5;}
  .order .o3{display:flex;justify-content:space-between;align-items:baseline;margin-top:8px;}
  .order .o3 .p{color:var(--o);font-weight:700;font-size:15px;}
  .order .o3 .lnk{font-size:12.5px;color:var(--o);}
  .order .st{font-size:11.5px;border-radius:8px;padding:2px 8px;}
  .st.PENDING_SHIP{background:#fff2e8;color:var(--o);}
  .st.SHIPPED{background:#e8f5ec;color:#1a9c52;}
  .st.CANCELLED{background:#f2f2f2;color:#999;}

  .addr{background:#fff;margin:10px 12px;border-radius:var(--r);padding:12px 14px;}
  .addr .a1{font-size:13.5px;font-weight:600;}
  .addr .a1 .def{font-size:10.5px;background:var(--o);color:#fff;border-radius:6px;padding:1px 6px;margin-left:6px;}
  .addr .a2{font-size:12.5px;color:#666;margin-top:5px;line-height:1.5;}
  .addr .a3{display:flex;gap:14px;margin-top:9px;font-size:12.5px;}
  .addr .a3 a{color:var(--o);text-decoration:none;}
  .addr .a3 a.del{color:#bbb;}
  .addBtn{display:block;margin:12px;width:calc(100% - 24px);border:1px dashed var(--o);background:#fff8f3;
          color:var(--o);height:42px;border-radius:10px;font-size:13.5px;font-weight:600;}
  .toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.78);
         color:#fff;font-size:13.5px;border-radius:8px;padding:10px 16px;z-index:99;display:none;max-width:80%;}

  /* ── 规格选择 ── */
  .skuTop{display:flex;gap:12px;background:#fff;margin:10px 12px;border-radius:var(--r);padding:12px 14px;}
  .skuTop .im{width:84px;height:84px;border-radius:8px;background:#f2f2f2;overflow:hidden;flex:none;}
  .skuTop .im img{width:100%;height:100%;object-fit:cover;}
  .skuTop .meta{flex:1;min-width:0;}
  .skuTop .meta .p{color:var(--o);font-weight:700;font-size:17px;margin-bottom:6px;}
  .skuTop .meta .n{font-size:12.5px;color:#666;line-height:1.5;}
  .skuGrp{background:#fff;margin:10px 12px;border-radius:var(--r);padding:12px 14px;}
  .skuGrp .t{font-size:12.5px;color:#666;margin-bottom:8px;}
  .opts{display:flex;flex-wrap:wrap;gap:8px;}
  .opt{border:1px solid var(--line);background:#fafafa;border-radius:8px;padding:6px 12px;font-size:12.5px;color:#444;}
  .opt.on{border-color:var(--o);background:#fff2e8;color:var(--o);font-weight:600;}
  .opt.off{opacity:.4;text-decoration:line-through;}
  .qtyRow{display:flex;align-items:center;gap:12px;margin-top:10px;}
  .qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden;}
  .qty button{border:none;background:#fafafa;width:32px;height:32px;font-size:16px;color:#666;}
  .qty span{min-width:42px;text-align:center;font-size:14px;}

  /* ── 购物车 ── */
  .cstore{background:#fff;margin:10px 12px;border-radius:var(--r);padding:10px 12px;}
  .cstore .hd2{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;padding-bottom:8px;
               border-bottom:1px solid var(--line);}
  .cstore .hd2 input{width:16px;height:16px;accent-color:var(--o);}
  .cstore .hd2 .off{margin-left:auto;font-size:11px;color:#e34d4d;font-weight:400;}
  .crow{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);}
  .crow:last-child{border-bottom:none;}
  .crow .im{width:70px;height:70px;border-radius:8px;background:#f2f2f2;overflow:hidden;flex:none;}
  .crow .im img{width:100%;height:100%;object-fit:cover;}
  .crow .meta{flex:1;min-width:0;display:flex;flex-direction:column;}
  .crow .meta .n{font-size:13px;line-height:1.35;max-height:35px;overflow:hidden;}
  .crow .meta .sp{font-size:11.5px;color:var(--sub);margin-top:3px;}
  .crow .meta .bad{font-size:11.5px;color:#e34d4d;margin-top:3px;}
  .crow .meta .bt{display:flex;align-items:baseline;justify-content:space-between;margin-top:auto;padding-top:6px;}
  .crow .meta .bt .p{color:var(--o);font-weight:700;font-size:14px;}
  .crow .meta .bt .del{font-size:12px;color:#bbb;}
  .checkoutBar{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);
               padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:12px;
               margin-top:10px;border-radius:0 0 12px 12px;}
  .checkoutBar .sum{flex:1;font-size:12.5px;color:#666;}
  .checkoutBar .sum b{color:var(--o);font-size:17px;}
  .checkoutBar button{border:none;background:linear-gradient(135deg,var(--o),var(--o2));color:#fff;
                      border-radius:22px;padding:11px 26px;font-size:14px;font-weight:700;}
  .checkoutBar button:disabled{background:#ddd;color:#fff;}

  .res{background:#fff;margin:10px 12px;border-radius:var(--r);padding:12px 14px;}
  .res .h{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;}
  .res .h .ok{color:#1a9c52;}
  .res .h .no{color:#e34d4d;}
  .res .b{font-size:12.5px;color:#666;margin-top:6px;line-height:1.6;}
  .res .b .no2{color:#e34d4d;}

  .dsec{background:#fff;margin:10px 12px;border-radius:var(--r);padding:12px 14px;}
  .dsec .r{display:flex;justify-content:space-between;font-size:12.5px;color:#555;padding:5px 0;}
  .dsec .r .k{color:#999;}
  .dsec .it{display:flex;justify-content:space-between;font-size:12.5px;padding:8px 0;border-top:1px solid var(--line);}
</style>
</head>
<body>
<div class="top">
  <div class="r1">
    <div class="brand">云裳智链 · 商城</div>
    <button class="tbtn" onclick="Cart.open()">购物车<span class="badge" id="cartBadge" style="display:none">0</span></button>
    <button class="tbtn" onclick="Mine.open()">我的</button>
  </div>
  <div class="search">
    <input id="kw" placeholder="搜索商品 / 款号" onkeydown="if(event.key==='Enter')Home.search()">
    <button onclick="Home.search()">搜索</button>
  </div>
</div>

<div class="cats" id="cats"></div>

<div class="sec">
  <h2><i></i>店铺</h2>
  <div class="shops" id="shops"></div>
</div>

<div class="sec"><h2><i></i><span id="listTitle">全部商品</span></h2></div>
<div class="cats" id="sorts" style="padding-top:0">
  <div class="chip on" data-s="newest" onclick="Home.setSort('newest')">最新上架</div>
  <div class="chip" data-s="price_asc" onclick="Home.setSort('price_asc')">价格从低到高</div>
  <div class="chip" data-s="price_desc" onclick="Home.setSort('price_desc')">价格从高到低</div>
</div>
<div class="grid" id="grid"></div>
<div class="more" id="more" style="display:none"><button onclick="Home.loadMore()">加载更多</button></div>

<div class="mask" id="mask" onclick="Sheet.close()"></div>
<div class="sheet" id="sheet">
  <div class="hd"><b id="sheetTitle">我的</b><button class="x" onclick="Sheet.close()">&times;</button></div>
  <div id="sheetBody"></div>
</div>
<div class="toast" id="toast"></div>

<script>
var API = '/api/shop/public';
var TOKEN_KEY = 'shop_consumer_token';
var USER_KEY = 'shop_consumer';
var state = { page: 1, pageSize: 20, keyword: '', category: '', categoryName: '', sort: 'newest', total: 0, loading: false };
var cartState = { groups: [], selected: {}, itemCount: 0, validAmount: 0 };

function $(id){ return document.getElementById(id); }
function toast(msg){
  var t = $('toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(t._tm); t._tm = setTimeout(function(){ t.style.display = 'none'; }, 2200);
}
function money(v){ return v === null || v === undefined ? '—' : '¥' + Number(v).toFixed(2); }
function stars(n){ var k = Math.max(0, Math.min(5, Math.round(Number(n) || 0))); return '★★★★★'.slice(0, k) + '☆☆☆☆☆'.slice(0, 5 - k); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function mask(p){ if(!p) return ''; var s = String(p);
  return s.length >= 7 ? s.substring(0,3)+'****'+s.substring(s.length-4) : s; }
function fmtTime(t){ return t ? String(t).replace('T',' ').substring(0,16) : ''; }
function isLogin(){ return !!localStorage.getItem(TOKEN_KEY); }
function num(v, d){ var n = Number(v); return isNaN(n) ? (d || 0) : n; }

/* ── 请求 ── */
function authHeaders(){
  var t = localStorage.getItem(TOKEN_KEY);
  return t ? { 'X-Shop-Token': t } : {};
}
function req(method, path, body){
  var opt = { method: method, headers: authHeaders() };
  if (body !== undefined) {
    opt.headers['Content-Type'] = 'application/json';
    opt.body = JSON.stringify(body || {});
  }
  return fetch(API + path, opt).then(function(r){ return r.json(); }).then(function(d){
    if (d && d.code === 200) return d.data;
    if (d && d.code === 401) { localStorage.removeItem(TOKEN_KEY); localStorage.removeItem(USER_KEY); }
    throw new Error((d && d.message) || '请求失败');
  });
}
function apiGet(path){ return req('GET', path); }
function apiPost(path, body){ return req('POST', path, body || {}); }

/* ── 抽屉 ── */
var Sheet = {
  open: function(title){
    $('sheetTitle').textContent = title || '';
    $('mask').className = 'mask show';
    $('sheet').className = 'sheet show';
    $('sheet').scrollTop = 0;
  },
  close: function(){ $('mask').className = 'mask'; $('sheet').className = 'sheet'; }
};

/* ── 首页 ── */
var Home = {
  init: function(){
    apiGet('/platform/home').then(function(d){
      renderCats(d.categories || []);
      renderShops(d.shops || []);
    }).catch(function(e){ toast(e.message); });
    this.reset();
    if (isLogin()) Cart.refreshBadge();
  },
  reset: function(){ state.page = 1; state.total = 0; $('grid').innerHTML = ''; this.load(false); },
  search: function(){
    state.keyword = ($('kw').value || '').trim();
    state.page = 1; $('grid').innerHTML = '';
    this.load(false);
  },
  pickCat: function(cat, name){
    state.category = (state.category === cat) ? '' : cat;
    state.categoryName = state.category ? (name || cat) : '';
    var chips = document.querySelectorAll('#cats .chip');
    for (var i = 0; i < chips.length; i++) {
      var c = chips[i].getAttribute('data-c') || '';
      chips[i].className = 'chip' + (c === (state.category || '') ? ' on' : '');
    }
    $('listTitle').textContent = state.categoryName ? ('类目：' + state.categoryName) : '全部商品';
    this.reset();
  },
  load: function(more){
    if (state.loading) return;
    state.loading = true;
    var q = '/platform/products?page=' + state.page + '&pageSize=' + state.pageSize
          + '&sort=' + encodeURIComponent(state.sort || 'newest')
          + (state.keyword ? '&keyword=' + encodeURIComponent(state.keyword) : '')
          + (state.category ? '&category=' + encodeURIComponent(state.category) : '');
    apiGet(q).then(function(d){
      state.total = d.total || 0;
      var html = (d.records || []).map(card).join('');
      if (more) $('grid').insertAdjacentHTML('beforeend', html);
      else $('grid').innerHTML = html;
      if (!state.total) {
        $('grid').innerHTML = '<div class="empty" style="grid-column:1/3"><div class="big">&#128717;</div>'
          + '暂时没有上架的商品<br><span style="font-size:12px">商家上架后会出现在这里</span></div>';
      }
      $('more').style.display = ($('grid').children.length < state.total) ? 'block' : 'none';
    }).catch(function(e){ toast(e.message); }).then(function(){ state.loading = false; });
  },
  loadMore: function(){ state.page += 1; this.load(true); },
  setSort: function(s){
    state.sort = s;
    var chips = document.querySelectorAll('#sorts .chip');
    for (var i = 0; i < chips.length; i++) {
      chips[i].className = 'chip' + (chips[i].getAttribute('data-s') === s ? ' on' : '');
    }
    this.reset();
  }
};

function card(p){
  var img = p.cover
    ? '<img src="' + esc(p.cover) + '" onerror="this.style.display=\'none\';this.parentNode.innerHTML=\'<div class=&quot;ph&quot;>&#128717;</div>\'">'
    : '<div class="ph">&#128717;</div>';
  var storeUrl = '/shop/index.html?s=' + encodeURIComponent(p.slug || '') + '#/p/' + p.styleId;
  var rv = num(p.reviewCount) > 0
    ? ('<span style="color:#ff9500">★' + Number(p.rating).toFixed(1) + ' (' + p.reviewCount + ')</span> · ')
    : '';
  return '<div class="pc">'
    + '<div class="th" onclick="Sku.open(' + p.styleId + ',\'' + esc(p.slug || '') + '\')">'
    + img + '<div class="shopTag">' + esc(p.shopName || '') + '</div></div>'
    + '<div class="in">'
    + '<div class="nm">' + esc(p.styleName || p.styleNo || '未命名商品') + '</div>'
    + '<div class="pr"><span class="p"><small>¥</small>' + (p.minPrice == null ? '—' : Number(p.minPrice).toFixed(2)) + '</span>'
    + '<span class="s">' + rv + num(p.totalStock) + ' 件可售</span></div>'
    + '<div class="acts">'
    + '<button class="add" onclick="Sku.open(' + p.styleId + ',\'' + esc(p.slug || '') + '\')">加入购物车</button>'
    + '<button class="store" onclick="location.href=\'' + storeUrl + '\'">进店</button>'
    + '</div></div></div>';
}

function renderCats(cats){
  // 词表有 40 个类目，全列出来顾客会被淹没 → 只展示「有商品」的。
  // 展示一律用中文名（c.name）：库里同一个类目可能是 WOMAN 也可能是「女装」，
  // 后端已归并成中文规范类目，这里不再自己拼。
  var list = (cats || []).filter(function(c){ return num(c.cnt) > 0; });
  if (!list.length) { $('cats').innerHTML = ''; return; }
  var html = '<div class="chip on" data-c="" onclick="Home.pickCat(\'\',\'\')">全部</div>';
  html += list.map(function(c){
    var name = c.name || c.category;
    return '<div class="chip" data-c="' + esc(c.category) + '"'
      + ' onclick="Home.pickCat(\'' + esc(c.category) + '\',\'' + esc(name) + '\')">'
      + esc(name) + ' (' + num(c.cnt) + ')</div>';
  }).join('');
  $('cats').innerHTML = html;
}

function renderShops(shops){
  if (!shops.length) {
    $('shops').innerHTML = '<div class="empty" style="padding:16px 0">还没有店铺</div>';
    return;

  $('shops').innerHTML = shops.map(function(s){
    return '<div class="shop" onclick="location.href=\'/shop/index.html?s=' + encodeURIComponent(s.slug) + '\'">'
      + '<div class="nm">' + esc(s.shopName) + '</div>'
      + '<div class="mt"><b>' + num(s.productCount) + '</b> 件商品</div>'
      + '<span class="tag ' + (s.enabled ? 'on' : 'off') + '">' + (s.enabled ? '营业中' : '已打烊') + '</span>'
      + '</div>';
  }).join('');
}

/* ── 规格选择 + 加购 ── */
var Sku = {
  data: null, color: null, size: null, qty: 1, slug: '', styleId: null,
  open: function(styleId, slug){
    if (!slug) { toast('该商品所属店铺信息缺失'); return; }
    this.data = null; this.color = null; this.size = null; this.qty = 1;
    this.slug = slug; this.styleId = styleId;
    Sheet.open('选择规格');
    $('sheetBody').innerHTML = '<div class="empty">加载中…</div>';
    apiGet('/' + slug + '/products/' + styleId).then(function(d){
      Sku.data = d;
      var colors = [], sizes = [];
      (d.skus || []).forEach(function(k){
        if (k.color && colors.indexOf(k.color) < 0) colors.push(k.color);
        if (k.size && sizes.indexOf(k.size) < 0) sizes.push(k.size);
      });
      Sku.color = colors.length ? colors[0] : null;
      Sku.size = sizes.length ? sizes[0] : null;
      Sku.render();
      Sku.loadReviews();
    }).catch(function(e){
      $('sheetBody').innerHTML = '<div class="empty">' + esc(e.message) + '</div>';
    });
  },
  cur: function(){
    var d = this.data; if (!d) return null;
    var self = this, found = null;
    (d.skus || []).forEach(function(k){
      if (found) return;
      var cOk = self.color === null || k.color === self.color;
      var sOk = self.size === null || k.size === self.size;
      if (cOk && sOk) found = k;
    });
    return found;
  },
  render: function(){
    var d = this.data; if (!d) return;
    var cur = this.cur();
    var colors = [], sizes = [];
    (d.skus || []).forEach(function(k){
      if (k.color && colors.indexOf(k.color) < 0) colors.push(k.color);
      if (k.size && sizes.indexOf(k.size) < 0) sizes.push(k.size);
    });
    var img = (d.colorImages && this.color && d.colorImages[this.color]) || d.cover;
    var html = '<div class="skuTop">'
      + '<div class="im">' + (img ? '<img src="' + esc(img) + '">' : '') + '</div>'
      + '<div class="meta"><div class="p">' + money(cur ? cur.price : null) + '</div>'
      + '<div class="n">' + esc(d.styleName || d.styleNo || '') + '<br>'
      + '库存 ' + num(cur ? cur.stock : 0) + ' 件</div></div></div>';

    if (colors.length) {
      html += '<div class="skuGrp"><div class="t">颜色</div><div class="opts">'
        + colors.map(function(c){
            return '<div class="opt' + (c === Sku.color ? ' on' : '') + '" onclick="Sku.pick(\'color\',\'' + esc(c) + '\')">' + esc(c) + '</div>';
          }).join('') + '</div></div>';
    }
    if (sizes.length) {
      html += '<div class="skuGrp"><div class="t">尺码</div><div class="opts">'
        + sizes.map(function(s){
            var ok = Sku.stockOf(s);
            return '<div class="opt' + (s === Sku.size ? ' on' : '') + (ok > 0 ? '' : ' off')
              + '" onclick="Sku.pick(\'size\',\'' + esc(s) + '\')">' + esc(s) + '</div>';
          }).join('') + '</div></div>';
    }
    html += '<div class="skuGrp"><div class="t">数量</div><div class="qtyRow">'
      + '<div class="qty"><button onclick="Sku.qtyAdd(-1)">−</button><span id="skuQty">' + this.qty + '</span>'
      + '<button onclick="Sku.qtyAdd(1)">＋</button></div>'
      + '<span style="font-size:12px;color:#999">最多 ' + num(cur ? cur.stock : 0) + ' 件</span></div></div>'
      + '<div id="skuReviews"></div>'
      + '<div class="form" style="padding-top:16px"><button class="btn" onclick="Sku.add()">加入购物车</button>'
      + '<div class="hint">加入后可在「购物车」里跨店一起结算，一次结算会按店铺分别生成订单。</div></div>';
    $('sheetBody').innerHTML = html;
  },
  /** P2：商品评价（公开可读，无需登录） */
  loadReviews: function(){
    var box = $('skuReviews');
    if (!box || !this.styleId) return;
    apiGet('/platform/styles/' + this.styleId + '/reviews').then(function(d){
      var el = $('skuReviews');
      if (!el) return;
      if (!d || !num(d.count)) {
        el.innerHTML = '<div class="skuGrp"><div class="t">用户评价</div>'
          + '<div style="font-size:12.5px;color:#999">还没有评价</div></div>';
        return;
      }
      var h = '<div class="skuGrp"><div class="t">用户评价 <b style="color:#ff9500">★'
        + Number(d.rating).toFixed(1) + '</b> <span style="color:#999">共 ' + d.count + ' 条</span></div>';
      (d.records || []).forEach(function(r){
        h += '<div style="border-top:1px solid #f0f0f0;padding:9px 0">'
          + '<div style="display:flex;justify-content:space-between;font-size:12.5px">'
          + '<span style="color:#666">' + esc(r.nickname) + '</span>'
          + '<span style="color:#ff9500">' + stars(num(r.rating)) + '</span></div>'
          + (r.content ? '<div style="font-size:12.5px;color:#333;margin-top:5px;line-height:1.5">' + esc(r.content) + '</div>' : '')
          + '<div style="font-size:11px;color:#bbb;margin-top:4px">' + esc(fmtTime(r.createTime)) + '</div>'
          + '</div>';
      });
      h += '</div>';
      el.innerHTML = h;
    }).catch(function(){ /* 评价加载失败不打扰下单 */ });
  },
  stockOf: function(size){
    var d = this.data; if (!d) return 0;
    var self = this, stock = 0;
    (d.skus || []).forEach(function(k){
      if (k.size !== size) return;
      if (self.color !== null && k.color !== self.color) return;
      stock += num(k.stock);
    });
    return stock;
  },
  pick: function(kind, v){
    if (kind === 'color') this.color = v; else this.size = v;
    if (this.qty < 1) this.qty = 1;
    this.render();
  },
  qtyAdd: function(delta){
    var cur = this.cur();
    var max = Math.max(1, num(cur ? cur.stock : 1));
    this.qty = Math.min(max, Math.max(1, this.qty + delta));
    var el = $('skuQty'); if (el) el.textContent = this.qty;
  },
  add: function(){
    if (!isLogin()) {
      Sheet.close();
      toast('请先登录后再加入购物车');
      Mine.open();
      return;
    }
    var cur = this.cur();
    if (!cur) { toast('请选择规格'); return; }
    apiPost('/me/cart', { skuId: cur.skuId, quantity: this.qty }).then(function(){
      toast('已加入购物车');
      Sheet.close();
      Cart.refreshBadge();
    }).catch(function(e){ toast(e.message); });
  }
};

/* ── 购物车 ── */
var Cart = {
  open: function(){
    if (!isLogin()) { toast('请先登录'); Mine.open(); return; }
    Sheet.open('购物车');
    $('sheetBody').innerHTML = '<div class="empty">加载中…</div>';
    this.load();
  },
  refreshBadge: function(){
    if (!isLogin()) { $('cartBadge').style.display = 'none'; return; }
    apiGet('/me/cart').then(function(d){
      var n = num(d.lineCount);
      var b = $('cartBadge');
      b.textContent = n; b.style.display = n > 0 ? 'block' : 'none';
    }).catch(function(){ /* 角标失败静默，不打扰浏览 */ });
  },
  load: function(){
    var self = this;
    apiGet('/me/cart').then(function(d){
      cartState.groups = d.groups || [];
      cartState.itemCount = num(d.itemCount);
      cartState.validAmount = num(d.validAmount);
      // 默认全选「可买」的店铺；失效项默认不选
      var sel = {};
      cartState.groups.forEach(function(g){
        var canBuy = (g.items || []).some(function(it){ return it.available; });
        if (canBuy) sel[g.tenantId] = true;
      });
      cartState.selected = sel;
      self.render();
      self.refreshBadge();
    }).catch(function(e){
      $('sheetBody').innerHTML = '<div class="empty">' + esc(e.message) + '</div>';
    });
  },
  render: function(){
    if (!cartState.groups.length) {
      $('sheetBody').innerHTML = '<div class="empty"><div class="big">&#128722;</div>购物车还是空的'
        + '<div style="margin-top:14px"><button class="addBtn" style="margin:0 auto;width:180px" '
        + 'onclick="Sheet.close()">去逛逛</button></div></div>';
      return;
    }
    var html = '';
    cartState.groups.forEach(function(g){
      var shopOff = !g.shopEnabled;
      var checked = !!cartState.selected[g.tenantId];
      html += '<div class="cstore">'
        + '<div class="hd2"><input type="checkbox" ' + (checked ? 'checked' : '')
        + ' onchange="Cart.toggle(' + g.tenantId + ')">'
        + '<span>' + esc(g.shopName || '店铺') + '</span>'
        + (shopOff ? '<span class="off">店铺已打烊</span>' : '')
        + '</div>';
      (g.items || []).forEach(function(it){
        html += '<div class="crow">'
          + '<div class="im">' + (it.image || it.cover ? '<img src="' + esc(it.image || it.cover) + '">' : '') + '</div>'
          + '<div class="meta">'
          + '<div class="n">' + esc(it.styleName || it.styleNo || '') + '</div>'
          + '<div class="sp">' + esc([it.color, it.size].filter(Boolean).join(' / ')) + '</div>'
          + (it.available ? '' : '<div class="bad">' + esc(it.unavailableReason || '不可购买') + '</div>')
          + '<div class="bt"><span class="p">' + money(it.salesPrice) + '</span>'
          + '<span class="qty" style="transform:scale(.9);transform-origin:right center">'
          + '<button onclick="Cart.setQty(\'' + it.cartItemId + '\',' + (num(it.quantity) - 1) + ')">−</button>'
          + '<span>' + num(it.quantity) + '</span>'
          + '<button onclick="Cart.setQty(\'' + it.cartItemId + '\',' + (num(it.quantity) + 1) + ')">＋</button>'
          + '</span>'
          + '<a class="del" href="javascript:;" onclick="Cart.del(\'' + it.cartItemId + '\')">删除</a>'
          + '</div></div></div>';
      });
      html += '</div>';
    });

    var selCount = 0, selAmount = 0;
    cartState.groups.forEach(function(g){
      if (!cartState.selected[g.tenantId]) return;
      selCount++;
      (g.items || []).forEach(function(it){ if (it.available) selAmount += num(it.amount); });
    });
    html += '<div class="checkoutBar"><div class="sum">已选 ' + selCount + ' 家店<br>'
      + '合计 <b>' + money(selAmount) + '</b></div>'
      + '<button ' + (selCount ? '' : 'disabled') + ' onclick="Cart.checkout()">结算</button></div>';
    $('sheetBody').innerHTML = html;
  },
  toggle: function(tenantId){
    cartState.selected[tenantId] = !cartState.selected[tenantId];
    this.render();
  },
  setQty: function(cartItemId, q){
    if (q < 1) { this.del(cartItemId); return; }
    var self = this;
    apiPost('/me/cart/' + cartItemId + '/quantity', { quantity: q })
      .then(function(){ self.load(); })
      .catch(function(e){ toast(e.message); });
  },
  del: function(cartItemId){
    var self = this;
    apiPost('/me/cart/' + cartItemId + '/delete').then(function(){ toast('已移出'); self.load(); })
      .catch(function(e){ toast(e.message); });
  },
  checkout: function(){
    var ids = [];
    cartState.groups.forEach(function(g){ if (cartState.selected[g.tenantId]) ids.push(g.tenantId); });
    if (!ids.length) { toast('请先选择要结算的店铺'); return; }
    Sheet.open('确认收货信息');
    $('sheetBody').innerHTML = '<div class="empty">加载中…</div>';
    apiGet('/me/addresses').then(function(list){
      var def = null;
      (list || []).forEach(function(a){ if (a.isDefault === 1 && !def) def = a; });
      if (!def && list && list.length) def = list[0];
      var name = def ? def.consignee : '';
      var phone = def ? def.phone : '';
      var addr = def ? [def.province, def.city, def.district, def.detailAddr].filter(Boolean).join('') : '';
      $('sheetBody').innerHTML =
        '<div class="form">'
        + '<label>收货人</label><input id="ck-name" maxlength="20" value="' + esc(name) + '" placeholder="姓名">'
        + '<label>联系电话</label><input id="ck-phone" maxlength="11" inputmode="numeric" value="' + esc(phone) + '" placeholder="11 位手机号">'
        + '<label>收货地址</label><input id="ck-addr" maxlength="160" value="' + esc(addr) + '" placeholder="省市区 + 详细地址">'
        + '<label>买家留言（选填）</label><input id="ck-remark" maxlength="100" placeholder="给商家的话">'
        + '<button class="btn" onclick="Cart.doCheckout(' + JSON.stringify(ids).replace(/"/g, '') + ')">提交订单</button>'
        + '<div class="hint">本次将按店铺拆成 ' + ids.length + ' 张订单，分别由各店铺发货；'
        + '货款由各店铺自行收取。</div></div>';
    }).catch(function(){
      Sheet.close();
      toast('加载收货信息失败');
    });
  },
  doCheckout: function(ids){
    var name = ($('ck-name').value || '').trim();
    var phone = ($('ck-phone').value || '').trim();
    var addr = ($('ck-addr').value || '').trim();
    if (!name) return toast('请填写收货人');
    if (!/^1[3-9]\d{9}$/.test(phone)) return toast('请填写正确的手机号');
    if (!addr) return toast('请填写收货地址');
    apiPost('/me/checkout', {
      customerName: name, phone: phone, address: addr,
      remark: ($('ck-remark').value || '').trim(),
      tenantIds: ids
    }).then(function(d){
      Cart.result(d);
      Cart.refreshBadge();
    }).catch(function(e){ toast(e.message); });
  },
  result: function(d){
    Sheet.open('下单结果');
    var html = '<div class="form" style="padding-top:14px"><div style="font-size:13.5px;line-height:1.7">'
      + '共 ' + d.storeCount + ' 家店铺：成功 <b style="color:#1a9c52">' + d.successCount + '</b> 家'
      + (d.failedCount ? '，失败 <b style="color:#e34d4d">' + d.failedCount + '</b> 家' : '')
      + '，合计 ' + money(d.paidAmount) + '</div></div>';
    (d.orders || []).forEach(function(o){
      html += '<div class="res"><div class="h">'
        + (o.success ? '<span class="ok">&#10003; 下单成功</span>' : '<span class="no">&#10007; 未成功</span>')
        + '<span style="font-weight:400;color:#888;font-size:12.5px">' + esc(o.shopName || '') + '</span></div>'
        + '<div class="b">' + (o.success
            ? ('订单号 ' + esc(o.orderNo) + '<br>商品 ' + money(o.goodsAmount) + ' + 运费 ' + money(o.shippingFee)
               + ' = <b>' + money(o.totalAmount) + '</b>')
            : ('<span class="no2">' + esc(o.message || '下单失败') + '</span><br>该店铺商品仍保留在购物车'))
        + '</div></div>';
    });
    html += '<div class="form"><button class="btn" onclick="Mine.open()">查看我的订单</button>'
      + '<div class="hint">订单由各店铺分别发货，发货后可在此查看快递信息。</div></div>';
    $('sheetBody').innerHTML = html;
  }
};

          + '<span class="st ' + esc(o.status) + '">' + (names[o.status] || o.status) + extra + '</span></div>'
          + '<div style="text-align:right;margin-top:8px"><a class="lnk" href="javascript:;" '
          + 'onclick="OrderDetail.open(\'' + esc(o.orderNo) + '\')">查看详情 &gt;</a></div>'

  },
  loadAddrs: function(){
    apiGet('/me/addresses').then(function(list){
      if (!list || !list.length) { $('addrs').innerHTML = '<div class="empty">还没有收货地址</div>'; return; }
      $('addrs').innerHTML = list.map(function(a){
        return '<div class="addr">'
          + '<div class="a1">' + esc(a.consignee) + ' ' + esc(a.phone)
          + (a.isDefault === 1 ? '<span class="def">默认</span>' : '') + '</div>'
          + '<div class="a2">' + esc([a.province, a.city, a.district, a.detailAddr].filter(Boolean).join(' ')) + '</div>'
          + '<div class="a3">'
          + (a.isDefault === 1 ? '' : '<a href="javascript:;" onclick="Mine.setDefault(\'' + a.id + '\')">设为默认</a>')
          + '<a class="del" href="javascript:;" onclick="Mine.delAddr(\'' + a.id + '\')">删除</a>'
          + '</div></div>';
      }).join('');
    }).catch(function(e){ $('addrs').innerHTML = '<div class="empty">' + esc(e.message) + '</div>'; });
  },
  setDefault: function(id){
    apiPost('/me/addresses/' + id + '/default').then(function(){ toast('已设为默认'); Mine.loadAddrs(); })
      .catch(function(e){ toast(e.message); });
  },
  delAddr: function(id){
    if (!confirm('确认删除该地址？')) return;
    apiPost('/me/addresses/' + id + '/delete').then(function(){ toast('已删除'); Mine.loadAddrs(); })
      .catch(function(e){ toast(e.message); });
  },
  addAddr: function(){
    $('sheetTitle').textContent = '新增收货地址';
    $('sheetBody').innerHTML =
      '<div class="form">'
      + '<label>收货人</label><input id="a-name" maxlength="20" placeholder="姓名">'
      + '<label>手机号</label><input id="a-phone" maxlength="11" inputmode="numeric" placeholder="11 位手机号">'
      + '<label>省 / 市 / 区</label>'
      + '<div style="display:flex;gap:8px">'
      + '<input id="a-prov" placeholder="省" style="flex:1">'
      + '<input id="a-city" placeholder="市" style="flex:1">'
      + '<input id="a-dist" placeholder="区" style="flex:1">'
      + '</div>'
      + '<label>详细地址</label><input id="a-detail" maxlength="120" placeholder="街道、门牌号等">'
      + '<button class="btn" onclick="Mine.saveAddr()">保存</button>'
      + '<div class="hint">保存后可在所有店铺下单时复用。</div></div>';
  },
  saveAddr: function(){
    var name = ($('a-name').value || '').trim();
    var phone = ($('a-phone').value || '').trim();
    var detail = ($('a-detail').value || '').trim();
    if (!name) return toast('请填写收货人');
    if (!/^1[3-9]\d{9}$/.test(phone)) return toast('请填写正确的手机号');
    if (!detail) return toast('请填写详细地址');
    apiPost('/me/addresses', {
      consignee: name, phone: phone, detailAddr: detail,
      province: ($('a-prov').value || '').trim(),
      city: ($('a-city').value || '').trim(),
      district: ($('a-dist').value || '').trim(),
      isDefault: true
    }).then(function(){
      toast('已保存');
      $('sheetTitle').textContent = '我的';
      Mine.renderMe();
    }).catch(function(e){ toast(e.message); });
  }
};

/* ── 订单详情 ── */
var OrderDetail = {
  order: null,
  open: function(orderNo){
    Sheet.open('订单详情');
    $('sheetBody').innerHTML = '<div class="empty">加载中…</div>';
    apiGet('/me/orders/' + encodeURIComponent(orderNo)).then(function(o){
      OrderDetail.order = o;
      OrderDetail.render();
    }).catch(function(e){
      $('sheetBody').innerHTML = '<div class="empty">' + esc(e.message) + '</div>';
    });
  },
  render: function(){
    var o = this.order;
    if (!o) return;
    var names = { PENDING_SHIP: '待发货', SHIPPED: '已发货', CANCELLED: '已取消' };
    var afterNames = { APPLIED: '待商家处理', APPROVED: '已同意', REJECTED: '已拒绝' };
    var html = '<div class="dsec">'
      + '<div class="r"><span class="k">订单号</span><span>' + esc(o.orderNo) + '</span></div>'
      + '<div class="r"><span class="k">店铺</span><span>' + esc(o.shopName || '') + '</span></div>'
      + '<div class="r"><span class="k">状态</span><span>' + esc(names[o.status] || o.status) + '</span></div>'
      + '<div class="r"><span class="k">下单时间</span><span>' + esc(fmtTime(o.createTime)) + '</span></div>'
      + '<div class="r"><span class="k">收货人</span><span>' + esc(o.customerName || '') + ' ' + esc(mask(o.phone)) + '</span></div>'
      + '<div class="r"><span class="k">收货地址</span><span style="max-width:60%;text-align:right">' + esc(o.address || '') + '</span></div>'
      + (o.remark ? '<div class="r"><span class="k">买家留言</span><span style="max-width:60%;text-align:right">' + esc(o.remark) + '</span></div>' : '')
      + '</div>';

    html += '<div class="dsec"><div style="font-size:13px;font-weight:600;margin-bottom:6px">商品明细</div>';
    (o.items || []).forEach(function(it, idx){
      var canReview = o.status === 'SHIPPED' && !it.reviewed;
      html += '<div style="border-top:1px solid #f0f0f0;padding:9px 0">'
        + '<div style="display:flex;justify-content:space-between;font-size:12.5px">'
        + '<span>' + esc(it.styleName || it.styleNo || '') + ' '
        + esc([it.color, it.size].filter(Boolean).join('/')) + ' × ' + num(it.quantity) + '</span>'
        + '<span>' + money(it.amount) + '</span></div>'
        + (it.reviewed
            ? '<div style="font-size:11.5px;color:#ff9500;margin-top:6px">已评价 '
              + stars(num(it.myRating)) + (it.myReview ? '：' + esc(it.myReview) : '') + '</div>'
            : (canReview
                ? '<div style="text-align:right;margin-top:6px"><a href="javascript:;" class="lnk" '
                  + 'onclick="Review.open(' + idx + ')">评价</a></div>'
                : ''))
        + '</div>';
    });
    html += '<div class="it"><span>商品金额</span><span>' + money(o.goodsAmount) + '</span></div>'
      + '<div class="it"><span>运费</span><span>' + money(o.shippingFee) + '</span></div>'
      + '<div class="it"><span><b>合计</b></span><span><b style="color:#ff5000">' + money(o.totalAmount) + '</b></span></div>'
      + '</div>';

    if (o.expressNo || o.shipTime) {
      html += '<div class="dsec"><div style="font-size:13px;font-weight:600;margin-bottom:6px">物流信息</div>'
        + '<div class="r"><span class="k">快递公司</span><span>' + esc(o.expressCompany || '—') + '</span></div>'
        + '<div class="r"><span class="k">快递单号</span><span>' + esc(o.expressNo || '—') + '</span></div>'
        + '<div class="r"><span class="k">发货时间</span><span>' + esc(fmtTime(o.shipTime)) + '</span></div>'
        + '</div>';
    }

    var asStatus = o.afterSaleStatus || 'NONE';
    if (asStatus !== 'NONE') {
      html += '<div class="dsec"><div style="font-size:13px;font-weight:600;margin-bottom:6px">售后</div>'
        + '<div class="r"><span class="k">类型</span><span>'
        + (o.afterSaleType === 'RETURN_REFUND' ? '退货退款' : '仅退款') + '</span></div>'
        + '<div class="r"><span class="k">状态</span><span>' + esc(afterNames[asStatus] || asStatus) + '</span></div>'
        + (o.afterSaleReason ? '<div class="r"><span class="k">申请原因</span><span style="max-width:60%;text-align:right">' + esc(o.afterSaleReason) + '</span></div>' : '')
        + (o.afterSaleRemark ? '<div class="r"><span class="k">商家处理</span><span style="max-width:60%;text-align:right">' + esc(o.afterSaleRemark) + '</span></div>' : '')
        + '</div>';
    }

    if (o.cancelReason) {
      html += '<div class="dsec"><div class="r"><span class="k">取消原因</span><span>' + esc(o.cancelReason) + '</span></div></div>';
    }

    // P2：未发货 → 买家可直接取消（回补库存 + 撤销应收）
    if (o.status === 'PENDING_SHIP') {
      html += '<div class="form" style="padding-top:14px"><button class="btn" '
        + 'style="background:#fff;border:1px solid #ff5000;color:#ff5000" onclick="CancelOrder.open()">'
        + '取消订单</button>'
        + '<div class="hint">未发货可直接取消：库存会自动退回、挂账应收会撤销。'
        + '已发货的订单请改用「申请售后」。</div></div>';
    }

    // P2：已发货且没有待处理/已完成的售后 → 允许买家发起售后
    if (o.status === 'SHIPPED' && (asStatus === 'NONE' || asStatus === 'REJECTED')) {
      html += '<div class="form" style="padding-top:14px"><button class="btn" '
        + 'style="background:#fff;border:1px solid #ff5000;color:#ff5000" onclick="AfterSale.open()">'
        + '申请售后（退款 / 退货退款）</button>'
        + '<div class="hint">未发货的订单请直接取消订单；售后申请提交后由店铺处理，平台不参与仲裁。</div></div>';
    }

    html += '<div class="form"><button class="btn" onclick="Mine.open()">返回我的订单</button></div>';
    $('sheetBody').innerHTML = html;
  }
};

/* ── P2：取消订单 ── */
var CancelOrder = {
  open: function(){
    Sheet.open('取消订单');
    $('sheetBody').innerHTML =
      '<div class="form">'
      + '<div style="font-size:13px;line-height:1.7;color:#666">取消后：'
      + '库存自动退回店铺，挂账应收自动撤销。订单不可恢复，需要请重新下单。</div>'
      + '<label>取消原因（选填）</label>'
      + '<input id="co-reason" maxlength="200" placeholder="如：下错单 / 地址填错 / 不想要了">'
      + '<button class="btn" onclick="CancelOrder.submit()">确认取消</button>'
      + '<div class="hint">若订单已被店铺发货，将无法取消，请改用「申请售后」。</div></div>';
  },
  submit: function(){
    apiPost('/me/orders/' + encodeURIComponent(OrderDetail.order.orderNo) + '/cancel', {
      reason: ($('co-reason').value || '').trim()
    }).then(function(){
      toast('订单已取消');
      OrderDetail.open(OrderDetail.order.orderNo);
      Cart.refreshBadge();
    }).catch(function(e){ toast(e.message); });
  }
};

/* ── P2：评价 ── */
var Review = {
  idx: 0, rating: 5,
  open: function(idx){
    this.idx = idx; this.rating = 5;
    var it = (OrderDetail.order.items || [])[idx] || {};
    Sheet.open('评价商品');
    $('sheetBody').innerHTML =
      '<div class="skuGrp"><div class="t">' + esc(it.styleName || it.styleNo || '') + '</div>'
      + '<div style="font-size:12px;color:#999">' + esc([it.color, it.size].filter(Boolean).join('/')) + '</div></div>'
      + '<div class="skuGrp"><div class="t">评分</div>'
      + '<div style="font-size:26px;letter-spacing:4px;color:#ff9500" id="rvStars">' + stars(5) + '</div>'
      + '<div style="display:flex;gap:8px;margin-top:8px" id="rvBtns">'
      + [1,2,3,4,5].map(function(n){ return '<div class="opt" onclick="Review.setStars(' + n + ')">' + n + ' 星</div>'; }).join('')
      + '</div></div>'
      + '<div class="form">'
      + '<label>评价内容（选填）</label>'
      + '<textarea id="rvText" maxlength="500" style="width:100%;height:90px;border:1px solid #f0f0f0;'
      + 'border-radius:8px;padding:10px;font-size:14px;outline:none;font-family:inherit" '
      + 'placeholder="说说这件衣服的版型、面料、做工…"></textarea>'
      + '<label style="display:flex;align-items:center;gap:6px;margin-top:10px">'
      + '<input type="checkbox" id="rvAnon" style="width:auto;height:auto"> 匿名评价</label>'
      + '<button class="btn" onclick="Review.submit()">提交评价</button>'
      + '<div class="hint">评价提交后不可修改，请如实填写。</div></div>';
  },
  setStars: function(n){
    this.rating = n;
    $('rvStars').textContent = stars(n);
  },
  submit: function(){
    var it = (OrderDetail.order.items || [])[this.idx] || {};
    apiPost('/me/orders/' + encodeURIComponent(OrderDetail.order.orderNo) + '/reviews', {
      styleNo: it.styleNo,
      rating: this.rating,
      content: ($('rvText').value || '').trim(),
      anonymous: $('rvAnon').checked
    }).then(function(){
      toast('感谢您的评价');
      OrderDetail.open(OrderDetail.order.orderNo);
    }).catch(function(e){ toast(e.message); });
  }
};

/* ── P2：售后申请 ── */
var AfterSale = {
  type: 'REFUND_ONLY',
  open: function(){
    Sheet.open('申请售后');
    $('sheetBody').innerHTML =
      '<div class="form">'
      + '<label>售后类型</label>'
      + '<div class="opts">'
      + '<div class="opt on" id="as-refund" onclick="AfterSale.pick(\'REFUND_ONLY\')">仅退款（货不退）</div>'
      + '<div class="opt" id="as-return" onclick="AfterSale.pick(\'RETURN_REFUND\')">退货退款（回寄商品）</div>'
      + '</div>'
      + '<label>申请原因</label>'
      + '<input id="as-reason" maxlength="200" placeholder="如：颜色与图片不符 / 尺码偏小 / 有瑕疵">'
      + '<button class="btn" onclick="AfterSale.submit()">提交申请</button>'
      + '<div class="hint">提交后由店铺处理。退货退款需按商家指引寄回商品；'
      + '款项由店铺线下退还（平台不经手货款）。</div></div>';
  },
  pick: function(t){
    this.type = t;
    $('as-refund').className = 'opt' + (t === 'REFUND_ONLY' ? ' on' : '');
    $('as-return').className = 'opt' + (t === 'RETURN_REFUND' ? ' on' : '');
  },
  submit: function(){
    apiPost('/me/orders/' + encodeURIComponent(OrderDetail.order.orderNo) + '/after-sale', {
      type: this.type,
      reason: ($('as-reason').value || '').trim()
    }).then(function(){
      toast('售后申请已提交');
      OrderDetail.open(OrderDetail.order.orderNo);
    }).catch(function(e){ toast(e.message); });
  }
};

Home.init();
</script>
</body>
</html>
