<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ff5000">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23ff5000'/%3E%3Ctext x='32' y='45' font-size='38' text-anchor='middle' fill='%23fff' font-family='PingFang SC,Microsoft YaHei,sans-serif'%3E%E4%BA%91%3C/text%3E%3C/svg%3E">
<title>店铺</title>
<style>
  :root{
    --tb-orange:#ff5000;
    --tb-orange-2:#ff7a1a;
    --tb-red:#ff0036;
    --tb-bg:#f4f4f4;
    --tb-card:#fff;
    --tb-text:#1a1a1a;
    --tb-sub:#999;
    --tb-line:#f0f0f0;
    --tb-radius:10px;
    --tb-shadow:0 1px 4px rgba(0,0,0,.04);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--tb-bg);color:var(--tb-text);-webkit-font-smoothing:antialiased;}
  img{display:block;}
  button{font-family:inherit;cursor:pointer;}
  input,textarea{font-family:inherit;}

  /* ── 顶部搜索（吸顶） ── */
  .sf-top{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,var(--tb-orange),var(--tb-orange-2));padding:10px 12px 12px;padding-top:calc(10px + env(safe-area-inset-top));}
  .sf-top .row1{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;}
  .sf-top .shopname{color:#fff;font-size:16px;font-weight:600;max-width:60%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .sf-top .follow{border:none;background:rgba(255,255,255,.95);color:var(--tb-orange);font-size:12px;font-weight:600;border-radius:14px;padding:5px 14px;}
  .sf-top .follow.on{background:rgba(255,255,255,.22);color:#fff;}
  /* P0：回平台商城的入口（本店只是平台里的一家店） */
  .sf-top .mall{border:none;background:rgba(255,255,255,.22);color:#fff;font-size:12px;font-weight:600;
                border-radius:14px;padding:5px 12px;text-decoration:none;white-space:nowrap;}
  .sf-search{display:flex;align-items:center;background:#fff;border-radius:18px;overflow:hidden;height:36px;}
  .sf-search .ico{padding:0 8px 0 12px;color:var(--tb-sub);font-size:14px;}
  .sf-search input{flex:1;border:none;outline:none;font-size:14px;height:100%;background:transparent;}
  .sf-search .go{border:none;background:var(--tb-orange);color:#fff;height:100%;padding:0 18px;font-size:14px;font-weight:600;}

  /* ── 店铺头图 ── */
  .sf-banner{height:110px;background:linear-gradient(135deg,var(--tb-orange),var(--tb-orange-2));position:relative;overflow:hidden;}
  .sf-banner .bg{position:absolute;inset:0;background-size:cover;background-position:center;filter:blur(14px);transform:scale(1.25);opacity:.5;}
  .sf-banner .mask{position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,80,0,.55),rgba(255,80,0,.85));}

  /* ── 店铺信息卡 ── */
  .sf-shop{background:var(--tb-card);margin:-34px 10px 0;border-radius:var(--tb-radius);padding:12px 14px;position:relative;z-index:2;box-shadow:var(--tb-shadow);}
  .sf-shop .head{display:flex;align-items:center;gap:12px;}
  .sf-shop .avatar{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--tb-orange),var(--tb-orange-2));color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;flex:none;border:2px solid #fff;box-shadow:0 1px 6px rgba(255,80,0,.25);}
  .sf-shop .meta{flex:1;min-width:0;}
  .sf-shop .meta h1{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .sf-shop .meta .sub{font-size:12px;color:var(--tb-sub);margin-top:3px;}
  .sf-shop .meta .sub b{color:var(--tb-orange);font-weight:600;}
  .sf-shop .notice{margin-top:10px;background:#fff8f3;border-radius:8px;padding:8px 10px;font-size:12.5px;color:#a8541b;line-height:1.5;display:flex;gap:6px;}
  .sf-shop .notice.hide{display:none;}

  /* ── 商品双列瀑布 ── */
  .sf-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px;}
  .pcard{background:var(--tb-card);border-radius:var(--tb-radius);overflow:hidden;position:relative;box-shadow:var(--tb-shadow);}
  .pcard .thumb{position:relative;width:100%;aspect-ratio:1/1;background:#f2f2f2;overflow:hidden;}
  .pcard .thumb img{width:100%;height:100%;object-fit:cover;}
  .pcard .thumb .ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#cfcfcf;font-size:28px;}
  .pcard .soldout{position:absolute;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;}
  .pcard .soldout span{width:52px;height:52px;border-radius:50%;border:1px solid rgba(255,255,255,.85);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;}
  .pcard .body{padding:8px 9px 10px;}
  .pcard .name{font-size:13.5px;line-height:1.35;height:36px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;color:#222;}
  .pcard .tags{display:flex;gap:4px;margin-top:5px;flex-wrap:wrap;}
  .pcard .tag{font-size:10px;color:var(--tb-orange);border:1px solid rgba(255,80,0,.45);border-radius:3px;padding:0 4px;line-height:15px;}
  .pcard .tag.free{color:#00a870;border-color:rgba(0,168,112,.45);}
  .pcard .foot{display:flex;align-items:baseline;justify-content:space-between;margin-top:6px;}
  .price{color:var(--tb-red);font-weight:700;line-height:1;white-space:nowrap;}
  .price .cny{font-size:11px;font-weight:600;}
  .price .int{font-size:18px;}
  .price .dec{font-size:12px;font-weight:600;}
  .pcard .stock{font-size:11px;color:var(--tb-sub);}

  .sf-more{text-align:center;padding:4px 0 18px;}
  .sf-more button{border:none;background:#fff;color:var(--tb-orange);font-size:13px;border-radius:16px;padding:9px 26px;box-shadow:var(--tb-shadow);}
  .sf-more span{font-size:12px;color:#bbb;}

  /* ── 底部 Tab ── */
  .tabbar{position:fixed;left:0;right:0;bottom:0;background:#fff;display:flex;border-top:1px solid var(--tb-line);z-index:30;padding-bottom:env(safe-area-inset-bottom);}
  .tabbar .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 5px;font-size:11px;color:#9a9a9a;position:relative;background:none;border:none;}
  .tabbar .tab.on{color:var(--tb-orange);}
  .tabbar .tab svg{width:22px;height:22px;fill:currentColor;}
  .tabbar .tab .badge{position:absolute;top:2px;left:calc(50% + 4px);min-width:16px;height:16px;padding:0 4px;background:var(--tb-red);color:#fff;font-size:10px;line-height:16px;border-radius:8px;text-align:center;}

  /* ── 详情页 ──
   * D-777 专业度整改：
   *  1) 去掉全部渐变背景（违反 CLAUDE.md 铁律 5：必须纯色 + Design Token）
   *  2) 图片区改真轮播（指示点 + 序号 + 滑动），此前只渲染第一张，多图等于没做
   *  3) 主图用 contain 而非 cover —— cover 会裁掉衣服边缘，观感与实物不符
   *  4) 为固定购买栏预留底部空间，不再遮挡最后一块内容
   */
  .d-page{padding-bottom:calc(66px + env(safe-area-inset-bottom));
    padding-top:calc(44px + env(safe-area-inset-top));}
  .d-bar-space{height:10px;}

  /* 轮播 */
  .d-carousel{position:relative;background:#fff;overflow:hidden;}
  .d-carousel .track{display:flex;transition:transform .28s ease;}
  .d-carousel .cell{flex:0 0 100%;width:100%;cursor:zoom-in;}
  .d-carousel .cell img,.d-carousel .cell .ph{width:100%;aspect-ratio:1/1;object-fit:contain;background:#fff;}
  .d-carousel .cell .ph{color:#d5d5d5;font-size:40px;background:#f7f7f7;}
  /* 电脑端拖图切图时别触发浏览器原生的「拖动图片」——那会把 mousemove 吞掉 */
  .d-carousel .cell img{-webkit-user-drag:none;user-select:none;}
  /* 横向轮播自己处理左右拖动：只把纵向留给浏览器，
     避免手机上的边缘返回手势/横向回弹把滑动吃掉 */
  .d-carousel{touch-action:pan-y;}
  /* 左右箭头放在图片垂直居中处 —— 此前与左上角的返回键同坐标重叠，
     返回键 z-index 更高，顾客点左箭头会变成"返回"，等于左滑永远用不了 */

  .d-carousel .navbtn{position:absolute;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;border:none;background:rgba(0,0,0,.4);color:#fff;font-size:17px;line-height:1;display:flex;align-items:center;justify-content:center;}
  .d-carousel .navbtn.prev{left:10px;}
  .d-carousel .navbtn.next{right:10px;}
  /* 返回入口恒在（不再由图片数决定曾导致单图款式整页失效） */
  .d-back{position:absolute;top:calc(10px + env(safe-area-inset-top));left:10px;z-index:5;width:30px;height:30px;border-radius:50%;border:none;background:rgba(0,0,0,.4);color:#fff;font-size:17px;line-height:1;display:flex;align-items:center;justify-content:center;}
  .carousel-dots{position:absolute;left:0;right:0;bottom:10px;display:flex;justify-content:center;gap:5px;pointer-events:none;}
  .carousel-dots i{width:6px;height:6px;border-radius:3px;background:rgba(0,0,0,.2);}
  .carousel-dots i.on{width:16px;background:var(--tb-orange);}
  .carousel-idx{position:absolute;right:10px;bottom:8px;background:rgba(0,0,0,.45);color:#fff;font-size:11px;line-height:16px;padding:0 8px;border-radius:9px;}

  /* 图片查看器（轻点主图放大；全屏可捏合/双击缩放、左右切换、轻点关闭） */
  .d-viewer{position:fixed;inset:0;background:#000;z-index:200;display:flex;align-items:center;justify-content:center;touch-action:none;overflow:hidden;}
  .d-viewer img{max-width:100%;max-height:100%;object-fit:contain;}
  .d-viewer .ph{color:#666;font-size:52px;}
  /* 缩放平移只动这一层（transform 不影响布局，所以 contain 适配算出来的尺寸始终有效） */
  .d-viewer .box{width:100%;height:100%;display:flex;align-items:center;justify-content:center;will-change:transform;}
  .d-viewer .close{position:absolute;top:calc(12px + env(safe-area-inset-top));right:12px;width:34px;height:34px;border-radius:50%;border:none;background:rgba(255,255,255,.22);color:#fff;font-size:17px;line-height:1;display:flex;align-items:center;justify-content:center;z-index:2;}
  .d-viewer .cnt{position:absolute;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);color:#fff;font-size:12.5px;background:rgba(255,255,255,.18);border-radius:12px;padding:3px 12px;z-index:2;}
  .d-viewer .hint{position:absolute;bottom:calc(54px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);color:rgba(255,255,255,.9);font-size:12px;background:rgba(0,0,0,.42);border-radius:12px;padding:4px 12px;pointer-events:none;transition:opacity .45s;z-index:2;}
  .d-viewer .hint.off{opacity:0;}

  /* 价格区：纯色白底，价格用品牌色，不用渐变 */
  .d-price{background:#fff;padding:14px;}
  .d-price .row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;}
  .d-price .sub{font-size:12px;color:var(--tb-sub);margin-top:8px;display:flex;gap:12px;flex-wrap:wrap;}
  .d-price .sub .warn{color:var(--tb-red);}

  .d-title{background:#fff;padding:0 14px 14px;border-top:0;border-bottom:0;}
  .d-title h2{font-size:16.5px;font-weight:600;line-height:1.5;color:var(--tb-text);}
  .d-title .tags{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
  .d-title .tag{font-size:11px;color:var(--tb-orange);background:#fff3ec;border-radius:3px;padding:2px 7px;}
  .d-title .tag.free{color:#00a870;background:#eafaf3;}
  .d-title .no{font-size:12px;color:var(--tb-sub);margin-top:9px;}
  /* 服务承诺标签：标题区与独立承诺块共用，必须成标签而不是连成一句话 */
  .ptag{display:inline-block;font-size:11px;line-height:18px;color:var(--tb-orange);background:#fff3ec;border-radius:3px;padding:0 7px;margin:0 6px 6px 0;}
  .d-sec .ptag{margin:0 8px 8px 0;}

  .d-sec{background:#fff;margin-top:0;padding:14px;border-top:1px solid var(--tb-line);}
  .d-sec .lbl{font-size:13.5px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:6px;}
  .d-sec .lbl .hint{font-size:11.5px;color:var(--tb-sub);font-weight:400;}

  /* D-805：详情图纵向连续流。
     刻意不加 margin/border —— 淘宝详情页的图与图之间是无缝衔接的，
     加了间隙就会变成「一堆图片」而不是「一个整体」。 */
  .d-stack{background:var(--tb-card);}
  /* D-807：详情「一条龙」画布 —— 图与文之间不许有缝 */
  .d-detail-canvas .d-desc.rich{margin-top:0;}
  .d-detail-canvas .d-stack{margin:0 -14px;}
  .d-detail-canvas .d-desc.rich img{margin:6px -14px;}
  /* D-806：详情图**通栏贴边**，与 .d-desc.rich img 的 -14px 负边距同一套手法。
     
     为什么：此前 .d-stack img 只写 width:100%，而它坐在 .d-sec{padding:14px} 里，
     → 图比屏幕窄、左右各露 14px 白边。而紧挨着它的富文本详情图反而做了通栏，
     → **同一个「详情」段里两种图宽**，顾客一看就觉得「别家是平铺整个页面、我们不是」。
     
     淘宝/1688 的详情长图就是撑满屏宽、图与图无缝衔接，一路往下滑读完。
     做法：容器自身做 -14px 负边距抵消 .d-sec 的内边距，图片再 width:100% 填满它。 */
  .d-stack{margin:0 -14px;}
  .d-stack img{display:block;width:100%;height:auto;}
  .d-stack-fail{padding:24px 14px;text-align:center;font-size:12px;color:var(--tb-sub);}
  /* D-808：文字块。留白与图片一致，整条流才是一个整体而不是拼贴。 */
  .d-stack-text{padding:16px 14px;font-size:14px;line-height:1.9;color:var(--tb-text);word-break:break-word;}
  .d-stack-text p{margin:0 0 8px;}
  .d-stack-text p:last-child{margin-bottom:0;}
  .d-stack-text img{max-width:100%;height:auto;display:block;margin:8px 0;}
  /* D-810 图注：这是「上面那张图的说明」，不是新的一段内容。
     所以内边距要小、字号要小、颜色要弱，让它读起来属于图而不是属于版面。 */
  .d-stack-text--cap{padding:10px 14px;font-size:13px;line-height:1.75;color:var(--tb-sub);text-align:center;}

  /* ── D-802 详情页统一外壳 ────────────────────────────────────────────
     为什么加：详情页原来只有「一块块白卡片」（模块间 8px 灰缝），
     加上没有顶栏、没有锚点导航，每个模块字号粗细各写各的 ——
     顾客看到的不是「一个商品页」，而是「一堆拼起来的块」。
     主流电商（淘宝/拼多多）的观感来自统一骨架：
     固定顶栏 + 吸顶锚点 + 连续图文流 + 全站同一套留白节奏。       */
  .d-nav.solid{border-bottom-color:var(--tb-line);}
  .d-nav{position:fixed;top:0;left:0;right:0;z-index:40;height:calc(44px + env(safe-area-inset-top));
    padding-top:env(safe-area-inset-top);display:flex;align-items:center;justify-content:space-between;
    padding-left:6px;padding-right:6px;background:var(--tb-card);border-bottom:1px solid var(--tb-line);}
  .d-nav button{width:38px;height:38px;display:flex;align-items:center;justify-content:center;
    border:none;background:none;color:var(--tb-text);font-size:19px;line-height:1;border-radius:50%;}
  .d-nav .ttl{font-size:15px;font-weight:600;color:var(--tb-text);max-width:60%;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;}

  /* 吸顶锚点：只做「跳到哪一段」，不做页内路由，避免与购物车返回逻辑打架 */
  .d-anchors{position:sticky;top:calc(44px + env(safe-area-inset-top));z-index:30;
    background:var(--tb-card);border-bottom:1px solid var(--tb-line);display:flex;}
  .d-anchors .anc{flex:1;padding:11px 0 9px;text-align:center;font-size:14px;color:var(--tb-sub);
    background:none;border:none;position:relative;font-family:inherit;}
  .d-anchors .anc.on{color:var(--tb-text);font-weight:600;}
  .d-anchors .anc.on::after{content:'';position:absolute;left:50%;bottom:3px;width:20px;height:2px;
    transform:translateX(-50%);background:var(--tb-orange);border-radius:1px;}
  .opts{display:flex;flex-wrap:wrap;gap:8px;}
  .opt{border:1px solid #e5e5e5;background:#fafafa;border-radius:6px;padding:7px 14px;font-size:13px;color:#444;}
  .opt.sel{border-color:var(--tb-orange);color:var(--tb-orange);background:#fff3ec;font-weight:600;}
  .opt.dis{color:#c9c9c9;background:#f5f5f5;text-decoration:line-through;border-color:#eee;}
  .opt .st{font-size:10.5px;color:var(--tb-sub);margin-left:3px;}
  .opt.sel .st{color:var(--tb-orange);}
  .stepper{display:inline-flex;align-items:center;border:1px solid #e5e5e5;border-radius:6px;overflow:hidden;}
  .stepper button{width:36px;height:32px;border:none;background:#fafafa;font-size:17px;color:#555;}
  .stepper button:active{background:#f0f0f0;}
  .stepper span{width:52px;text-align:center;font-size:14px;}
  .d-desc{font-size:13px;color:#666;line-height:1.75;white-space:pre-wrap;word-break:break-word;}
  .addrpick{display:flex;gap:8px;align-items:flex-start;padding:8px 0;cursor:pointer;font-size:12.5px;line-height:1.6;}
  .addrpick input{margin-top:3px;flex:0 0 auto;}
  .addrpick .txt{flex:1;}
  .addrpick .dim{color:#999;}
  .lnk{background:none;border:none;color:var(--tb-red);font-size:12.5px;padding:0;cursor:pointer;}
  .d-spec{width:100%;border-collapse:collapse;font-size:12.5px;margin:0;}
  /* 富文本里的图片必须自适应容器，否则会横向撑破详情页 */
  .d-desc.rich img{width:calc(100% + 28px);max-width:none;height:auto;display:block;
    margin:6px -14px;border-radius:0;}
  .d-desc.rich p{margin:0 0 8px;}
  .d-desc.rich table{max-width:100%;border-collapse:collapse;}
  .d-desc.rich td,.d-desc.rich th{border:1px solid #eee;padding:4px 6px;font-size:12px;}
  .d-spec th{text-align:left;font-weight:400;color:var(--tb-sub);width:76px;padding:7px 12px 7px 0;vertical-align:top;white-space:nowrap;}
  .d-spec td{color:#333;padding:7px 0;line-height:1.6;word-break:break-word;border-bottom:1px solid #f7f7f7;}
  .d-spec tr:last-child td{border-bottom:none;}

  /* 尺码表（D-780）：横向可滚，避免多色时把详情页撑破 */
  .size-tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .size-tbl{width:100%;border-collapse:collapse;font-size:12.5px;min-width:100%;}
  .size-tbl th,.size-tbl td{border:1px solid #f0f0f0;padding:7px 6px;text-align:center;white-space:nowrap;}
  .size-tbl thead th{background:#fafafa;color:#333;font-weight:600;}
  .size-tbl tbody th{background:#fafafa;color:#333;font-weight:600;text-align:center;min-width:56px;}
  .size-tbl td{color:#555;}
  .size-tbl td.soldout{color:#bbb;text-decoration:line-through;}
  .size-tbl td.na{color:#ddd;}
  .size-tbl td .cny{font-size:10.5px;color:#999;}

  /* D-782：品牌 / 卖点 / 价格说明 / 常见问题 / 视频 */
  .d-title .d-brand{display:inline-block;margin-top:8px;font-size:12px;color:#666;background:#f5f5f5;border-radius:3px;padding:2px 8px;}
  .d-video{width:100%;max-height:420px;background:#000;border-radius:6px;display:block;}
  .d-points{margin:0;padding-left:18px;}
  .d-points li{font-size:13px;color:#444;line-height:1.9;position:relative;}
  .d-points li::marker{color:var(--tb-orange);}
  .d-faq{border-top:1px solid #f5f5f5;}
  .d-faq-item{border-bottom:1px solid #f5f5f5;}
  .d-faq-item summary{list-style:none;cursor:pointer;font-size:13px;color:#333;padding:11px 0;position:relative;padding-right:20px;}
  .d-faq-item summary::-webkit-details-marker{display:none;}
  .d-faq-item summary::after{content:'›';position:absolute;right:4px;top:50%;transform:translateY(-50%);color:#bbb;font-size:15px;}
  .d-faq-item[open] summary::after{transform:translateY(-50%) rotate(90deg);}
  .d-faq-a{font-size:12.5px;color:#666;line-height:1.7;padding:0 0 12px;}

  /* D-783：评价 */
  .d-stars{display:inline-flex;gap:1px;}
  .d-star{color:#ddd;font-size:14px;line-height:1;}
  .d-star.on{color:#ff9500;}
  .d-review-sum{display:flex;align-items:center;gap:12px;padding-bottom:10px;border-bottom:1px solid #f5f5f5;margin-bottom:10px;}
  .d-review-avg{font-size:30px;font-weight:700;color:#ff9500;line-height:1;}
  .d-review-cnt{font-size:12px;color:#999;margin-top:4px;}
  .d-review-item{padding:10px 0;border-bottom:1px solid #f7f7f7;}
  .d-review-item:last-child{border-bottom:none;}
  .d-review-head{display:flex;align-items:center;gap:8px;}
  .d-review-name{font-size:12.5px;color:#333;font-weight:600;}
  .d-review-time{font-size:11.5px;color:#bbb;}
  .d-review-txt{font-size:13px;color:#555;line-height:1.7;margin-top:5px;}
  .d-review-empty{font-size:12.5px;color:#bbb;padding:10px 0;text-align:center;}
  .d-review-act{margin:10px 0 4px;}
  .d-review-btn{width:100%;border:none;border-radius:20px;background:var(--tb-orange);color:#fff;font-size:14px;font-weight:600;padding:10px 0;}
  .d-review-btn.ghost{background:#fff;color:var(--tb-orange);border:1px solid var(--tb-orange);}
  .d-review-tip{display:block;font-size:12px;color:#999;text-align:center;padding:8px 0;}

  /* 弹窗（登录/评价共用） */
  .d-modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;}
  .d-modal-card{background:#fff;border-radius:12px;padding:20px;width:100%;max-width:340px;}
  .d-modal-title{font-size:16px;font-weight:600;margin-bottom:14px;text-align:center;}
  .d-modal-input{width:100%;border:1px solid #e5e5e5;border-radius:6px;padding:10px;font-size:14px;margin-bottom:10px;box-sizing:border-box;outline:none;}
  .d-modal-input:focus{border-color:var(--tb-orange);}
  textarea.d-modal-input{resize:vertical;line-height:1.6;}
  .d-modal-check{display:flex;align-items:center;gap:6px;font-size:13px;color:#666;margin:2px 0 14px;}
  .d-modal-acts{display:flex;gap:10px;}
  .d-modal-btn{flex:1;border:none;border-radius:20px;font-size:14.5px;font-weight:600;padding:10px 0;}
  .d-modal-btn.ghost{background:#f5f5f5;color:#666;}
  .d-modal-btn.primary{background:var(--tb-orange);color:#fff;}
  .d-modal-switch{text-align:center;font-size:12.5px;color:#999;margin-top:12px;}
  .d-rate{text-align:center;margin-bottom:14px;}

  /* D-784：详情页底部推荐 */
  .d-rec-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .d-rec-card{cursor:pointer;}
  .d-rec-thumb{position:relative;width:100%;aspect-ratio:1/1;background:#f5f5f5;border-radius:6px;overflow:hidden;}
  .d-rec-thumb img{width:100%;height:100%;object-fit:cover;}
  .d-rec-thumb .ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#d5d5d5;font-size:22px;}
  .d-rec-off{position:absolute;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;}
  .d-rec-off span{width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.85);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;}
  .d-rec-name{font-size:12.5px;line-height:1.4;color:#333;margin-top:6px;height:35px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
  .d-rec-foot{margin-top:3px;}
  .d-rec-noprice{font-size:11.5px;color:#bbb;}
  .d-rec-reason{font-size:10.5px;color:var(--tb-orange);margin-top:2px;}

  .d-bar{position:fixed;left:0;right:0;bottom:0;background:#fff;display:flex;align-items:center;gap:10px;padding:8px 12px;border-top:1px solid var(--tb-line);z-index:30;padding-bottom:calc(8px + env(safe-area-inset-bottom));}
  .d-bar .mini{position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:10.5px;color:#666;background:none;border:none;width:48px;}
  .d-bar .mini svg{width:20px;height:20px;fill:#666;}
  .d-bar .mini .badge{position:absolute;top:-2px;right:2px;min-width:15px;height:15px;background:var(--tb-red);color:#fff;font-size:9.5px;line-height:15px;border-radius:8px;text-align:center;padding:0 3px;}
  .d-bar .btns{flex:1;display:flex;border-radius:20px;overflow:hidden;}
  .d-bar .add{flex:1;border:none;background:#ffd9c2;color:var(--tb-orange);font-size:14.5px;font-weight:600;padding:11px 0;}
  .d-bar .buy{flex:1.15;border:none;background:var(--tb-orange);color:#fff;font-size:15px;font-weight:700;padding:11px 0;}
  .d-bar .buy:disabled{background:#d8d8d8;color:#fff;}

  /* ── 购物车 ── */
  .cq{padding:10px 10px 120px;}
  .citem{background:#fff;border-radius:var(--tb-radius);padding:10px;display:flex;gap:10px;margin-bottom:8px;align-items:center;}
  .citem .chk{width:22px;height:22px;flex:none;}
  .citem .ph{width:70px;height:70px;border-radius:8px;background:#f2f2f2;overflow:hidden;flex:none;}
  .citem .ph img{width:100%;height:100%;object-fit:cover;}
  .citem .info{flex:1;min-width:0;}
  .citem .info .nm{font-size:13.5px;line-height:1.4;max-height:38px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
  .citem .info .pr{color:var(--tb-red);font-weight:700;font-size:15px;margin-top:8px;}
  .citem .info .pr .cny{font-size:11px;}
  .citem .side{display:flex;flex-direction:column;align-items:flex-end;gap:10px;}
  .citem .rm{border:none;background:none;color:#bbb;font-size:12px;}
  .stepper.sm button{width:28px;height:26px;font-size:15px;}
  .stepper.sm span{width:34px;font-size:13px;}
  .cbar{position:fixed;left:0;right:0;bottom:calc(52px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--tb-line);display:flex;align-items:center;padding:8px 12px;gap:10px;z-index:25;}
  .cbar .all{display:flex;align-items:center;gap:6px;font-size:13px;color:#555;}
  .cbar .sum{flex:1;text-align:right;font-size:12px;color:#666;}
  .cbar .sum b{color:var(--tb-red);font-size:18px;}
  .cbar .sum b .cny{font-size:12px;}
  .cbar .go{border:none;border-radius:20px;background:linear-gradient(135deg,var(--tb-orange),var(--tb-orange-2));color:#fff;font-size:14.5px;font-weight:600;padding:10px 22px;}
  .cbar .go:disabled{background:#d8d8d8;}

  /* ── 通用页头 / 表单 / 卡片 ── */
  .pagehead{background:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--tb-line);}
  .pagehead .bk{border:none;background:none;font-size:20px;color:#333;line-height:1;padding:0 2px;}
  .pagehead h1{font-size:16px;font-weight:600;}

  .card{background:#fff;border-radius:var(--tb-radius);margin:10px;padding:14px;}
  .fi{margin-bottom:12px;}
  .fi label{display:block;font-size:12.5px;color:#888;margin-bottom:6px;}
  .fi label b{color:var(--tb-red);font-weight:400;}
  .fi input,.fi textarea{width:100%;border:1px solid #e8e8e8;background:#fafafa;border-radius:8px;padding:10px 12px;font-size:14px;outline:none;}
  .fi input:focus,.fi textarea:focus{border-color:var(--tb-orange);background:#fff;}
  .fi textarea{height:74px;resize:none;}
  .obtn{width:100%;border:none;border-radius:22px;background:linear-gradient(135deg,var(--tb-orange),var(--tb-orange-2));color:#fff;font-size:15px;font-weight:600;padding:12px 0;}
  .obtn:disabled{background:#d8d8d8;}
  .obtn.ghost{background:#fff;color:var(--tb-orange);border:1px solid var(--tb-orange);}

  .olist{margin:10px;}
  .ocard{background:#fff;border-radius:var(--tb-radius);padding:12px 14px;margin-bottom:10px;}
  .ocard .top{display:flex;justify-content:space-between;align-items:center;}
  .ocard .no{font-size:12px;color:#999;}
  .ocard .st{font-size:12.5px;font-weight:600;}
  .st-PENDING_SHIP{color:var(--tb-orange);}
  .st-SHIPPED{color:#00a870;}
  .st-CANCELLED{color:#999;}
  .ocard .mid{margin-top:8px;font-size:13px;color:#555;line-height:1.6;}
  .ocard .amt{margin-top:8px;padding-top:8px;border-top:1px dashed var(--tb-line);display:flex;justify-content:space-between;align-items:baseline;}
  .ocard .amt .money{color:var(--tb-red);font-weight:700;font-size:16px;}
  .ocard .amt .money .cny{font-size:11px;}

  .empty{text-align:center;padding:64px 24px;color:#bbb;font-size:14px;}
  .empty .big{font-size:42px;margin-bottom:12px;}

  .done{text-align:center;padding:56px 24px;}
  .done .ok{width:64px;height:64px;border-radius:50%;background:#eafaf3;color:#00a870;font-size:34px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;}
  .done h2{font-size:18px;margin-bottom:8px;}
  .done p{font-size:13.5px;color:#777;line-height:1.7;}

  .toast{position:fixed;top:42%;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.78);color:#fff;padding:10px 18px;border-radius:8px;font-size:13.5px;z-index:99;max-width:80%;text-align:center;}
  .loading{text-align:center;padding:40px 0;color:#bbb;font-size:13px;}
  @keyframes spin{to{transform:rotate(360deg)}}
  .spin{width:20px;height:20px;border:2px solid #eee;border-top-color:var(--tb-orange);border-radius:50%;display:inline-block;animation:spin .7s linear infinite;vertical-align:-3px;margin-right:6px;}

  /* 桌面端（电脑浏览器打开分享链接）：整页收成手机宽度居中，
     否则商品图会被拉成六七百像素的巨幅、底部栏横跨整个屏幕 */
  @media (min-width: 600px) {
    body{background:#e9e9e9;}
    #app{max-width:460px;margin:0 auto;min-height:100vh;background:var(--tb-bg);box-shadow:0 0 30px rgba(0,0,0,.1);}
    .tabbar,.d-bar,.cbar{left:50%;right:auto;width:100%;max-width:460px;transform:translateX(-50%);}
  }
</style>
</head>
<body>
<div id="app"><div class="loading"><span class="spin"></span>加载中…</div></div>

<script>
(function () {
  'use strict';
  var API = '/api/shop/public';
  var SLUG = '';   // 当前店铺 slug，地址簿要用
  var slug = new URLSearchParams(location.search).get('s') || localStorage.getItem('shop_slug') || '';
  if (slug) localStorage.setItem('shop_slug', slug);

  var ST = { PENDING_SHIP: '待发货', SHIPPED: '已发货', CANCELLED: '已取消' };
  var app = document.getElementById('app');
  var shopInfo = null;

  /* ── D-513 配送规则（服务端下发，前端只展示，金额一律以服务端为准） ──
     规则与后端 ShopOrderOrchestrator.resolveShippingFee 保持一致：
       未开启收运费 → 全场包邮
       开启且商品金额 ≥ 包邮门槛(>0) → 包邮
       其余 → 收默认运费
     此前页面硬编码「包邮」，而系统没有运费概念，属于自相矛盾的展示。 */
  /**
   * 确保店铺配置已加载后再执行回调（多个入口都可能需要）。
   *
   * <p>此前只有首页会拉 /info，详情页/购物车等直接访问时不拉，
   * 于是 shopInfo 为 null —— 页面不会报错，只是**按错误数据渲染**
   * （如一律显示「包邮」），这属于最容易被忽略的静默数据错误。
   *
   * <p>并发去重：多个模块同时调用只发一次请求。
   */
  var shopInfoLoading = null;
  function ensureShopInfo(cb) {
    if (shopInfo) { cb(); return; }
    if (shopInfoLoading) {
      shopInfoLoading.then(cb);
      return;
    }
    shopInfoLoading = fetch(API + '/' + slug + '/info')
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d && d.code === 200) {
          shopInfo = d.data;
          SLUG = slug;
        } else {
          shopInfo = shopInfo || {};
        }
        shopInfoLoading = null;
        return shopInfo;
      })
      .catch(function () {
        // 取不到配置也不能挡住浏览：降级为空配置，页面继续渲染
        shopInfo = shopInfo || {};
        shopInfoLoading = null;
      })
      .then(cb);
  }

  function shipCfg() {
    var s = shopInfo || {};
    return {
      enabled: !!s.shippingEnabled,
      fee: Number(s.shippingFee || 0),
      threshold: Number(s.freeShippingThreshold || 0),
      note: s.shippingNote || ''
    };
  }
  /** 金额展示：整数不带小数，非整数保留 2 位（199 / 12.50） */
  function money(n) {
    var v = Number(n || 0);
    return v % 1 === 0 ? String(v) : v.toFixed(2);
  }
  /** 列表/详情用的配送短标签 */
  function shipTag() {
    var c = shipCfg();
    if (!c.enabled) return '包邮';
    if (c.threshold > 0) return '满' + money(c.threshold) + '包邮';
    return '运费 ¥' + money(c.fee);
  }
  /** 按商品金额算本次运费（与后端同规则） */
  function shipFeeFor(goodsAmount) {
    var c = shipCfg();
    if (!c.enabled) return 0;
    if (c.threshold > 0 && goodsAmount >= c.threshold) return 0;
    return c.fee;
  }
  /** 确认订单里的运费行文案（含「还差 X 元包邮」的引导） */
  function shipLineText(goodsAmount) {
    var c = shipCfg();
    var fee = shipFeeFor(goodsAmount);
    if (fee === 0) {
      if (c.enabled && c.threshold > 0) return '已满 ¥' + money(c.threshold) + '，包邮';
      return '包邮';
    }
    var gap = c.threshold - goodsAmount;
    return '¥' + money(fee) + (gap > 0 ? '（再买 ¥' + money(gap) + ' 包邮）' : '');
  }

  /* ── 工具 ── */
  /**
   * 详情介绍的安全富文本渲染。
   *
   * 款式介绍在后台是用富文本存的，**主体就是 <img> 图片**（实测内容形如
   * `<img src="/api/file/tenant-download/..." style="max-width:100%">`）。
   * 若直接 esc() 转义，顾客会看到一串 `<img src=...>` 字面量 —— 那才是真的坏。
   *
   * 这里白名单放行排版与图片标签，其余（script/iframe/on* 事件/style 里的
   * 危险表达式）一律剥离。放行 iframe 是为了兼容旧数据里可能存在的嵌入，
   * 但仅允许 http/https。
   */
  function richHtml(s) {
    if (s == null) return '';
    var html = String(s);
    // 先整体剥掉危险标签与其内容
    html = html.replace(/<\s*(script|iframe|object|embed|link|meta|form|style)\b[\s\S]*?<\s*\/\s*\1\s*>/gi, '');
    html = html.replace(/<\s*(script|iframe|object|embed|link|meta|form|style)\b[^>]*>/gi, '');
    // 事件属性与危险属性（onclick、onerror、srcdoc…）
    html = html.replace(/\s+on[a-z]+\s*=\s*("[^"]*"|'[^']*'|[^\s>]+)/gi, '');
    html = html.replace(/\s+(srcdoc|formaction)\s*=\s*("[^"]*"|'[^']*'|[^\s>]+)/gi, '');
    // 只允许安全协议
    html = html.replace(/\s+(href|src)\s*=\s*(["']?)\s*javascript:[^"'\s>]*/gi, '');
    // 不允许 base64 大图内联（避免撑爆页面）与 data: 之外的未知协议
    html = html.replace(/<\s*(?!img|p|br|div|span|strong|em|b|i|u|ul|ol|li|h[1-6])[a-z][a-z0-9]*\b/gi, '&lt;');
    return html;
  }
  /* ══════════ D-770：C 端收货地址簿 ══════════ */

  /** 拼完整地址：省+市+区+详细 */
  function addrText(a) {
    return [a.province, a.city, a.district, a.detailAddr]
      .filter(function (x) { return x && String(x).trim(); }).join('');
  }

  function addressApi(path, opts) {
    return fetch(API + '/' + SLUG + path, opts).then(function (r) { return r.json(); })
      .then(function (d) {
        if (d && d.code === 200) return d.data;
        throw new Error((d && d.message) || '地址簿操作失败');
      });
  }

  function loadAddresses(phone) {
    if (!/^1[3-9]\d{9}$/.test(phone || '')) return Promise.resolve([]);
    return addressApi('/addresses?phone=' + encodeURIComponent(phone))
      .then(function (rows) { return Array.isArray(rows) ? rows : []; })
      .catch(function () { return []; });
  }

  /**
   * 在结算页渲染地址选择区。
   *
   * <p>交互取自主流电商：先填手机号 → 自动带出已存地址（默认地址自动选中），
   * 也可继续手填。**没有地址簿不会阻塞下单** —— 首次购物的人本来也没有地址。
   */
  function renderAddressPicker(phone) {
    var box = document.getElementById('addrbox');
    if (!box) return;
    loadAddresses(phone).then(function (list) {
      if (!list.length) { box.innerHTML = ''; return; }
      var h = '<div class="fi" style="border-top:1px solid #f0f0f0;padding-top:12px;margin-top:4px">'
        + '<label>常用收货地址</label><div id="addrlist"></div>'
        + '<button class="lnk" id="addrnew" style="margin-top:8px">+ 新增地址</button></div>';
      box.innerHTML = h;
      var listEl = document.getElementById('addrlist');
      listEl.innerHTML = list.map(function (a) {
        return '<label class="addrpick"><input type="radio" name="pa" value="' + esc(a.id) + '"'
          + (a.isDefault === 1 ? ' checked' : '') + '>'
          + '<span class="txt"><b>' + esc(a.consignee) + '</b> ' + esc(a.phone) + '<br>'
          + '<span class="dim">' + esc(addrText(a)) + '</span></span></label>';
      }).join('');
      listEl.onchange = function (e) {
        if (e.target && e.target.name === 'pa') fillAddress(list.filter(function (x) {
          return String(x.id) === e.target.value;
        })[0]);
      };
      var def = list.filter(function (a) { return a.isDefault === 1; })[0] || list[0];
      if (def) fillAddress(def);
      on('addrnew', function () { promptAddAddress(phone); });
    });
  }

  /** 把选中的地址回填到结算表单 */
  function fillAddress(a) {
    if (!a) return;
    var n = document.getElementById('f_name');
    var p = document.getElementById('f_phone');
    var d = document.getElementById('f_addr');
    if (n && !n.value) n.value = a.consignee || '';
    if (p && !p.value) p.value = a.phone || '';
    if (d && !d.value) d.value = addrText(a);
  }

  /** 新增地址：极简弹窗（顾客端不适合放复杂表单） */
  function promptAddAddress(phone) {
    var c = window.prompt('收货人姓名');
    if (!c) return;
    var t = window.prompt('手机号', phone || '');
    if (!t) return;
    var a = window.prompt('收货地址（省/市/区 + 详细）');
    if (!a) return;
    addressApi('/addresses', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ phone: t, consignee: c, detailAddr: a, isDefault: false }),
    }).then(function () {
      toast('地址已保存');
      var pEl = document.getElementById('f_phone');
      renderAddressPicker(pEl ? pEl.value : t);
    }).catch(function (e) { toast(e.message || '保存失败'); });
  }

  /**
   * D-769：服务承诺标签（按商家配置渲染，绝不凭空承诺）。
   *
   * 承诺是**有法律后果的**：写了「7 天无理由」就要能兑现，兑现不了即纠纷/投诉。
   * 所以这里只在商家**显式开启且填了天数**时才输出对应文案，
   * 未开启一律不出现 —— 顾客看不到商家没做过的承诺。
   */
  function promiseTags() {
    // 核实过 /shop/public/{slug}/info 返回的就是配置对象本身，没有 config 嵌套
    var c = shopInfo || {};
    var out = '';
    // D-777：原先这些 span 没有任何 class，承诺词就那样连成一句
    // 「7 天无理由退货现货速发正品保障」直接贴在正文里，看着像拼接字符串而不是承诺标签。
    // 现统一走 .ptag，在标题区和独立承诺块里都是规整的标签。
    // 无理由：只认 returnDays > 0；0 视为不承诺
    var rd = Number(c.returnDays || 0);
    if (rd > 0) out += '<span class="ptag">' + rd + ' 天无理由退货</span>';
    // 现货速发
    if (Number(c.promiseInStock || 0) === 1) out += '<span class="ptag">现货速发</span>';
    // 正品保障
    if (Number(c.promiseAuthentic || 0) === 1) out += '<span class="ptag">正品保障</span>';
    // 自定义其它承诺（商家自己填的，按逗号拆开，最多显示 3 条）
    var extra = String(c.promiseExtra || '').trim();
    if (extra) {
      var items = extra.split(/[,，]/).map(function (t) { return t.trim(); })
        .filter(function (t) { return t; }).slice(0, 3);
      for (var i = 0; i < items.length; i++) out += '<span class="ptag">' + esc(items[i]) + '</span>';
    }
    return out;
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[<>&"]/g, function (c) {
      return { '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;' }[c];
    });
  }
  function toast(msg) {
    var t = document.createElement('div');
    t.className = 'toast'; t.textContent = msg; document.body.appendChild(t);
    setTimeout(function () { t.remove(); }, 2200);
  }
  function priceHtml(v, size) {
    if (v == null || isNaN(Number(v))) return '<span class="price"><span class="cny">¥</span><span class="int">—</span></span>';
    var n = Number(v).toFixed(2).split('.');
    var iCls = size === 'lg' ? 'amount' : 'price';
    if (size === 'lg') return '<span class="amount"><span class="cny">¥</span>' + n[0] + '<span class="dec">.' + n[1] + '</span></span>';
    return '<span class="price"><span class="cny">¥</span><span class="int">' + n[0] + '</span><span class="dec">.' + n[1] + '</span></span>';
  }
  function thumbHtml(cover, cls) {
    // 1×1 像素的「占位图」被拉伸后就是一整块纯色，看着像页面坏了 →
    // 加载后小于 2px 一律换成「暂无图片」占位（生图失败/脏数据兜底）
    var PH = '<div class="ph">&#9634;</div>';
    var PH_ATTR = "'<div class=&quot;ph&quot;>&#9634;</div>'";
    if (!cover) return PH;
    return '<img src="' + esc(cover) + '" alt="" draggable="false"'
      + ' onload="if(this.naturalWidth<=1||this.naturalHeight<=1)this.outerHTML=' + PH_ATTR + '"'
      + ' onerror="this.outerHTML=' + PH_ATTR + '">';
  }
  /* P0：已登录的平台消费者，下单/查单时带上账号令牌（未登录则不带，行为不变） */
  function shopHeaders(extra) {
    var h = extra || {};
    try {
      var t = localStorage.getItem('shop_consumer_token');
      if (t) h['X-Shop-Token'] = t;
    } catch (e) {}
    return h;
  }

/* ══════════════ 底部推荐（D-784） ══════════════ */

  /**
     * 底部推荐容器（骨架先占位，数据到了再填，避免空标题闪烁）。
     *
     * <p>⚠️ 这个函数曾经叫 recSectionHtml，在「两套推荐实现并存」时被我删掉，
     * 但调用点还留着 → ReferenceError 被 route() 吞掉 → **整页卡在「加载中」**。
     * 与 D-777 那个 P0 完全同类：改函数必须同时确认所有调用点。
     */
  function recommendSectionHtml() {
    return '<div class="d-sec" id="recSec"><div class="lbl">'
      + '猜你喜欢<span class="hint" id="recHint"></span></div>'
      + '<div id="recBox"><div class="d-review-empty">加载中…</div></div></div>';
  }

  /**
   * 拉取并渲染「猜你喜欢」。
   *
   * <p>登录顾客由后端按「个人浏览偏好 + 同品类 + 热度」混合排序；
   * 匿名访客走「同品类 + 热度」——<b>不假装给匿名用户做了个性化</b>。
   *
   * <p>每条推荐带 reason（如「同类同季 · 你常看」），如实告诉顾客为什么推它，
   * 而不是给一堆不明所以的商品。
   */
  function loadRecommends(styleId) {
    var box = document.getElementById('recBox');
    if (!box) return;
    get(API + '/' + slug + '/products/' + encodeURIComponent(styleId) + '/recommendations?limit=8',
      function (list) {
        var hint = document.getElementById('recHint');
        list = list || [];
        if (!list.length) {
          // 没得推就整块隐藏，不给顾客一个空区块
          var sec0 = document.getElementById('recSec');
          if (sec0) sec0.style.display = 'none';
          return;
        }
        if (hint) {
          hint.textContent = isLoggedIn() ? '根据你的浏览偏好' : '同类商品';
        }
        var h = '<div class="d-rec-grid">';
        for (var i = 0; i < list.length; i++) {
          var r = list[i];
          var stock = Number(r.totalStock) || 0;
          h += '<div class="d-rec-card" data-id="' + r.styleId + '">'
            + '<div class="d-rec-thumb">' + thumbHtml(r.cover)
            + (stock <= 0 ? '<div class="d-rec-off"><span>已售罄</span></div>' : '')
            + '</div>'
            + '<div class="d-rec-name">' + esc(r.styleName || r.styleNo || '') + '</div>'
            + '<div class="d-rec-foot">'
            + (r.minPrice != null
                ? '<span class="price"><span class="cny">¥</span><span class="int">'
                  + Number(r.minPrice).toFixed(0) + '</span></span>'
                : '<span class="d-rec-noprice">价格未维护</span>')
            + '</div>'
            + (r.reason ? '<div class="d-rec-reason">' + esc(r.reason) + '</div>' : '')
            + '</div>';
        }
        box.innerHTML = h + '</div>';
        Array.prototype.forEach.call(box.querySelectorAll('.d-rec-card'), function (el) {
          el.onclick = function () { go('#/p/' + el.getAttribute('data-id')); };
        });
      },
      function () {
        var sec0 = document.getElementById('recSec');
        if (sec0) sec0.style.display = 'none';
      });
  }

  /* ══════════════ 顾客账号（D-783） ══════════════
   * 此前页面会读 shop_consumer_token，但**从来没有写入过** ——
   * 没有登录界面，令牌是死代码，于是「评价/我的订单」这类需要身份的
   * 功能在顾客端根本没法用。
   * 这里补上登录/注册与登出，令牌沿用既有存储键，
   * 下单时 shopHeaders 会自动带上。 */
  function consumerToken() {
    try { return localStorage.getItem('shop_consumer_token') || ''; } catch (e) { return ''; }
  }
  function consumerName() {
    try { return localStorage.getItem('shop_consumer_name') || ''; } catch (e) { return ''; }
  }
  function setConsumerSession(token, name) {
    try {
      localStorage.setItem('shop_consumer_token', token);
      if (name) localStorage.setItem('shop_consumer_name', name);
    } catch (e) {}
  }
  function clearConsumerSession() {
    try {
      localStorage.removeItem('shop_consumer_token');
      localStorage.removeItem('shop_consumer_name');
    } catch (e) {}
  }
  function isLoggedIn() { return !!consumerToken(); }
  /**
     * 读请求。
     * @param fail 可选失败回调。传入时**不弹 toast**，由调用方自行决定怎么表现
     *             （评价列表这类"取不到就显示占位"的地方不该弹错误打扰顾客）。
     */
  function get(url, ok, fail) {
    fetch(url, { headers: shopHeaders() }).then(function (r) { return r.json(); }).then(function (d) {
      if (d && d.code === 200) ok(d.data);
      else if (fail) fail(d && d.message);
      else toast((d && d.message) || '加载失败');
    }).catch(function () {
      if (fail) fail('网络异常');
      else toast('网络异常，请稍后再试');
    });
  }

  /** 写请求；fail 存在时不弹 toast，由调用方处理 */
  function post(url, body, ok, fail) {
    fetch(url, { method: 'POST', headers: shopHeaders({ 'Content-Type': 'application/json' }), body: JSON.stringify(body) })
      .then(function (r) { return r.json(); }).then(function (d) {
        if (d && d.code === 200) ok(d.data);
        else if (fail) fail(d && d.message);
        else toast((d && d.message) || '操作失败');
      }).catch(function () {
        if (fail) fail('网络异常');
        else toast('网络异常，请稍后再试');
      });
  }
  function go(hash) { location.hash = hash; }
  function back() { if (history.length > 1) history.back(); else go('#/'); }

  /**
   * D-777：容错事件绑定。
   *
   * <p><b>为什么必须有</b>：原先到处写「先取元素、再直接赋 onclick」的裸写法。
   * 只要某个元素在某种数据下没渲染出来（例如只有 1 张图时返回按钮 #bk 不存在），
   * 这一行就抛 TypeError，<b>把它后面的所有绑定全部打断</b> ——
   * 加购/立即购买/颜色/数量全部失效，页面却看起来完全正常，控制台也无报错。
   * 线上实测：14 个上架款式有 9 个（64%）处于该状态。
   */
  function on(id, fn) {
    var el = document.getElementById(id);
    if (el) el.onclick = fn;
    return el;
  }
  function onAll(sel, fn) {
    Array.prototype.forEach.call(document.querySelectorAll(sel), fn);
  }

  /**
   * 详情页轮播的图片清单。
   *
   * <p>商家排好的轮播图优先；没排才回落「主图 + 各颜色图」（库里已有上百张颜色图）。
   * <b>单独抽成函数是必须的</b>：此前画廊渲染和「选颜色换图」各自算了一份清单，
   * 换图那段引用的 `galImgs` 根本没声明 → 顾客一点颜色就抛 ReferenceError，
   * 处理函数在刷新尺码之前就断了，尺码永远不出现。
   */
  /**
   * 顶部轮播图：**只放主图**。
   *
   * D-805：原来这里会把商家配的「详情图」(d.gallery) 也塞进顶部轮播，
   * 于是详情图被压成 1:1 方块、左右滑动 —— 而详情图在淘宝/拼多多是
   * **从上到下连成一条**的完整描述。两者的展示形态根本不同，
   * 混在一个轮播里等于「配了等于没配」。现在详情图改由 detailImageStack 渲染。
   */
  function galleryImages(d) {
    var imgs = [];
    // D-800：主图组（最多 5 张，运营上传）—— 第 1 张即主图。
    // 历史数据没有 coverGroup 时自动跳过，行为与改动前一致。
    if (d.coverGroup && d.coverGroup.length) {
      for (var cg = 0; cg < d.coverGroup.length; cg++) {
        if (d.coverGroup[cg] && imgs.indexOf(d.coverGroup[cg]) < 0) imgs.push(d.coverGroup[cg]);
      }
    } else if (d.gallery && d.gallery.length) {
      // D-782 契约：商家手填的图必须优先于「主图+颜色图」自动回落，
      // 否则商家调了顺序在顾客端看不出任何变化。D-805 一度把这一支删掉，
      // 那是把「顶部轮播」和「纵向详情流」当成同一个字段用两个意思 ——
      // 详情流已改由 blocks 承担（D-808），这里恢复原契约。
      for (var g2 = 0; g2 < d.gallery.length; g2++) {
        if (d.gallery[g2] && imgs.indexOf(d.gallery[g2]) < 0) imgs.push(d.gallery[g2]);
      }
    } else {
      if (d.cover) imgs.push(d.cover);
      var ci = d.colorImages || {};
      for (var k in ci) { if (ci[k] && ci[k] !== d.cover) imgs.push(ci[k]); }
    }
    return imgs;
  }

  /**
   * D-805：商家配的详情图 —— 按数组顺序**从上到下连成一条**。
   *
   * <p>这就是主流电商详情页的形态：宽度撑满、自然比例、图与图之间无缝衔接，
   * 顾客一路往下滑就看完整个描述。
   *
   * <p>刻意不做成轮播/网格：详情图是要「按顺序读」的，
   * 一旦能左右滑，运营排的顺序就失去意义了。
   *
   * <p>没有详情图时返回空串 —— 上层会自动跳过，不给顾客留空白块。
   */
  function detailImageStack(d) {
    // D-808：纵向详情流只认 blocks（图/文交错）。
    // **不回落到 gallery** —— gallery 归顶部轮播，两边都用它会导致
    // 同一批图在轮播和详情流里各出现一次，顾客看到重复。
    // 没有 blocks 就是没有详情流，不生成、不兜底。
    if (d.blocks && d.blocks.length) {
      var bh = '';
      for (var bi = 0; bi < d.blocks.length; bi++) {
        var blk = d.blocks[bi];
        if (!blk) continue;
        if (blk.type === 'image' && blk.url) {
          bh += '<img class="d-stack-img" src="' + esc(blk.url) + '" alt="" loading="lazy"'
            + ' onerror="this.outerHTML=\'&lt;div class=&quot;d-stack-fail&quot;&gt;图片加载失败&lt;/div&gt;\'">';
        } else if (blk.type === 'text' && blk.content) {
          // 商家输入不直接当 HTML 塞页面，走 richHtml 白名单 + 转义
          // D-810：caption=1 是「上一张图的说明」—— 紧贴图片、无大间距、字号小一号，
          // 与淘宝详情页的图注观感一致；不标则按普通段落渲染。
          var isCap = blk.caption === '1' || blk.caption === true;
          bh += '<div class="d-stack-text' + (isCap ? ' d-stack-text--cap' : '') + '">'
            + richHtml(blk.content) + '</div>';
        }
      }
      return bh ? '<div class="d-stack">' + bh + '</div>' : '';
    }
    return '';
  }

  /**
   * D-777：真正的图片轮播。
   * 此前把图片收进数组却只渲染 imgs[0]，多图等于没做；且指示点/序号都缺，
   * 顾客看不出还有别的图。现按淘宝/1688 惯例给出指示点 + 第 N/M 张 + 左右切换 + 触摸滑动。
   *
   * @param imgs 图片 URL 数组（已去重、已剔除空值）
   * @param alwaysBack 返回入口恒定渲染，不再依赖图片数量
   */
  function carouselHtml(imgs, alwaysBack) {
    imgs = (imgs || []).filter(Boolean);
    var h = '<div class="d-carousel">';
    if (alwaysBack) h += '<button class="d-back" id="dk">&#8249;</button>';
    h += '<div class="track" id="ctrack">';
    for (var i = 0; i < imgs.length; i++) {
      h += '<div class="cell">' + thumbHtml(imgs[i]) + '</div>';
    }
    h += '</div>';
    if (imgs.length > 1) {
      h += '<button class="navbtn prev" id="cprev">&#8249;</button>'
        + '<button class="navbtn next" id="cnext">&#8250;</button>'
        + '<div class="carousel-dots" id="cdots">'
        + imgs.map(function (_, i2) { return '<i class="' + (i2 === 0 ? 'on' : '') + '"></i>'; }).join('')
        + '</div>'
        + '<div class="carousel-idx" id="cidx">' + (imgs.length > 1 ? '1/' + imgs.length : '') + '</div>';
    }
    return h + '</div>';
  }

  /** 轮播切图：左右按钮 / 指示点 / 触摸滑动统一走这里 */
  function galleryGo(n, total) {
    var track = document.getElementById('ctrack');
    if (!track) return;
    var i = Math.max(0, Math.min(total - 1, n));
    track.style.transform = 'translateX(-' + (i * 100) + '%)';
    var dots = document.getElementById('cdots');
    if (dots) {
      Array.prototype.forEach.call(dots.children, function (el, k) {
        if (k === i) el.classList.add('on'); else el.classList.remove('on');
      });
    }
    var idx = document.getElementById('cidx');
    if (idx) idx.textContent = (i + 1) + '/' + total;
    return i;
  }

  /* ══════════════ 查看器的「穿透点击」防线 ══════════════ */

  /**
   * 查看器关闭后，浏览器补发的「穿透 click」必须全局吞掉。
   *
   * <p><b>为什么</b>：手指抬起时浏览器会依次补发 mousedown / mouseup / click。
   * 查看器是在 touchend 里同步移除的，所以这次 click 的落点**已经不是查看器**，
   * 而是下面刚露出来的详情页元素。实测（iPhone 触摸模拟）：
   * <pre>
   *   4.91s touchend → IMG.        （查看器在此刻被移除）
   *   4.92s click    → IMG.        （补发的 click 落在商品主图上）
   *   4.92s ＋查看器插入            （主图点击处理又把大图打开）
   * </pre>
   * 于是「点一下关不掉、再点一下还是关不掉」，顾客被困在全屏大图里回不了详情页。
   * 右上角关闭键同样中招 —— 它正好压在图片上方，落点也穿透到图片。
   *
   * <p>危害不止是关不掉：穿透的落点可能是**任何**元素 —— 颜色/尺码按钮（误选）、
   * 加入购物车 / 立即购买（误下单）。所以这里在 document 捕获阶段统一拦截，
   * 而不是只堵「重新打开大图」这一条路。
   *
   * <p>和它配套的还有两处，改动此段前务必一起看：{@code mask} 的 touchend 里
   * {@code preventDefault()}（从源头掐掉补发事件，兼容引擎上根本不会产生穿透），
   * 以及关闭时的 {@code swallowClicks()} 时间窗（部分内核掐不干净时兜底）。
   */
  var swallowClicksUntil = 0;
  function swallowClicks(ms) { swallowClicksUntil = Date.now() + ms; }
  document.addEventListener('click', function (e) {
    if (Date.now() < swallowClicksUntil) {
      e.stopPropagation();
      if (e.preventDefault) e.preventDefault();
    }
  }, true);

  /**
   * 图片查看器：轻点主图放大，全屏内可**捏合 / 双击 / 滚轮**缩放、拖动看图。
   *
   * <p>此前详情页的图**没有任何点击行为**，顾客想看细节只能靠双指捏合，
   * 在微信里往往被页面滚动抢走手势 —— 等于"看不了大图"。
   *
   * <p>行为对齐主流电商（淘宝/京东/拼多多/Amazon 的全屏看图都是这一套）：
   * 轻点图片打开全屏 → **捏合或双击放大**（双击在 1 倍与 2.5 倍之间切换）→
   * 放大后拖动看图、拖到图片边缘继续拖则切上/下一张 →
   * 轻点任意处关闭、右上角另有关闭键。切换图片只影响查看器，不改详情页当前主图。
   *
   * <p><b>为什么自己实现缩放</b>：查看器铺满全屏，必须 `touch-action:none` 挡掉
   * 浏览器对整页的原生缩放（否则缩的是整个网页，图片并不会变大，还会把页面顶飞）。
   * 代价就是浏览器不会再帮我们做任何缩放手势 —— 全部自己算。
   * 页面 meta 里也没有禁用 user-scalable，所以在详情页上双指捏合会缩放整个网页，
   * 这是移动端 H5 的常见坑，看图必须走查看器。
   */

  /**
   * D-806：详情长图也能点开放大 —— 复用 openImageViewer，不重写缩放逻辑。
   *
   * <p>为什么必须做：此前只有顶部轮播接了这个查看器，详情图（d-stack-img）上
   * 没有任何点击处理 → 顾客想看面料纹理、走线细节时**只能干瞪眼**。
   * 而这套查看器（捏合缩放 + 双击 + 放大后拖动）是上一轮刚为"图片不能缩放"
   * 这个顾客反馈做的，能力已经有了，只是没复用过来。
   *
   * <p>用**一次性的全局事件委托**，不依赖任何模块闭包：
   * 详情页是模块化渲染的，每个模块函数只 return HTML 字符串，拿不到闭包里的 d；
   * 而图片此刻就在 DOM 里且按序排列，直接向 .d-stack 查即可，
   * 这样也不必给每张图挂一个 onclick（重渲染会叠加监听器）。
   * loading="lazy" 不影响 —— src 属性始终存在，未加载的图也拿得到 URL。
   */
  (function () {
    document.addEventListener('click', function (e) {
      var t = e.target;
      if (!t || !t.classList || !t.classList.contains('d-stack-img')) return;
      var box = t.closest('.d-stack');
      if (!box) return;
      var all = box.querySelectorAll('img.d-stack-img');
      var imgs = [];
      var start = 0;
      for (var i = 0; i < all.length; i++) {
        var u = all[i].getAttribute('src');
        if (!u) continue;
        if (all[i] === t) start = imgs.length;
        imgs.push(u);
      }
      if (imgs.length) openImageViewer(imgs, start);
    });
  })();

  function openImageViewer(imgs, start) {
    imgs = (imgs || []).filter(Boolean);
    if (!imgs.length) return;
    var idx = Math.max(0, Math.min(imgs.length - 1, Number(start) || 0));
    var mask = document.createElement('div');
    mask.className = 'd-viewer';
    mask.innerHTML = '<button class="close" id="vwClose">&#10005;</button>'
      + '<div id="vwImgBox" class="box"></div>'
      + '<span class="hint" id="vwHint">双击或捏合可放大</span>'
      + (imgs.length > 1 ? '<span class="cnt" id="vwCnt"></span>' : '');
    document.body.appendChild(mask);
    // 查看器铺满全屏期间禁止背景跟着滚
    var prevOverflow = document.body.style.overflow;
    document.body.style.overflow = 'hidden';

    var MAXS = 4;               // 最大放大倍数（再大就是马赛克，主流电商也是 3~4 倍）
    var boxEl = document.getElementById('vwImgBox');
    var closed = false;

    /* ── 缩放/平移状态 ──
       变换作用在 .box 上（transform 不影响布局），所以「contain 适配后的显示尺寸」
       始终能算得出来，平移边界也就有了准确依据。 */
    var scale = 1, tx = 0, ty = 0;

    function apply(animate) {
      if (!boxEl) return;
      boxEl.style.transition = animate ? 'transform .2s ease-out' : 'none';
      boxEl.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + scale + ')';
    }
    /** 图片在 1 倍下的实际显示尺寸（按 contain 适配算，和 CSS 的 max-width/max-height 一致） */
    function dispSize() {
      var img = boxEl && boxEl.querySelector('img');
      var bw = mask.clientWidth, bh = mask.clientHeight;
      var nw = img ? img.naturalWidth : 0, nh = img ? img.naturalHeight : 0;
      if (!nw || !nh) return { w: bw, h: bh };     // 还没加载出来，先按铺满算
      var fit = Math.min(bw / nw, bh / nh);
      return { w: nw * fit, h: nh * fit };
    }
    /** 平移量限死在「图片边缘不离开屏幕」的范围内；mx/my 是允许的最大偏移 */
    function clampT(x, y) {
      var d = dispSize();
      var mx = Math.max(0, (d.w * scale - mask.clientWidth) / 2);
      var my = Math.max(0, (d.h * scale - mask.clientHeight) / 2);
      return { x: Math.max(-mx, Math.min(mx, x)), y: Math.max(-my, Math.min(my, y)), mx: mx, my: my };
    }
    function resetZoom(animate) { scale = 1; tx = 0; ty = 0; apply(animate); }
    /**
     * 以屏幕点 (cx,cy) 为锚点缩放到 ns，保证该点下方的画面不动。
     * 记锚点相对屏幕中心的偏移 v、内容点相对中心的距离 d=(v-t)/s，
     * 缩放后要让它仍落在 v 上：t' = v - (ns/s)·(v - t)。
     */
    function zoomAt(ns, cx, cy, animate) {
      ns = Math.max(1, Math.min(MAXS, ns));
      var vx = cx - mask.clientWidth / 2, vy = cy - mask.clientHeight / 2;
      var k = ns / scale;
      tx = vx - k * (vx - tx);
      ty = vy - k * (vy - ty);
      scale = ns;
      var c = clampT(tx, ty);
      tx = c.x; ty = c.y;
      apply(animate);
    }

    function paint() {
      if (boxEl) boxEl.innerHTML = thumbHtml(imgs[idx]);
      var cnt = document.getElementById('vwCnt');
      if (cnt) cnt.textContent = (idx + 1) + ' / ' + imgs.length;
      resetZoom(false);
    }
    function close() {
      if (closed) return;          // 关闭键的 click 与 touchend 可能各调一次，只认第一次
      closed = true;
      if (closeTimer) { clearTimeout(closeTimer); closeTimer = null; }
      // 时间窗兜底：掐掉紧随其后的穿透 click（详见 swallowClicks 的注释）
      swallowClicks(350);
      if (mask.parentNode) mask.parentNode.removeChild(mask);
      document.body.style.overflow = prevOverflow;
    }
    paint();
    on('vwClose', function (e) { if (e && e.stopPropagation) e.stopPropagation(); close(); });
    // 提示只留一会儿，之后自己淡出，别一直压着图片
    var hintTimer = setTimeout(function () {
      var h = document.getElementById('vwHint');
      if (h) h.classList.add('off');
    }, 2600);

    /* ── 手势 ──
       mode：'' 空闲 ｜ 'pan' 单指拖动/平移 ｜ 'pinch' 双指缩放 */
    var sx = 0, sy = 0, moved = false;
    var mode = '';
    var t0x = 0, t0y = 0;        // 手势开始时的平移量
    var s0 = 1;                  // 手势开始时的倍数
    var p0d = 1, v0x = 0, v0y = 0;   // 双指起始间距 / 起始中点（相对屏幕中心）
    var overX = 0;               // 拖动越界的量，松手时用来判断「切上一张/下一张」
    var lastTap = 0, lastTapX = 0, lastTapY = 0;
    var closeTimer = null;

    function down(x, y) {
      sx = x; sy = y; moved = false; overX = 0;
      t0x = tx; t0y = ty; mode = 'pan';
    }
    function drag(x, y) {
      if (Math.abs(x - sx) > 10 || Math.abs(y - sy) > 10) moved = true;
      if (mode !== 'pan' || scale <= 1) return;      // 1 倍时交给松手后的「切图」判断
      var wantX = t0x + (x - sx), wantY = t0y + (y - sy);
      var c = clampT(wantX, wantY);
      tx = c.x; ty = c.y;
      overX = wantX - c.x;                           // 越界多少，松手时决定是否切图
      apply(false);
    }
    function pinchStart(e) {
      var a = e.touches[0], b = e.touches[1];
      p0d = Math.max(1, Math.sqrt(Math.pow(a.clientX - b.clientX, 2) + Math.pow(a.clientY - b.clientY, 2)));
      v0x = (a.clientX + b.clientX) / 2 - mask.clientWidth / 2;
      v0y = (a.clientY + b.clientY) / 2 - mask.clientHeight / 2;
      s0 = scale; t0x = tx; t0y = ty;
      mode = 'pinch'; moved = true;                  // 双指永远不算「轻点」
      if (closeTimer) { clearTimeout(closeTimer); closeTimer = null; }
    }
    function pinchMove(e) {
      var a = e.touches[0], b = e.touches[1];
      var d = Math.sqrt(Math.pow(a.clientX - b.clientX, 2) + Math.pow(a.clientY - b.clientY, 2));
      var cx = (a.clientX + b.clientX) / 2, cy = (a.clientY + b.clientY) / 2;
      var ns = Math.max(1, Math.min(MAXS, s0 * d / p0d));
      var k = ns / s0;
      // 锚点用「手势起始的中点」、位置用「当前中点」→ 既以双指中心缩放，又跟着手指走
      tx = (cx - mask.clientWidth / 2) - k * v0x;
      ty = (cy - mask.clientHeight / 2) - k * v0y;
      scale = ns;
      var c = clampT(tx, ty);
      tx = c.x; ty = c.y;
      apply(false);
    }
    /** 轻点：可能是「关闭」也可能是「双击放大」，等一个双击窗口再决定 */
    function tap(x, y) {
      var now = Date.now();
      if (now - lastTap < 260 && Math.abs(x - lastTapX) < 32 && Math.abs(y - lastTapY) < 32) {
        lastTap = 0;
        if (closeTimer) { clearTimeout(closeTimer); closeTimer = null; }
        if (scale > 1.02) resetZoom(true);           // 已放大 → 缩回适应屏幕
        else zoomAt(2.5, x, y, true);                // 1 倍 → 以双击点为中心放大
        return;
      }
      lastTap = now; lastTapX = x; lastTapY = y;
      if (closeTimer) clearTimeout(closeTimer);
      closeTimer = setTimeout(function () { closeTimer = null; close(); }, 240);
    }
    function up(x, y) {
      var wasPinch = (mode === 'pinch');
      mode = '';
      if (wasPinch) {
        if (scale < 1.05) resetZoom(true);           // 捏回接近 1 倍就居中归位
        moved = false; lastTap = 0;                  // 双指结束后的抬手不算轻点
        return;
      }
      if (moved) {
        var dx = x - sx, dy = y - sy;
        if (scale > 1) {
          // 放大状态下拖到图片边缘还继续拖 → 切上/下一张（和淘宝一致）
          if (Math.abs(overX) >= 60 && Math.abs(dx) > Math.abs(dy) && imgs.length > 1) {
            idx = (idx + (overX > 0 ? imgs.length - 1 : 1)) % imgs.length;
            overX = 0;
            paint();
            return;
          }
          var c = clampT(tx, ty);                    // 没越过阈值就把越界部分弹回去
          tx = c.x; ty = c.y; overX = 0; apply(true);
          return;
        }
        if (Math.abs(dx) < 40 || Math.abs(dx) < Math.abs(dy) || imgs.length < 2) return;
        idx = (idx + (dx < 0 ? 1 : imgs.length - 1)) % imgs.length;
        paint();
        return;
      }
      tap(x, y);
    }

    mask.addEventListener('touchstart', function (e) {
      if (e.touches.length >= 2) pinchStart(e);
      else down(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });
    mask.addEventListener('touchmove', function (e) {
      if (e.touches.length >= 2) { if (mode !== 'pinch') pinchStart(e); pinchMove(e); return; }
      if (mode === 'pinch') return;                  // 双指刚松开一指，这一帧先不当拖动
      drag(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });
    // ⚠️ 必须非 passive：这里要 preventDefault 掐掉浏览器在触摸流末尾补发的
    //    mousedown/mouseup/click。否则查看器刚移除，补发的 click 就穿透到
    //    下面露出来的商品主图上，把它又打开 —— 顾客再也回不到详情页。
    mask.addEventListener('touchend', function (e) {
      if (e.cancelable !== false && e.preventDefault) e.preventDefault();
      if (e.touches && e.touches.length) {
        // 双指松开一指：接续成单指拖动，不要把这次当成手势结束
        var t = e.touches[0];
        sx = t.clientX; sy = t.clientY; t0x = tx; t0y = ty; mode = 'pan'; moved = true;
        return;
      }
      up(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
    }, { passive: false });
    mask.addEventListener('touchcancel', function () { mode = ''; moved = false; }, { passive: true });
    mask.addEventListener('mousedown', function (e) { down(e.clientX, e.clientY); });
    mask.addEventListener('mousemove', function (e) { if (e.buttons) drag(e.clientX, e.clientY); });
    mask.addEventListener('mouseup', function (e) { up(e.clientX, e.clientY); });
    // 电脑端：滚轮缩放（以光标为锚点），没有触摸屏也能看清细节
    mask.addEventListener('wheel', function (e) {
      e.preventDefault();
      zoomAt(scale * (e.deltaY > 0 ? 1 / 1.15 : 1.15), e.clientX, e.clientY, false);
    }, { passive: false });
  }

  /* ══════════════ 评价（D-783） ══════════════ */

  /** 星级渲染（只读展示用） */
  function starsHtml(rating) {
    var n = Math.max(0, Math.min(5, Math.round(Number(rating) || 0)));
    var h = '';
    for (var i = 1; i <= 5; i++) {
      h += '<span class="d-star' + (i <= n ? ' on' : '') + '">&#9733;</span>';
    }
    return '<span class="d-stars">' + h + '</span>';
  }

  /**
   * 评价区块渲染。
   *
   * <p><b>能不能评价由服务端说话</b>：后端只允许「已发货订单里的商品」评价，
   * 且一单一款一条不可修改。这里只负责把可评价的入口显示出来，
   * 真正提交时仍由服务端二次校验 —— 前端校验一律只是体验，不是安全边界。
   */
  function reviewsBoxHtml() {
    return '<div class="d-sec" id="reviewSec"><div class="lbl">商品评价</div>'
      + '<div id="reviewBox"><div class="d-review-empty">加载中…</div></div></div>';
  }

  /** 拉评价列表 + 判断当前顾客能不能评价 */
  function loadReviews(styleId, styleNo) {
    var box = document.getElementById('reviewBox');
    if (!box) return;
    get('/api/shop/public/platform/styles/' + encodeURIComponent(styleId) + '/reviews?limit=20',
      function (data) {
        var rating = Number(data.rating || 0);
        var count = Number(data.count || 0);
        var records = data.records || [];
        var h = '';
        if (count > 0) {
          h += '<div class="d-review-sum">'
            + '<div class="d-review-avg">' + rating.toFixed(1) + '</div>'
            + '<div>' + starsHtml(rating)
            + '<div class="d-review-cnt">' + count + ' 条评价</div></div></div>';
        }
        // 「写评价」入口：登录后才知道能不能评价
        h += '<div class="d-review-act" id="reviewAct"></div>';

        if (!records.length) {
          h += '<div class="d-review-empty">'
            + (count > 0 ? '' : '还没有评价') + '</div>';
        } else {
          for (var i = 0; i < records.length; i++) {
            var r = records[i];
            var txt = r.content;
            // 匿名评价不展示任何身份信息
            var who = Number(r.anonymous) === 1 ? '匿名顾客' : (r.nickname || r.consumerId || '顾客');
            h += '<div class="d-review-item">'
              + '<div class="d-review-head">' + starsHtml(r.rating)
              + '<span class="d-review-name">' + esc(who) + '</span>'
              + '<span class="d-review-time">' + esc((r.createTime || '').replace('T', ' ').slice(0, 10)) + '</span>'
              + '</div>'
              + (txt ? '<div class="d-review-txt">' + esc(txt) + '</div>' : '')
              + '</div>';
          }
        }
        box.innerHTML = h;
        renderReviewAction(styleId, styleNo);
      },
      function () {
        box.innerHTML = '<div class="d-review-empty">评价加载失败</div>';
      });
  }

  /**
   * 「写评价」入口。
   *
   * <p>未登录 → 引导登录；已登录但没买过/未发货 → 如实说明，不给假入口；
   * 买过且已发货 → 给按钮。
   */
  function renderReviewAction(styleId, styleNo) {
    var act = document.getElementById('reviewAct');
    if (!act) return;
    if (!isLoggedIn()) {
      act.innerHTML = '<button class="d-review-btn ghost" id="reviewLogin">登录后可评价</button>';
      on('reviewLogin', openLoginModal);
      return;
    }
    get('/api/shop/public/me/orders', function (orders) {
      var hit = null;
      for (var i = 0; i < (orders || []).length; i++) {
        var o = orders[i];
        if (o.status !== 'SHIPPED') continue;
        hit = o;
        break;
      }
      if (!hit) {
        act.innerHTML = '<span class="d-review-tip">订单发货后即可评价</span>';
        return;
      }
      // 打开订单明细，确认这款商品在不在、评过没
      get('/api/shop/public/me/orders/' + encodeURIComponent(hit.orderNo), function (detail) {
        var items = (detail && detail.items) || [];
        var target = null;
        for (var j = 0; j < items.length; j++) {
          if (items[j].styleNo === styleNo) { target = items[j]; break; }
        }
        if (!target) {
          act.innerHTML = '<span class="d-review-tip">该商品不在你的已发货订单中</span>';
          return;
        }
        if (target.reviewed) {
          act.innerHTML = '<span class="d-review-tip">你已评价过这款商品</span>';
          return;
        }
        act.innerHTML = '<button class="d-review-btn" id="reviewWrite">写评价</button>';
        on('reviewWrite', function () { openReviewModal(styleNo, hit.orderNo); });
      });
    }, function (msg) {
      // ⚠️ 不能一律说成「登录状态已失效」：网络抖动、接口异常也会走到这里，
      // 那样会把顾客引去反复登录却解决不了问题。如实区分。
      act.innerHTML = '<span class="d-review-tip">'
        + (msg === '请先登录' ? '登录状态已失效，请重新登录' : '暂时无法判断评价资格，请稍后再试')
        + '</span>';
    });
  }

  /** 评价弹窗：星级 + 内容 + 匿名 */
  function openReviewModal(styleNo, orderNo) {
    var rating = 5;
    var mask = document.createElement('div');
    mask.className = 'd-modal';
    mask.innerHTML =
      '<div class="d-modal-card">'
      + '<div class="d-modal-title">评价这款商品</div>'
      + '<div class="d-rate" id="rateBox">' + [1, 2, 3, 4, 5].map(function (i) {
          return '<span class="d-star' + (i <= 5 ? ' on' : '') + '" data-n="' + i + '">&#9733;</span>';
        }).join('') + '</div>'
      + '<textarea id="rvText" class="d-modal-input" maxlength="500" rows="4"'
      + ' placeholder="说说面料、做工、版型合不合身…（选填）"></textarea>'
      + '<label class="d-modal-check"><input type="checkbox" id="rvAnon"> 匿名显示</label>'
      + '<div class="d-modal-acts">'
      + '<button class="d-modal-btn ghost" id="rvCancel">取消</button>'
      + '<button class="d-modal-btn primary" id="rvSubmit">提交评价</button>'
      + '</div></div>';
    document.body.appendChild(mask);

    function close() { if (mask.parentNode) mask.parentNode.removeChild(mask); }
    on('rvCancel', close);
    mask.onclick = function (e) { if (e.target === mask) close(); };

    var rateBox = document.getElementById('rateBox');
    function paintRate() {
      Array.prototype.forEach.call(rateBox.children, function (el) {
        if (Number(el.getAttribute('data-n')) <= rating) el.classList.add('on');
        else el.classList.remove('on');
      });
    }
    rateBox.onclick = function (e) {
      var t = e.target;
      if (!t || !t.getAttribute) return;
      var n = t.getAttribute('data-n');
      if (n) { rating = Number(n); paintRate(); }
    };
    paintRate();

    on('rvSubmit', function () {
      var content = document.getElementById('rvText').value;
      var anon = document.getElementById('rvAnon').checked;
      post('/api/shop/public/me/orders/' + encodeURIComponent(orderNo) + '/reviews', {
        styleNo: styleNo, rating: rating, content: content, anonymous: anon
      }, function () {
        close();
        toast('评价已提交，感谢您的反馈');
        var cur = route() && document.getElementById('reviewBox') ? location.hash : location.hash;
        var m = cur.match(/^#\/p\/(\d+)$/);
        if (m) loadReviews(m[1], styleNo);
      }, function (msg) {
        toast(msg || '评价提交失败');
      });
    });
  }

  /* ══════════════ 登录 / 注册 ══════════════ */

  function openLoginModal() {
    var mask = document.createElement('div');
    mask.className = 'd-modal';
    mask.innerHTML =
      '<div class="d-modal-card">'
      + '<div class="d-modal-title" id="lgTitle">登录</div>'
      + '<input class="d-modal-input" id="lgPhone" type="tel" inputmode="numeric" placeholder="手机号" maxlength="11">'
      + '<input class="d-modal-input" id="lgPwd" type="password" placeholder="密码" maxlength="32">'
      + '<input class="d-modal-input" id="lgNick" placeholder="昵称（注册时填）" maxlength="20">'
      + '<div class="d-modal-acts">'
      + '<button class="d-modal-btn ghost" id="lgCancel">取消</button>'
      + '<button class="d-modal-btn primary" id="lgGo">登录</button>'
      + '</div>'
      + '<div class="d-modal-switch"><span id="lgTip">还没有账号？</span>'
      + '<button class="lnk" id="lgToggle">立即注册</button></div>'
      + '</div>';
    document.body.appendChild(mask);
    var mode = 'login';
    function close() { if (mask.parentNode) mask.parentNode.removeChild(mask); }
    on('lgCancel', close);
    mask.onclick = function (e) { if (e.target === mask) close(); };

    on('lgToggle', function () {
      mode = mode === 'login' ? 'register' : 'login';
      document.getElementById('lgTitle').textContent = mode === 'login' ? '登录' : '注册';
      document.getElementById('lgGo').textContent = mode === 'login' ? '登录' : '注册';
      document.getElementById('lgTip').textContent = mode === 'login' ? '还没有账号？' : '已有账号？';
      document.getElementById('lgToggle').textContent = mode === 'login' ? '立即注册' : '去登录';

  /* ══════════════ D-770：详情页模块化布局 ══════════════
   *
   * 参照主流电商（淘宝/1688/拼多多）的做法：详情页不是写死的版式，
   * 而是一组固定模块，商家可勾选启用哪些、并调整上到下顺序。
   *
   * 每个模块渲染为空字符串时自动跳过 —— 商家开了但没填资料，
   * 不该给顾客看到空白块（CLAUDE.md 铁律 9：缺失不能伪装成有）。
   */
  var DETAIL_MODULES = ['gallery', 'price', 'title', 'promise', 'points', 'color', 'size',
                        'quantity', 'params', 'priceNote', 'detail', 'faq', 'reviews', 'wash', 'recommend', 'purchase'];

  /** 按 layout 拿到启用模块的自上而下顺序；无 layout 时用默认顺序全开 */
  function detailModuleOrder(d) {
    var out = [];
    var lay = (d && d.layout && d.layout.length) ? d.layout : null;
    if (lay) {
      var known = {};
      for (var i = 0; i < lay.length; i++) {
        var key = lay[i] && lay[i].moduleKey;
        if (!key || DETAIL_MODULES.indexOf(key) < 0) continue;
        known[key] = lay[i];
      }
      var sorted = Object.keys(known).sort(function (a, b) {
        return (Number(known[a].sortOrder) || 0) - (Number(known[b].sortOrder) || 0);
      });
      for (var k = 0; k < sorted.length; k++) {
        var it = known[sorted[k]];
        // enabled 为 0 则跳过；缺失视作启用（老数据兼容）
        if (it.enabled === 0 || it.enabled === false) continue;
        out.push(sorted[k]);
      }
    } else {
      out = DETAIL_MODULES.slice();
    }
    return out;
  }

  /**
   * @param renderers 模块渲染函数表。**必须显式传入**：
   *   各模块渲染器依赖详情页的局部变量（minPrice/totalStock/colors 等），
   *   定义在 renderDetail 内部，无法提升为模块级常量。
   *   上一版在此处直接引用 DETAIL_RENDERERS，触发 ReferenceError：
   *   错误被 route() 上层吞掉，症状是详情页永远停在「加载中…」，且控制台无报错。
   */
  function renderDetailModules(d, order, renderers) {
    renderers = renderers || {};
    var parts = {};
    for (var i = 0; i < order.length; i++) {
      var key = order[i];
      var fn = renderers[key];
      if (!fn) continue;
      var out = '';
      try { out = fn(d) || ''; } catch (e) { out = ''; }
      if (out) parts[key] = out;
    }
    var html = '';
    for (var j = 0; j < order.length; j++) {
      if (parts[order[j]]) html += parts[order[j]];
    }
    return html;
  }

  /**
   * 尺码表渲染（D-780）
   *
   * 两种来源：
   * 1) sizeChartSource='auto' → 后端从 SKU 矩阵自动生成的「颜色 × 尺码 × 价格」表
   * 2) 商家自己填的 print_size 富文本
   *
   * 自动表必须按「列=尺码、行=颜色」呈现 —— 这是服装类目的通用读法；
   * 且尺码顺序沿用库里顺序（XS→S→M→L），不能按字母排，
   * 按字母排会把 XL 排到 XS 前面。
   * 无库存的规格显示「售罄」而不是留空：留空会被理解成"没这个码"。
   */
  function sizeChartHtml(d) {
    var c = d.sizeChart;
    if (!c) return '';
    // 自动生成的矩阵表
    if (c.type === 'sku-matrix' && c.colors && c.rows && c.rows.length) {
      var colors = c.colors, rows = c.rows;
      var h = '<div class="d-sec"><div class="lbl">尺寸表'
        + '<span class="hint">' + esc(d.sizeChartSource === 'auto' ? '按颜色与尺码自动生成' : '') + '</span></div>'
        + '<div class="size-tbl-wrap"><table class="size-tbl"><thead><tr><th>尺码</th>';
      for (var i = 0; i < colors.length; i++) {
        h += '<th>' + esc(colors[i]) + '</th>';
      }
      h += '</tr></thead><tbody>';
      for (var j = 0; j < rows.length; j++) {
        var r = rows[j];
        h += '<tr><th>' + esc(r.size) + '</th>';
        for (var k = 0; k < colors.length; k++) {
          var cell = r[colors[k]];
          if (!cell) {
            h += '<td class="na">—</td>';
          } else if (cell.soldOut) {
            h += '<td class="soldout">售罄</td>';
          } else {
            h += '<td>' + (cell.price != null ? '<span class="cny">¥</span>' + Number(cell.price).toFixed(0) : '') + '</td>';
          }
        }
        h += '</tr>';
      }
      return h + '</tbody></table></div></div>';
    }
    // 商家自定义的富文本尺码表
    return '<div class="d-sec"><div class="lbl">尺寸表</div>'
      + '<div class="d-desc rich">' + richHtml(c) + '</div></div>';
  }

  /* ── 商品详情 ── */
  /**
   * D-802：详情页统一外壳的交互。
   *
   * ① 顶栏随滚动变实色 —— 滚过轮播后才需要「品牌色」的视觉锚点，
   *    顶部时保持透明，不跟主图抢注意力。
   * ② 吸顶锚点：点击平滑滚动 + 滚动反向高亮当前段。
   *    高亮用 scroll 位置算，不监听每个模块的 IntersectionObserver ——
   *    模块是商家可配的（顺序/开关都可能变），IO 要重绑，scroll 直接算最稳。
   * ③ 商家没配的模块（如无人评价）对应锚点不存在 → 隐藏该 tab，
   *    剩下的平分宽度，而不是点一下没反应。
   */
  function initDetailShell() {
    // D-802 修复：顶栏最初只有 class 没有 id，这里 getElementById 返回 null，
    // offsetTop() 少算了顶栏高度 —— 点「尺码」后目标正好被顶栏盖住，
    // 页面不报错、看起来「点了没反应」，只能靠真点一次才发现。
    // 故 id 之外再兜一层 class 查询。
    var nav = document.getElementById('dnav') || document.querySelector('.d-nav');
    if (nav) {
      var onNavScroll = function () {
        nav.className = window.scrollY > 40 ? 'd-nav solid' : 'd-nav';
      };
      window.addEventListener('scroll', onNavScroll, { passive: true });
      onNavScroll();
    }
    var bar = document.getElementById('anchors');
    if (!bar) return;
    var all = Array.prototype.slice.call(bar.querySelectorAll('.anc'));
    var live = all.filter(function (t) {
      return !!document.getElementById(t.getAttribute('data-t'));
    });
    if (!live.length) { bar.parentNode.removeChild(bar); return; }
    all.forEach(function (t) {
      if (live.indexOf(t) < 0) t.style.display = 'none';
    });
    function offsetTop() {
      return (nav ? nav.offsetHeight : 0) + (bar.offsetHeight || 0) + 1;
    }
    live.forEach(function (t) {
      t.addEventListener('click', function () {
        var el = document.getElementById(t.getAttribute('data-t'));
        if (!el) return;
        window.scrollTo({
          top: el.getBoundingClientRect().top + window.scrollY - offsetTop(),
          behavior: 'smooth'
        });
      });
    });
    var pick = function () {
      var head = offsetTop() + 8;
      var cur = live[0];
      live.forEach(function (t) {
        var el = document.getElementById(t.getAttribute('data-t'));
        if (el && el.getBoundingClientRect().top <= head) cur = t;
      });
      live.forEach(function (t) {
        t.className = live.length && t === cur ? 'anc on' : 'anc';
      });
    };
    window.addEventListener('scroll', pick, { passive: true });
    window.addEventListener('resize', pick);
    pick();
  }

  function renderDetail(styleId) {
    app.innerHTML = '<div class="loading"><span class="spin"></span>加载中…</div>';
    // D-770 修复：详情页此前**从不请求 /info**，直接刷新或从外部链接进入时
    // shopInfo 为 null —— shipCfg() 会静默按「包邮/0 运费」渲染，
    // 导致详情页显示错误的配送信息（不报错，只是数据错）。
    // 无论从首页跳转还是直接打开链接，都先确保店铺配置已加载。
    ensureShopInfo(function () {
      get(API + '/' + slug + '/products/' + styleId, function (d) {
      var skus = d.skus || [];
      var byColor = {};
      skus.forEach(function (k) { var c = k.color || '默认'; (byColor[c] = byColor[c] || []).push(k); });
      var colors = Object.keys(byColor);
      var prices = skus.map(function (k) { return Number(k.price || 0); }).filter(function (n) { return n > 0; });
      var minPrice = prices.length ? Math.min.apply(null, prices) : null;
      var totalStock = skus.reduce(function (s, k) { return s + (k.stock || 0); }, 0);
      var sel = { skuId: null, qty: 1, color: null, size: null, stock: 0, price: 0 };
      // 轮播实际渲染的图片清单（由 gallery 模块填充，选颜色时要用它重排）
      var galImgs = [];
      // D-768：颜色 → 图片（顾客选颜色时换成该颜色的图，无则回退主图）
      var colorImgMap = d.colorImages || {};
      function heroUrlFor(color) { return (color && colorImgMap[color]) || d.cover || ''; }

      // D-770：按商家自定义的模块顺序渲染；无布局配置时用默认顺序
      var order = detailModuleOrder(d);
      // D-777：服务承诺只应出现一次。商家把「服务承诺」建成独立模块时
      // 走独立块；否则由标题区补上标签。两种配置都不会重复输出。
      var promiseStandalone = order.indexOf('promise') >= 0;

      /** 各模块渲染函数：返回空串表示「本模块无内容」，自动跳过，
       *  避免商家开了模块却没填资料时给顾客看到空白块。 */
      var DETAIL_RENDERERS = {
gallery: function (d) {
          // D-782：商家排好的轮播图优先；没有才回落「主图 + 各颜色图」
          // （库里已有上百张颜色图，此前只显示第一张）。
          // galImgs 必须与真正渲染出来的 cell 一一对应：选颜色换图要用同一份清单。
          galImgs = galleryImages(d);
          // D-802：顶栏+锚点承担返回与导航后，轮播上的悬浮返回圈就是重复控件，
          // 两个返回按钮会让顾客 unsure 哪个才真的能退回。统一走顶栏。
          var h = '<div id="anc-top"></div>' + carouselHtml(galImgs, false);
          // D-782：商品视频紧跟图片区
          if (d.videoUrl) {
            h += '<div class="d-sec"><div class="lbl">商品视频</div>'
              + '<video class="d-video" src="' + esc(d.videoUrl) + '" controls preload="metadata" playsinline></video></div>';
          }
          return h;
        },
        price: function (d) {
          // D-777：承诺从价格区移除（它属于标题区），这里只留价格/库存/配送
          var stock = totalStock > 0
            ? '<span>现货 ' + totalStock + ' 件</span>'
            : '<span class="warn">暂时缺货</span>';
          return '<div class="d-price"><div class="row">' + priceHtml(minPrice, 'lg') + '</div>'
            + '<div class="sub">' + stock
            + '<span>' + esc(shipTag()) + '</span>'
            + (colors.length > 1 ? '<span>' + colors.length + ' 色可选</span>' : '')
            + '</div></div>';
        },
title: function (d) {
          // D-777：独立承诺块缺席时才补标签，避免与它重复。
          // ⚠️ 这里绝不能写死任何承诺文案：
          // 承诺必须来自商家配置，否则就是 D-770 已清除的「空头承诺」，
          // 且会与承诺块里的同一条重复显示。
          var tags = '<span class="tag free">' + esc(shipTag()) + '</span>';
          if (!promiseStandalone) tags += promiseTags();
          // D-782：品牌放在标题下方
          var brand = d.brand
            ? '<div class="d-brand">' + esc(d.brand) + '</div>' : '';
          return '<div class="d-title"><h2>' + esc(d.styleName || '') + '</h2>'
            + '<div class="tags">' + tags + '</div>' + brand
            + '<div class="no">货号 ' + esc(d.styleNo || '') + '</div></div>';
        },
        promise: function (d) {
          if (!promiseStandalone) return '';
          var t = promiseTags();
          // 没开启任何承诺时不渲染空模块
          return t ? '<div class="d-sec"><div class="lbl">服务承诺</div>'
            + '<div class="tags">' + t + '</div></div>' : '';
        },
        color: function (d) {
          if (!colors.length) return '';

var html = renderDetailModules(d, order, DETAIL_RENDERERS);

      // D-777：所有绑定一律走容错的 on()，任何一个元素缺失都不再影响其余绑定
      on('dnav-back', back);
      on('dnav-share', function () {

        if (navigator.share) {
