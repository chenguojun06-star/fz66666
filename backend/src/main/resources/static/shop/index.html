<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>云裳小店</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:#f5f5f5; color:#333; padding-bottom:60px; }
  .topbar { background:linear-gradient(135deg,#ff6b35,#ff9558); color:#fff; padding:14px 16px; position:sticky; top:0; z-index:10; }
  .topbar h1 { font-size:17px; font-weight:600; }
  .topbar .notice { font-size:12px; opacity:.9; margin-top:2px; }
  .searchbar { margin-top:8px; background:rgba(255,255,255,.25); border-radius:16px; display:flex; }
  .searchbar input { flex:1; background:transparent; border:none; outline:none; color:#fff; padding:7px 14px; font-size:13px; }
  .searchbar input::placeholder { color:rgba(255,255,255,.8); }
  .searchbar button { border:none; background:rgba(255,255,255,.3); color:#fff; border-radius:0 16px 16px 0; padding:0 14px; font-size:13px; }
  .closed { background:#fff3e0; color:#e65100; font-size:13px; padding:8px 16px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; padding:8px; }
  .card { background:#fff; border-radius:10px; overflow:hidden; position:relative; }
  .card img { width:100%; aspect-ratio:1; object-fit:cover; display:block; background:#eee; }
  .card .info { padding:8px 10px 10px; }
  .card .name { font-size:14px; line-height:1.35; height:38px; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .card .row { display:flex; justify-content:space-between; align-items:baseline; margin-top:6px; }
  .card .price { color:#ff4d4f; font-size:16px; font-weight:700; }
  .card .price::before { content:"¥"; font-size:11px; }
  .card .stock { font-size:11px; color:#999; }
  .card .soldout { position:absolute; top:0; left:0; background:rgba(0,0,0,.55); color:#fff; font-size:12px; padding:3px 10px; border-radius:0 0 10px 0; }
  .empty { text-align:center; padding:60px 0; color:#999; font-size:14px; }
  /* 详情 */
  .detail-img { width:100%; aspect-ratio:1; object-fit:cover; display:block; background:#eee; }
  .detail-head { background:#fff; padding:14px 16px; }
  .detail-head .price { color:#ff4d4f; font-size:22px; font-weight:700; }
  .detail-head .price::before { content:"¥"; font-size:13px; }
  .detail-head h2 { font-size:16px; font-weight:600; margin-top:4px; }
  .detail-head .no { color:#999; font-size:12px; margin-top:2px; }
  .sec { background:#fff; margin-top:8px; padding:14px 16px; }
  .sec h3 { font-size:14px; margin-bottom:10px; }
  .opt-group { display:flex; flex-wrap:wrap; gap:8px; }
  .opt { border:1px solid #ddd; border-radius:6px; padding:6px 14px; font-size:13px; background:#fff; }
  .opt.sel { border-color:#ff6b35; color:#ff6b35; background:#fff7f3; font-weight:600; }
  .opt.dis { color:#ccc; background:#fafafa; text-decoration:line-through; }
  .qty-row { display:flex; align-items:center; justify-content:space-between; }
  .qty-ctl { display:flex; align-items:center; gap:0; border:1px solid #ddd; border-radius:6px; overflow:hidden; }
  .qty-ctl button { width:32px; height:30px; border:none; background:#fafafa; font-size:16px; }
  .qty-ctl span { width:44px; text-align:center; font-size:14px; }
  .bottombar { position:fixed; bottom:0; left:0; right:0; background:#fff; display:flex; box-shadow:0 -2px 8px rgba(0,0,0,.06); z-index:20; }
  .bottombar .cart-btn { flex:1; text-align:center; padding:12px 0; font-size:15px; position:relative; }
  .bottombar .cart-btn .badge { position:absolute; top:4px; right:24px; background:#ff4d4f; color:#fff; border-radius:9px; font-size:10px; padding:1px 5px; }
  .bottombar .buy { flex:2; background:linear-gradient(135deg,#ff6b35,#ff9558); color:#fff; text-align:center; padding:12px 0; font-size:15px; font-weight:600; border:none; }
  .bottombar .buy:disabled { background:#ccc; }
  /* 表单 */
  .form-item { margin-bottom:12px; }
  .form-item label { display:block; font-size:13px; color:#666; margin-bottom:5px; }
  .form-item input, .form-item textarea { width:100%; border:1px solid #ddd; border-radius:6px; padding:9px 10px; font-size:14px; outline:none; }
  .form-item textarea { height:60px; resize:none; }
  .submit { width:100%; background:linear-gradient(135deg,#ff6b35,#ff9558); color:#fff; border:none; border-radius:22px; padding:11px 0; font-size:15px; font-weight:600; }
  .toast { position:fixed; top:40%; left:50%; transform:translateX(-50%); background:rgba(0,0,0,.75); color:#fff; padding:10px 18px; border-radius:8px; font-size:14px; z-index:99; max-width:80%; text-align:center; }
  .order-card { background:#fff; margin:8px; border-radius:10px; padding:12px 14px; }
  .order-card .no { font-size:12px; color:#999; }
  .order-card .st { float:right; font-size:12px; }
  .order-card .amt { color:#ff4d4f; font-weight:700; margin-top:6px; }
  .status-PENDING_SHIP { color:#ff9800; } .status-SHIPPED { color:#4caf50; } .status-CANCELLED { color:#999; }
  .back { font-size:14px; color:#666; padding:10px 16px; display:inline-block; }
  .cartline { display:flex; justify-content:space-between; align-items:center; background:#fff; margin:8px; border-radius:10px; padding:10px 14px; font-size:14px; }
  .cartline .rm { color:#ff4d4f; border:none; background:none; font-size:13px; }
</style>
</head>
<body>
<div id="app"></div>
<script>
var API = '/api/shop/public';
var slug = new URLSearchParams(location.search).get('s') || localStorage.getItem('shop_slug') || '';
if (slug) localStorage.setItem('shop_slug', slug);

function esc(s){ return String(s==null?'':s).replace(/[<>&"]/g, function(c){ return {'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]; }); }
function toast(msg){ var t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(function(){ t.remove(); },2400); }
function money(v){ return v==null?'—':'¥'+Number(v).toFixed(2); }
var ST = {PENDING_SHIP:'待发货', SHIPPED:'已发货', CANCELLED:'已取消'};
function cart(){ try { return JSON.parse(localStorage.getItem('shop_cart_'+slug)||'[]'); } catch(e){ return []; } }
function saveCart(c){ localStorage.setItem('shop_cart_'+slug, JSON.stringify(c)); }

function getJSON(url, cb){
  fetch(url).then(function(r){ return r.json(); }).then(function(d){
    if (d && d.code === 200) cb(d.data);
    else toast((d && d.message) || '加载失败');
  }).catch(function(){ toast('网络异常，请稍后再试'); });
}
function postJSON(url, body, cb){
  fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)})
    .then(function(r){ return r.json(); }).then(function(d){
      if (d && d.code === 200) cb(d.data);
      else toast((d && d.message) || '操作失败');
    }).catch(function(){ toast('网络异常，请稍后再试'); });
}

/* ── 首页：商品流 ── */
function renderHome(){
  getJSON(API+'/'+slug+'/info', function(info){
    getJSON(API+'/'+slug+'/products', function(data){
      var html = '<div class="topbar"><h1>'+esc(info.shopName||'小店')+(info.enabled?'':'（已打烊）')+'</h1>'
        + (info.notice?'<div class="notice">'+esc(info.notice)+'</div>':'')
        + '<div class="searchbar"><input id="kw" placeholder="搜索款式 / 货号"><button id="dosearch">搜索</button></div></div>';
      if (!info.enabled) html += '<div class="closed">店铺打烊中，暂时无法下单，可以继续逛</div>';
      html += '<div class="grid">';
      (data.records||[]).forEach(function(p){
        html += '<div class="card" data-id="'+p.styleId+'">'
          + '<img src="'+esc(p.cover||'')+'" onerror="this.style.visibility=\'hidden\'">'
          + (p.totalStock<=0?'<div class="soldout">已售罄</div>':'')
          + '<div class="info"><div class="name">'+esc(p.styleName)+'</div>'
          + '<div class="row"><span class="price">'+(p.minPrice==null?'—':Number(p.minPrice).toFixed(2))+'</span>'
          + '<span class="stock">库存'+p.totalStock+'</span></div></div></div>';
      });
      html += '</div>';
      if (!(data.records||[]).length) html += '<div class="empty">上架商品会出现在这里</div>';
      html += '<div class="bottombar"><div class="cart-btn" id="gocart">🛒 购物车'
        + (cart().length?'<span class="badge">'+cart().length+'</span>':'') + '</div>'
        + '<div class="cart-btn" id="gomine">📋 我的订单</div></div>';
      document.getElementById('app').innerHTML = html;
      document.getElementById('dosearch').onclick = function(){ loadHome(document.getElementById('kw').value.trim()); };
      document.getElementById('kw').onkeydown = function(e){ if(e.key==='Enter') loadHome(e.target.value.trim()); };
      Array.prototype.forEach.call(document.querySelectorAll('.card'), function(el){
        el.onclick = function(){ location.hash = '#/p/' + el.getAttribute('data-id'); };
      });
      document.getElementById('gocart').onclick = function(){ location.hash = '#/cart'; };
      document.getElementById('gomine').onclick = function(){ location.hash = '#/mine'; };
    });
  });
}
function loadHome(kw){
  document.getElementById('app').innerHTML = '<div class="empty">加载中…</div>';
  getJSON(API+'/'+slug+'/products' + (kw ? '?keyword='+encodeURIComponent(kw) : ''), function(data){
    // 复用首页渲染（简单起见整页重画，保留搜索词）
    renderHomeWithKeyword(kw, data);
  });
}
function renderHomeWithKeyword(kw, data){
  location.hash = '#/';
  getJSON(API+'/'+slug+'/info', function(info){
    var html = '<div class="topbar"><h1>'+esc(info.shopName||'小店')+'</h1>'
      + '<div class="searchbar"><input id="kw" value="'+esc(kw||'')+'" placeholder="搜索款式 / 货号"><button id="dosearch">搜索</button></div></div><div class="grid">';
    (data.records||[]).forEach(function(p){
      html += '<div class="card" data-id="'+p.styleId+'"><img src="'+esc(p.cover||'')+'" onerror="this.style.visibility=\'hidden\'">'
        + (p.totalStock<=0?'<div class="soldout">已售罄</div>':'')
        + '<div class="info"><div class="name">'+esc(p.styleName)+'</div><div class="row"><span class="price">'
        + (p.minPrice==null?'—':Number(p.minPrice).toFixed(2))+'</span><span class="stock">库存'+p.totalStock+'</span></div></div></div>';
    });
    html += '</div>';
    if (!(data.records||[]).length) html += '<div class="empty">没有找到相关商品</div>';
    document.getElementById('app').innerHTML = html;
    document.getElementById('dosearch').onclick = function(){ loadHome(document.getElementById('kw').value.trim()); };
    Array.prototype.forEach.call(document.querySelectorAll('.card'), function(el){
      el.onclick = function(){ location.hash = '#/p/' + el.getAttribute('data-id'); };
    });
  });
}

/* ── 详情：颜色/尺码/数量 ── */
var sel = {skuId:null, qty:1};
function renderDetail(styleId){
  getJSON(API+'/'+slug+'/products/'+styleId, function(d){
    var byColor = {};
    d.skus.forEach(function(k){ (byColor[k.color||'默认'] = byColor[k.color||'默认']||[]).push(k); });
    var colors = Object.keys(byColor);
    sel = {skuId:null, qty:1};
    var html = '<img class="detail-img" src="'+esc(d.cover||'')+'" onerror="this.style.visibility=\'hidden\')">'
      + '<div class="detail-head"><span class="price">'
      + (d.skus.length? Number(Math.min.apply(null, d.skus.map(function(k){return Number(k.price||0);}))).toFixed(2) : '—')
      + '</span><h2>'+esc(d.styleName)+'</h2><div class="no">货号 '+esc(d.styleNo)+'</div></div>'
      + '<div class="sec"><h3>颜色</h3><div class="opt-group" id="colors">'
      + colors.map(function(c){ return '<button class="opt" data-c="'+esc(c)+'">'+esc(c)+'</button>'; }).join('')
      + '</div><h3 style="margin-top:14px">尺码</h3><div class="opt-group" id="sizes"></div>'
      + '<div class="qty-row" style="margin-top:14px"><h3 style="margin:0">数量</h3>'
      + '<div class="qty-ctl"><button id="qm">−</button><span id="qv">1</span><button id="qp">＋</button></div></div></div>'
      + '<div class="back" id="bk">‹ 返回</div>'
      + '<div class="bottombar"><div class="cart-btn" id="addcart">🛒 加入购物车</div>'
      + '<button class="buy" id="buynow" disabled>请选择颜色尺码</button></div>';
    document.getElementById('app').innerHTML = html;
    document.getElementById('bk').onclick = function(){ history.back(); };
    var pickedColor = null, pickedSize = null;
    function refreshSizes(){
      var sizes = byColor[pickedColor] || [];
      document.getElementById('sizes').innerHTML = sizes.map(function(k){
        var dis = k.stock<=0 ? ' dis' : '';
        return '<button class="opt'+dis+'" data-s="'+esc(k.size)+'" data-id="'+k.skuId+'" data-stock="'+k.stock+'">'+esc(k.size)+'（'+k.stock+'）</button>';
      }).join('');
      Array.prototype.forEach.call(document.querySelectorAll('#sizes .opt'), function(el){
        el.onclick = function(){
          if (el.classList.contains('dis')) return;
          Array.prototype.forEach.call(document.querySelectorAll('#sizes .opt'), function(x){ x.classList.remove('sel'); });
          el.classList.add('sel');
          pickedSize = el.getAttribute('data-s');
          sel.skuId = el.getAttribute('data-id');
          sel.qty = 1; document.getElementById('qv').textContent = '1';
          var buy = document.getElementById('buynow');
          buy.disabled = false; buy.textContent = '立即购买';
        };
      });
    }
    Array.prototype.forEach.call(document.querySelectorAll('#colors .opt'), function(el){
      el.onclick = function(){
        Array.prototype.forEach.call(document.querySelectorAll('#colors .opt'), function(x){ x.classList.remove('sel'); });
        el.classList.add('sel');
        pickedColor = el.getAttribute('data-c'); pickedSize = null; sel.skuId = null;
        document.getElementById('buynow').disabled = true;
        document.getElementById('buynow').textContent = '请选择尺码';
        refreshSizes();
      };
    });
    document.getElementById('qm').onclick = function(){ if (sel.qty>1){ sel.qty--; document.getElementById('qv').textContent = sel.qty; } };
    document.getElementById('qp').onclick = function(){ sel.qty++; document.getElementById('qv').textContent = sel.qty; };
    document.getElementById('addcart').onclick = function(){
      if (!sel.skuId) return toast('请先选颜色和尺码');
      var name = d.styleName + ' ' + pickedColor + '/' + pickedSize;
      var c = cart().filter(function(x){ return x.skuId !== sel.skuId; });
      c.push({skuId:sel.skuId, qty:sel.qty, name:name, price:Number(document.querySelector('.detail-head .price').textContent)||0});
      saveCart(c); toast('已加入购物车');
    };
    document.getElementById('buynow').onclick = function(){
      if (!sel.skuId) return;
      saveCart([{skuId:sel.skuId, qty:sel.qty, name:d.styleName+' '+pickedColor+'/'+pickedSize, price:0}]);
      location.hash = '#/checkout';
    };
  });
}

/* ── 购物车 ── */
function renderCart(){
  var c = cart();
  var html = '<div class="back" id="bk">‹ 返回</div>';
  if (!c.length) {
    html += '<div class="empty">购物车是空的</div>';
  } else {
    c.forEach(function(x, i){
      html += '<div class="cartline"><span>'+esc(x.name)+'</span><span>×'+x.qty
        + ' <button class="rm" data-i="'+i+'">移除</button></span></div>';
    });
    html += '<div style="padding:8px"><button class="submit" id="toorder">去下单（'+c.length+' 项）</button></div>';
  }
  document.getElementById('app').innerHTML = html;
  document.getElementById('bk').onclick = function(){ history.back(); };
  Array.prototype.forEach.call(document.querySelectorAll('.rm'), function(el){
    el.onclick = function(){
      var cc = cart(); cc.splice(Number(el.getAttribute('data-i')),1); saveCart(cc); renderCart();
    };
  });
  var to = document.getElementById('toorder');
  if (to) to.onclick = function(){ location.hash = '#/checkout'; };
}

/* ── 下单表单 ── */
function renderCheckout(){
  var c = cart();
  if (!c.length) { document.getElementById('app').innerHTML = '<div class="empty">购物车是空的</div>'; return; }
  document.getElementById('app').innerHTML =
    '<div class="back" id="bk">‹ 返回</div>'
    + '<div class="sec"><div class="form-item"><label>收货人 *</label><input id="f_name" placeholder="姓名"></div>'
    + '<div class="form-item"><label>手机号 *</label><input id="f_phone" type="tel" placeholder="用于订单查询和联系发货"></div>'
    + '<div class="form-item"><label>收货地址 *</label><textarea id="f_addr" placeholder="省市区 + 详细地址"></textarea></div>'
    + '<div class="form-item"><label>留言</label><textarea id="f_remark" placeholder="选填"></textarea></div></div>'
    + '<div style="padding:8px"><button class="submit" id="submit">提交订单（货到前请准备付款，客服会联系您）</button></div>';
  document.getElementById('bk').onclick = function(){ history.back(); };
  document.getElementById('submit').onclick = function(){
    var body = {
      customerName: document.getElementById('f_name').value.trim(),
      phone: document.getElementById('f_phone').value.trim(),
      address: document.getElementById('f_addr').value.trim(),
      remark: document.getElementById('f_remark').value.trim(),
      items: c.map(function(x){ return {skuId:x.skuId, quantity:x.qty}; })
    };
    if (!body.customerName || !body.phone || !body.address) return toast('请填写收货人、手机号和地址');
    postJSON(API+'/'+slug+'/orders', body, function(d){
      saveCart([]);
      document.getElementById('app').innerHTML =
        '<div class="empty" style="padding-top:80px"><div style="font-size:40px">✅</div>'
        + '<p style="margin:14px 0 6px;font-size:16px;font-weight:600">下单成功</p>'
        + '<p>订单号 <b>'+esc(d.orderNo)+'</b></p>'
        + '<p style="margin-top:6px">应付 '+money(d.totalAmount)+'，客服会尽快联系您确认发货与付款</p>'
        + '<div style="margin-top:20px"><button class="submit" onclick="location.hash=\'#/mine\'">查我的订单</button>'
        + '<div style="height:10px"></div><button class="submit" style="background:#eee;color:#666" onclick="location.hash=\'#/\'">继续逛</button></div></div>';
    });
  };
}

/* ── 我的订单 ── */
function renderMine(){
  document.getElementById('app').innerHTML =
    '<div class="back" id="bk">‹ 返回</div>'
    + '<div class="sec"><div class="form-item"><label>下单时留的手机号</label>'
    + '<input id="qphone" type="tel" placeholder="手机号"><button class="submit" id="q" style="margin-top:10px">查询</button></div></div>'
    + '<div id="list"></div>';
  document.getElementById('bk').onclick = function(){ history.back(); };
  document.getElementById('q').onclick = function(){
    var p = document.getElementById('qphone').value.trim();
    if (!p) return toast('请输入手机号');
    getJSON(API+'/'+slug+'/orders?phone='+encodeURIComponent(p), function(list){
      var html = (list||[]).map(function(o){
        return '<div class="order-card"><span class="no">'+esc(o.orderNo)+'</span>'
          + '<span class="st status-'+esc(o.status)+'">'+(ST[o.status]||o.status)+'</span>'
          + '<div class="amt">'+money(o.totalAmount)+' <span style="color:#999;font-weight:400;font-size:12px">共'+o.itemCount+'件</span></div></div>';
      }).join('');
      document.getElementById('list').innerHTML = html || '<div class="empty">该手机号暂无订单</div>';
    });
  };
}

/* ── 路由 ── */
function route(){
  var h = location.hash || '#/';
  var m;
  if (!slug) {
    document.getElementById('app').innerHTML = '<div class="empty">店铺链接不正确（缺少店铺标识 s）</div>';
    return;
  }
  if ((m = h.match(/^#\/p\/(\d+)$/))) renderDetail(m[1]);
  else if (h === '#/cart') renderCart();
  else if (h === '#/checkout') renderCheckout();
  else if (h === '#/mine') renderMine();
  else renderHome();
}
window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
