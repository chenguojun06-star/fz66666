      on('dk', back);
      on('tocart', function () { go('#/cart'); });

      // 轮播交互：左右按钮 + 指示点 + 拖动（触摸/鼠标）+ 轻点放大 + 自动播放
      //
      // ⚠️ 三个已修掉的真实故障，改动此段前务必看懂：
      //  1) 总数一律以**渲染出来的 cell 数**为准。此前这里按「主图 + 各颜色图」重算了一份
      //     列表，而画廊渲染用的是商家排好的 d.gallery —— 两份不是同一个东西，
      //     数量对不上（常见 5 张 vs 1 张）→ galTotal 算成 1 → 箭头/指示点/滑动全不绑定。
      //  2) 事件必须挂在 .d-carousel（而不是 .track）上：左右箭头、返回键都是 .track 的
      //     **兄弟节点**，手指落在它们上面时事件不会冒泡到 .track ——
      //     实测从图片右缘（箭头处）起手的滑动会被整条吞掉。
      //  3) 箭头 onclick 曾被自动播放的 startAuto **覆盖**（on() 用 el.onclick，只能挂一个）
      //     → 点箭头只重新计时、不换图，桌面上等于完全没法切图。
      var carouselEl = document.querySelector('.d-carousel');
      var ctrack = document.getElementById('ctrack');
      var galTotal = ctrack ? ctrack.children.length : 0;
      var galIdx = 0;
      // 拖动过就不再算「轻点」，避免滑完一张顺手把放大层也打开
      var suppressTap = false;
      // 自动播放重计时；未开启自动播放时是空操作（箭头/指示点/拖动后统一调它）
      var restartAuto = function () {};

      if (galTotal > 1) {
        on('cprev', function () { galIdx = galleryGo((galIdx - 1 + galTotal) % galTotal, galTotal); restartAuto(); });
        on('cnext', function () { galIdx = galleryGo((galIdx + 1) % galTotal, galTotal); restartAuto(); });
        var cdots = document.getElementById('cdots');
        if (cdots) {
          Array.prototype.forEach.call(cdots.children, function (dot, di) {
            dot.style.pointerEvents = 'auto';
            dot.onclick = function () { galIdx = galleryGo(di, galTotal); restartAuto(); };
          });
        }
        // 拖动切图：触摸与鼠标共用一套逻辑（电脑上打开分享链接也能左右拖）
        var dragEl = carouselEl || ctrack;
        if (dragEl) {
          var sx = 0, sy = 0, moved = false;
          var dragStart = function (x, y) { sx = x; sy = y; moved = false; };
          var dragMove = function (x, y) {
            if (Math.abs(x - sx) > 12 || Math.abs(y - sy) > 12) { moved = true; suppressTap = true; }
          };
          var dragEnd = function (x, y) {
            if (!moved) { suppressTap = false; return; }
            suppressTap = true;
            setTimeout(function () { suppressTap = false; }, 350);
            var dx = x - sx, dy = y - sy;
            if (Math.abs(dx) < 40 || Math.abs(dx) < Math.abs(dy)) return;
            galIdx = galleryGo((galIdx + (dx < 0 ? 1 : galTotal - 1)) % galTotal, galTotal);
          };
          dragEl.addEventListener('touchstart', function (e) { dragStart(e.touches[0].clientX, e.touches[0].clientY); }, { passive: true });
          dragEl.addEventListener('touchmove', function (e) { dragMove(e.touches[0].clientX, e.touches[0].clientY); }, { passive: true });
          dragEl.addEventListener('touchend', function (e) { dragEnd(e.changedTouches[0].clientX, e.changedTouches[0].clientY); }, { passive: true });
          dragEl.addEventListener('mousedown', function (e) {
            // 不 preventDefault 的话，浏览器会开始「拖动图片」原生手势，
            // 之后的 mousemove 全部收不到 → 电脑上拖不动图
            if (e.preventDefault) e.preventDefault();
            dragStart(e.clientX, e.clientY);
          });
          dragEl.addEventListener('mousemove', function (e) { if (e.buttons) dragMove(e.clientX, e.clientY); });
          dragEl.addEventListener('mouseup', function (e) { dragEnd(e.clientX, e.clientY); });
        }

        // 自动播放：店铺级开关 + 间隔（详情接口已下发，默认开 / 4 秒）
        if (d.carouselAutoplay !== false) {
          var gap = Number(d.carouselIntervalMs) || 4000;
          if (gap < 2000 || gap > 10000) gap = 4000;
          var autoTimer = null;
          var stopAuto = function () { if (autoTimer) { clearInterval(autoTimer); autoTimer = null; } };
          var startAuto = function () {
            stopAuto();
            autoTimer = setInterval(function () {
              if (document.hidden) return;                                   // 后台标签页不空转
              if (!document.getElementById('ctrack')) { stopAuto(); return; }  // 已离开详情页
              galIdx = galleryGo((galIdx + 1) % galTotal, galTotal);
            }, gap);
          };
          startAuto();
          restartAuto = startAuto;
          // 顾客一上手就停、松手再继续 —— 避免「手指刚碰到图就自己翻走」
          if (dragEl) {
            ['touchstart', 'mousedown'].forEach(function (ev) {
              dragEl.addEventListener(ev, stopAuto, { passive: true });
            });
            ['touchend', 'mouseup', 'touchcancel'].forEach(function (ev) {
              dragEl.addEventListener(ev, startAuto, { passive: true });
            });
          }
          // 手动点过按钮/指示点后重新计时，别刚点完又被自动翻走
          if (cdots) cdots.addEventListener('click', restartAuto);
        }
      }

      // 轻点主图放大：滑动切图不算轻点，箭头/返回/指示点各自的点击也不触发
      if (carouselEl) {
        carouselEl.addEventListener('click', function (e) {
          if (suppressTap) return;
          var t = e.target;
          if (t && t.closest && t.closest('.navbtn, .d-back, .carousel-dots, .carousel-idx')) return;
          openImageViewer(galImgs, galIdx);
        });
      }

      function refreshSizes() {
        var box = document.getElementById('sizes');
        if (!box) return;
        var list = byColor[sel.color] || [];
        if (!list.length) {
          box.innerHTML = '<span style="font-size:12.5px;color:#bbb">'
            + (sel.color ? '该颜色暂无尺码' : '请先选择颜色') + '</span>';
          return;
        }
        box.innerHTML = list.map(function (k) {
          var dis = (k.stock || 0) <= 0;
          return '<button class="opt' + (dis ? ' dis' : '') + '" data-s="' + esc(k.size) + '"'
            + ' data-id="' + k.skuId + '" data-stock="' + (k.stock || 0) + '"'
            + ' data-price="' + (k.price == null ? '' : k.price) + '">'
            + esc(k.size) + '<span class="st">' + (dis ? '售罄' : k.stock) + '</span></button>';
        }).join('');
        Array.prototype.forEach.call(document.querySelectorAll('#sizes .opt'), function (el) {
          el.onclick = function () {
            if (el.classList.contains('dis')) return;
            Array.prototype.forEach.call(document.querySelectorAll('#sizes .opt'), function (x) { x.classList.remove('sel'); });
            el.classList.add('sel');
            sel.size = el.getAttribute('data-s');
            sel.skuId = el.getAttribute('data-id');
            sel.stock = Number(el.getAttribute('data-stock')) || 0;
            // 购物车用所选 SKU 的价格，而不是全局最低价
            sel.price = Number(el.getAttribute('data-price')) || Number(minPrice || 0);
            sel.qty = 1;
            var qv = document.getElementById('qv');
            if (qv) qv.textContent = '1';
          };
        });
      }
      onAll('#colors .opt', function (el) {
        el.onclick = function () {
          Array.prototype.forEach.call(document.querySelectorAll('#colors .opt'), function (x) { x.classList.remove('sel'); });
          el.classList.add('sel');
          sel.color = el.getAttribute('data-c'); sel.size = null; sel.skuId = null;
          var hint = document.getElementById('hint');
          if (hint) hint.textContent = '已选 ' + sel.color;
          // D-768/D-777：切到该颜色的图。若该颜色有专属图，插到轮播首位。
          // ⚠️ 整段必须容错：这里一旦抛错，后面的 refreshSizes() 就不会执行，
          //    症状就是「颜色点得动、尺码永远不出来」——线上那个 bug 正是如此
          //    （galImgs 未声明 → ReferenceError）。换图失败也绝不能牵连选尺码。
          try {
            var own = heroUrlFor(sel.color);
            if (own && galTotal > 1 && galImgs.indexOf(own) > 0) {
              var at = galImgs.indexOf(own);
              galImgs.splice(at, 1);
              galImgs.unshift(own);
              var track2 = document.getElementById('ctrack');
              if (track2) {
                track2.innerHTML = galImgs.map(function (u) {
                  return '<div class="cell">' + thumbHtml(u) + '</div>';
                }).join('');
              }
              var dots2 = document.getElementById('cdots');
              if (dots2) {
                dots2.innerHTML = galImgs.map(function (_, i3) {
                  return '<i class="' + (i3 === 0 ? 'on' : '') + '"></i>';
                }).join('');
                Array.prototype.forEach.call(dots2.children, function (dot, di) {
                  dot.style.pointerEvents = 'auto';
                  dot.onclick = function () { galIdx = galleryGo(di, galImgs.length); };
                });
              }
              galTotal = galImgs.length;
              galIdx = galleryGo(0, galTotal);
            }
          } catch (err) {
            // 换图是锦上添花，失败不影响选色/选码/加购
          }
          refreshSizes();
          restartAuto();
        }
      });
      on('qm', function () {
        if (sel.qty > 1) { sel.qty--; var q1 = document.getElementById('qv'); if (q1) q1.textContent = sel.qty; }
      });
      on('qp', function () {
        if (sel.skuId && sel.qty >= sel.stock) return toast('库存仅剩 ' + sel.stock + ' 件');
        sel.qty++; var q2 = document.getElementById('qv'); if (q2) q2.textContent = sel.qty;
      });
      function requireSku() {
        if (!sel.skuId) { toast(sel.color ? '请选择尺码' : '请选择颜色'); return false; }
        return true;
      }
      on('addcart', function () {
        if (!requireSku()) return;
        var name = d.styleName + ' ' + sel.color + '/' + sel.size;
        var c = cart().filter(function (x) { return String(x.skuId) !== String(sel.skuId); });
        var exist = cart().filter(function (x) { return String(x.skuId) === String(sel.skuId); })[0];
        c.push({
          skuId: sel.skuId, qty: sel.qty, name: name,
          price: sel.price || Number(minPrice || 0), cover: heroUrlFor(sel.color),
          color: sel.color, size: sel.size, stock: sel.stock,
          checked: exist ? exist.checked !== false : true
        });
        saveCart(c); toast('已加入购物车'); paintBadges();
      });
      on('buynow', function () {
        if (closed) return toast('店铺打烊中，暂时无法下单');
        if (!requireSku()) return;
        saveCart([{
          skuId: sel.skuId, qty: sel.qty, name: d.styleName + ' ' + sel.color + '/' + sel.size,
          price: sel.price || Number(minPrice || 0), cover: heroUrlFor(sel.color), color: sel.color, size: sel.size,
          stock: sel.stock, checked: true
        }]);
        go('#/checkout');
      });
      // D-783：评价异步加载（需判断登录态与是否买过）
      window.__currentStyleNo = d.styleNo;
      loadReviews(styleId, d.styleNo);
      loadRecommends(styleId);
      // 浏览由**服务端**在详情接口里记（GET /{slug}/products/{styleId}）：
      // 只有真正渲染成功的详情才算一次浏览，且不依赖前端配合、匿名也计数。
      // 前端**不要**再上报一次 —— 同一次浏览记两遍，热度与看板都会翻倍。

      function paintBadges() {
        var b = document.querySelector('.d-bar .mini .badge');
        var n = cartCount();
        if (b) { if (n) b.textContent = n; else b.remove(); }
      }
    });
    });

  /* ── 购物车 ── */
  function renderCart() {
    var c = cart();
    var html = '<div class="pagehead"><button class="bk" id="bk">&#8249;</button><h1>购物车</h1></div>';
    if (!c.length) {
      html += '<div class="empty"><div class="big">&#128722;</div>购物车还是空的<div style="margin-top:18px"><button class="obtn" style="width:200px" onclick="location.hash=\'#/\'">去逛逛</button></div></div>';
      app.innerHTML = html + tabbar('cart');
      on('bk',  back);
      bindTabs();
      return;
    }
    html += '<div class="cq">';
    c.forEach(function (x, i) {
      html += '<div class="citem">'
        + '<input type="checkbox" class="chk" data-i="' + i + '"' + (x.checked !== false ? ' checked' : '') + '>'
        + '<div class="ph">' + thumbHtml(x.cover) + '</div>'
        + '<div class="info"><div class="nm">' + esc(x.name) + '</div>'
        + '<div class="pr"><span class="cny">¥</span>' + Number(x.price).toFixed(2) + '</div></div>'
        + '<div class="side"><button class="rm" data-i="' + i + '">删除</button>'
        + '<span class="stepper sm"><button data-m="' + i + '">&#8722;</button><span>' + x.qty + '</span><button data-p="' + i + '">&#65291;</button></span>'
        + '</div></div>';
    });
    html += '</div>';

    var allChecked = c.every(function (x) { return x.checked !== false; });
    var picked = c.filter(function (x) { return x.checked !== false; });
    var amount = picked.reduce(function (s, x) { return s + x.price * x.qty; }, 0);
    var qty = picked.reduce(function (s, x) { return s + x.qty; }, 0);
    var fee = shipFeeFor(amount);

    html += '<div class="cbar">'
      + '<label class="all"><input type="checkbox" id="all"' + (allChecked ? ' checked' : '') + '>全选</label>'
      + '<div class="sum">合计 <b><span class="cny">¥</span>' + (amount + fee).toFixed(2) + '</b>'
      + '<div style="font-size:11px;color:#aaa">' + (fee > 0 ? '含运费 ¥' + money(fee) : esc(shipLineText(amount))) + '</div></div>'
      + '<button class="go" id="checkout"' + (picked.length ? '' : ' disabled') + '>结算(' + qty + ')</button>'
      + '</div>';

    app.innerHTML = html + tabbar('cart');
    on('bk',  back);

    Array.prototype.forEach.call(document.querySelectorAll('.chk'), function (el) {
      el.onchange = function () {
        var cc = cart(); cc[Number(el.getAttribute('data-i'))].checked = el.checked;
        saveCart(cc); renderCart();
      };
    });
    document.getElementById('all').onchange = function (e) {
      var cc = cart(); cc.forEach(function (x) { x.checked = e.target.checked; }); saveCart(cc); renderCart();
    };
    Array.prototype.forEach.call(document.querySelectorAll('.rm'), function (el) {
      el.onclick = function () {
        var cc = cart(); cc.splice(Number(el.getAttribute('data-i')), 1); saveCart(cc); renderCart();
      };
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-m]'), function (el) {
      el.onclick = function () {
        var i = Number(el.getAttribute('data-m')); var cc = cart();
        if (cc[i].qty > 1) { cc[i].qty--; saveCart(cc); renderCart(); }
      };
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-p]'), function (el) {
      el.onclick = function () {
        var i = Number(el.getAttribute('data-p')); var cc = cart();
        if (cc[i].stock && cc[i].qty >= cc[i].stock) return toast('库存仅剩 ' + cc[i].stock + ' 件');
        cc[i].qty++; saveCart(cc); renderCart();
      };
    });
    var co = document.getElementById('checkout');
    if (co) co.onclick = function () { go('#/checkout'); };
    bindTabs();
  }

  /* ── 下单 ── */
  function renderCheckout() {
    var c = cart().filter(function (x) { return x.checked !== false; });
    if (!c.length) { app.innerHTML = '<div class="empty">没有待结算的商品</div>'; return; }
    var amount = c.reduce(function (s, x) { return s + x.price * x.qty; }, 0);

    var html = '<div class="pagehead"><button class="bk" id="bk">&#8249;</button><h1>确认订单</h1></div>';
    html += '<div class="olist">';
    c.forEach(function (x) {
      html += '<div class="citem"><div class="ph">' + thumbHtml(x.cover) + '</div>'
        + '<div class="info"><div class="nm">' + esc(x.name) + '</div>'
        + '<div class="pr"><span class="cny">¥</span>' + Number(x.price).toFixed(2) + ' <span style="color:#aaa;font-weight:400;font-size:12px">× ' + x.qty + '</span></div></div></div>';
    });
    html += '</div>';

    html += '<div class="card">'
      + '<div class="fi"><label>收货人 <b>*</b></label><input id="f_name" placeholder="请输入姓名"></div>'
      + '<div class="fi"><label>手机号 <b>*</b></label><input id="f_phone" type="tel" inputmode="numeric" placeholder="用于订单查询与发货联系"></div>'
      + '<div class="fi"><label>收货地址 <b>*</b></label><textarea id="f_addr" placeholder="省 / 市 / 区 + 详细地址"></textarea></div>'
      + '<div class="fi" style="margin-bottom:0"><label>买家留言</label><textarea id="f_remark" placeholder="选填，如颜色偏好、发货时间要求"></textarea></div>'
      + '</div>';

    var fee = shipFeeFor(amount);
    var total = amount + fee;
    var note = (shopInfo && shopInfo.shippingNote) || '';

    html += '<div class="card">'
      + '<div style="display:flex;justify-content:space-between;font-size:13px;color:#666;line-height:2">'
      + '<span>商品金额（' + c.reduce(function (s, x) { return s + x.qty; }, 0) + ' 件）</span>'
      + '<span>¥' + amount.toFixed(2) + '</span></div>'
      + '<div style="display:flex;justify-content:space-between;font-size:13px;color:#666;line-height:2">'
      + '<span>运费</span><span>' + esc(shipLineText(amount)) + '</span></div>'
      + '<div style="display:flex;justify-content:space-between;align-items:baseline;border-top:1px dashed #eee;margin-top:6px;padding-top:8px">'
      + '<span style="font-size:13px;color:#666">应付</span>'
      + '<span class="money" style="color:var(--tb-red);font-weight:700;font-size:20px"><span style="font-size:12px">¥</span>' + total.toFixed(2) + '</span></div>'
      + '</div>';

    if (note) {
      html += '<div class="card" style="font-size:12px;color:#8a6d3b;background:#fffbe6;line-height:1.7">'
        + '配送说明：' + esc(note) + '</div>';
    }

    html += '<div style="padding:0 10px 24px"><button class="obtn" id="submit">提交订单</button>'
      + '<div style="font-size:11.5px;color:#aaa;text-align:center;margin-top:10px;line-height:1.6">提交后客服将联系您确认发货与付款方式</div></div>';

    app.innerHTML = html;
    on('bk',  back);
    on('submit',  function () {
      var body = {
        customerName: document.getElementById('f_name').value.trim(),
        phone: document.getElementById('f_phone').value.trim(),
        address: document.getElementById('f_addr').value.trim(),
        remark: document.getElementById('f_remark').value.trim(),
        items: c.map(function (x) { return { skuId: x.skuId, quantity: x.qty }; })
      };
      if (!body.customerName) return toast('请填写收货人');
      if (!/^1\d{10}$/.test(body.phone)) return toast('请填写正确的手机号');
      if (!body.address) return toast('请填写收货地址');
      var btn = document.getElementById('submit');
      btn.disabled = true; btn.textContent = '提交中…';
post(API + '/' + slug + '/orders', body, function (d) {
        saveCart(cart().filter(function (x) { x.checked === false; }));
        renderDone(d);
      });
    });
  }

  function renderDone(d) {
    var goods = Number(d.goodsAmount != null ? d.goodsAmount : d.totalAmount || 0);
    var fee = Number(d.shippingFee || 0);
    var total = Number(d.totalAmount || (goods + fee));
    var feeRow = fee > 0
      ? '<br>含运费 ¥' + fee.toFixed(2) + '（商品 ¥' + goods.toFixed(2) + '）'
      : '<br>运费：包邮';
    app.innerHTML = '<div class="pagehead"><h1>下单成功</h1></div>'
      + '<div class="done"><div class="ok">&#10003;</div>'
      + '<h2>下单成功</h2>'
      + '<p>订单号 <b>' + esc(d.orderNo) + '</b><br>'
      + '应付 <span style="color:var(--tb-red);font-weight:700">¥' + total.toFixed(2) + '</span>'
      + feeRow + '<br>'
      + '客服会尽快联系您确认发货与付款</p>'
      + '<div style="margin-top:26px;display:flex;flex-direction:column;gap:10px">'
      + '<button class="obtn" id="mymine">查看我的订单</button>'
      + '<button class="obtn ghost" id="cont">继续逛逛</button></div></div>';
    on('mymine', function () { go('#/mine'); });
    on('cont', function () { go('#/'); });
  }

  /* ── 我的订单 ── */
  function renderMine() {
    var phone = localStorage.getItem('shop_phone_' + slug) || '';
    var html = '<div class="pagehead"><button class="bk" id="bk">&#8249;</button><h1>我的订单</h1></div>';
    html += '<div class="card"><div class="fi" style="margin-bottom:10px"><label>下单时填写的手机号</label>'
      + '<input id="qphone" type="tel" inputmode="numeric" placeholder="请输入手机号查询订单" value="' + esc(phone) + '"></div>'
      + '<button class="obtn" id="q">查询订单</button></div>'
      + '<div class="olist" id="list"></div>';
    app.innerHTML = html + tabbar('mine');
    on('bk',  back);
    bindTabs();
    on('q',  doQuery);
    function doQuery() {
      var p = document.getElementById('qphone').value.trim();
      if (!/^1\d{10}$/.test(p)) return toast('请输入正确的手机号');
      localStorage.setItem('shop_phone_' + slug, p);
      get(API + '/' + slug + '/orders?phone=' + encodeURIComponent(p), function (list) {
        list = list || [];
        if (!list.length) { document.getElementById('list').innerHTML = '<div class="empty"><div class="big">&#128230;</div>该手机号暂无订单</div>'; return; }
        document.getElementById('list').innerHTML = list.map(function (o) {
          return '<div class="ocard"><div class="top">'
            + '<span class="no">' + esc(o.orderNo) + '</span>'
            + '<span class="st st-' + esc(o.status) + '">' + (ST[o.status] || o.status) + '</span></div>'
            + '<div class="mid">' + esc((o.createTime || '').replace('T', ' ').slice(0, 16)) + '</div>'
            + '<div class="amt"><span style="font-size:12px;color:#999">共 ' + (o.itemCount || 0) + ' 件'
            + (Number(o.shippingFee || 0) > 0 ? ' · 含运费 ¥' + Number(o.shippingFee).toFixed(2) : ' · 包邮')
            + '</span>'
            + '<span class="money"><span class="cny">¥</span>' + Number(o.totalAmount).toFixed(2) + '</span></div></div>';
        }).join('');
      });
    }
    if (phone) doQuery();
  }

  /* ── 路由 ── */
  function route() {
    if (!slug) {
      app.innerHTML = '<div class="empty"><div class="big">&#128279;</div>店铺链接不正确<br><span style="font-size:12px">缺少店铺标识参数 s</span></div>';
      return;
    }
    var h = location.hash || '#/', m;
    window.scrollTo(0, 0);
    if ((m = h.match(/^#\/p\/(\d+)$/))) renderDetail(m[1]);
    else if (h === '#/cart') renderCart();
    else if (h === '#/checkout') renderCheckout();
    else if (h === '#/mine') renderMine();
    else renderHome();
  }
  window.addEventListener('hashchange', route);
  route();
})();
</script>
</body>
</html>
