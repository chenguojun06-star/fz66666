#   解法：把「纯写」提成私有 doCancel / doMarkApproved（由外层公开方法的事务覆盖），
#   新旧方法共用同一段写逻辑，零重复且事务语义不变。
#   ⚠️ /batch-approve 的循环刻意留在 Controller —— 它逐条调用编排层的 approveOne，
#   属跨 Bean 调用才能保证 approveOne 的 @Transactional 生效；搬进编排层就变自调用 → 事务失效。
#   ⚠️ exportToExcelBytes 声明 throws IOException，由 Controller 的 throws 透传给 Spring MVC
#   （与下沉前 Controller 直接声明 throws 行为一致）。
#   至此 Controller→多Service 规则：35 → 0（D-632…D-652，共 35 个 Controller）。
controller.depends.on.multiple.services=0

