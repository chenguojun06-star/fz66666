# 架构违规冻结基线（ratchet 策略）
#
# 用法：违规数只许减少、不许增加。
#   - 新增违规 → ArchitectureRulesTest 失败，必须修复
#   - 清理了存量 → 测试会在控制台提示"已收敛：X → Y，请把基线更新为 Y"，
#     此时把下面的数字改成 Y 即可（数字只能往下调）
#
# ⚠️ 本文件必须提交进 git，否则 CI 上读不到基线，会退化成"只记录不阻断"。
#
# 生成时间：2026-09-15（首次，ArchUnit 字节码实测，非 grep 估算）

# Controller 直接依赖 Mapper —— 绕过业务层会丢失事务与业务校验
# 现状 40 个，属存量。新代码禁止，存量逐步清理后调低此值。
# 2026-09-29 D-635：McpSseController 的 ObjectMapper、MaterialPickingController 的
#   MaterialPickingItemMapper 随业务逻辑下沉到编排层（47 → 40）。
#   ⚠️ 规则用 haveSimpleNameEndingWith("Mapper") 判断，会把 Jackson 的 ObjectMapper
#   也算进来（假阳性）。若日后要收紧，改成「包名含 .mapper.」即可（只会让数字更小）。
controller.depends.on.mapper=40

# System.out.println / printStackTrace —— 已清零，保持 0
no.stdout.no.printstacktrace=0

# 裸 new Thread() —— 已清零，保持 0（异步请走 @Async / 线程池）
no.raw.thread=0

# Service/Orchestrator 反向依赖 Controller —— 已清零，保持 0
no.reverse.dep.on.controller=0

# Controller 直接依赖多个 Service —— 跨服务编排应交给 Orchestrator
# D-630 新增规则。此前 CLAUDE.md 已写明「Controllers must NOT call multiple services」，
# 但 ArchUnit 里没有对应规则，属「有规范、无门禁」，存量违规会持续增长而无人察觉。
# 存量值为首次字节码实测，只许减少不许增加。
# 2026-09-29 D-632/633：CrmClientController、SupplierPortalController 各 7 个 Service
#   已全部下沉到对应 Orchestrator（35 → 33）。
# 2026-09-29 D-634：IntelligenceQuality / ApsScheduling / RoleTemplate / PlatformWebhook
#   四个 Controller 下沉（33 → 29）。
# 2026-09-29 D-635：ExpenseReimbursement / A2a / IntelligencePrediction / McpSse /
#   SupplierUser / MaterialPicking 六个 Controller 下沉（29 → 23）。
# 2026-09-29 D-636：MenuBadgeCount / HermesCapability / FactoryShipment 三个 Controller
#   下沉（23 → 20）。注意本条规则按「类」计数（一个 Controller 只产生 1 条违规），
#   与规则1（按访问点计数）不同 —— 修 N 个 Controller 就是 -N。
# 2026-09-29 D-637：EcSync / SystemStatus / InternalMaintenance 三个 Controller 下沉（20 → 17）。
# 2026-09-29 D-639：ProductSku / PayrollSettlement 两个 Controller 下沉（17 → 15）。
# 2026-09-29 D-640：EcStock / MaterialPurchase 两个 Controller 下沉（15 → 13）。
# 2026-09-29 D-641：AppStore / OrderRemark 两个 Controller 下沉（13 → 11）。
controller.depends.on.multiple.services=11

# Service 依赖其他 Service —— 跨服务编排应上移到 Orchestrator
# D-630 新增规则。豁免 .common. 包下的基础设施 Service（DistributedLockService、
# RedisService 等横切关注点，不参与业务编排）。
service.depends.on.service=56
