# 依赖 EOL 冻结基线（ratchet 策略）
#
# 与 backend/arch-baseline.properties 同款思路：
#   - 新增 EOL 依赖 → 脚本报错阻断 CI
#   - 已修复 EOL      → 脚本提示收敛，请把下面的值往下调
#
# ⚠️ 为什么需要基线（而非直接阻断）：
#   Spring Boot 3.4.5 与 Spring AI 1.0.0 在本基线建立时**已 EOL**。
#   若直接阻断，CI 从上线第一天就常红 → 必然出现「加 --strict 绕过」或
#   「临时关掉 job」，结果比假绿灯更糟（arch-baseline.properties 的注释
#   记录了同样的教训）。
#   故：存量 EOL 只告警，**新增**才阻断；修复一项就调低一格。
#
# 格式：<组件标识>=<当前允许的 EOL 组件数量>
#   组件标识见 scripts/check-dependency-eol.py 的 EOL_BASELINE 键名。
#
# 变更记录：
#   2026-10-01  建立基线 = 2（Spring Boot 3.4.5 已 EOL + Spring AI 1.0.0 已 EOL）
#   2026-10-01  收敛为 1：D-698 完成 Spring Boot 3.4.5 → 4.1.1 升级并上线，
#                       Spring Boot 3.x 不再是当前版本，EOL 计数减 1。
#   2026-10-04  收敛为 0：D-743 完成 Spring AI 1.0.0 → 2.0.0 GA 迁移并切回默认主路径。
#                       spring-ai 2.0 属官方 supported 系列（Boot 4 配套），
#                       不再是 EOL 组件，EOL 计数归零。
dependency.eol.baseline=0
