name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# 2026-09-17：生产环境已迁移至轻量服务器（deploy/lighthouse/）
# 服务器 autodeploy 机器人每 2 分钟自动拉取 main 并重建变动服务；
# 原「部署到微信云托管/冒烟测试」job 已移除（详见 git 历史与 deploy/lighthouse/README.md）
jobs:
  quality-gate:
    name: 质量门禁（Entity-Flyway + SQL校验 + 安全扫描）
    runs-on: ubuntu-latest

    steps:
    - name: 检出代码（含上一次提交，diff 对比用）
      uses: actions/checkout@v6
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 2

    - name: 检查新增 @TableField 是否有 Flyway 迁移脚本
      run: python3 scripts/check-entity-flyway.py

    - name: 校验 Flyway 迁移脚本
      run: python3 scripts/check-flyway-sql.py --diff

    - name: 校验新增迁移的列依赖（拦截引用不存在列的事故）
      run: python3 scripts/check-flyway-column-deps.py

    - name: 检查小程序 eventBus 订阅（防止操作后不刷新）
      run: node scripts/check-eventbus-subscription.js

    - name: 多租户隔离审计（P0铁律：Entity/Mapper 必须带 tenant_id）
      run: |
        echo "🔍 开始多租户隔离审计..."
        python3 scripts/audit-tenant-id.py
        echo "✅ 多租户隔离审计通过"

    - name: 前端硬编码颜色审计（不阻断，仅生成报告）
      continue-on-error: true
      run: |
        echo "🎨 开始前端硬编码颜色审计..."
        python3 scripts/audit-frontend-colors.py || true
        echo "ℹ️  颜色审计报告已生成（历史遗留硬编码不会阻断 CI，新增硬编码请及时清理）"

    - name: 生产配置安全扫描
      run: |
        echo "🔍 开始生产配置安全扫描..."
        ERRORS=0

        # 1. 检查生产CORS是否包含localhost或http
        if grep -q "localhost" backend/src/main/resources/application-prod.yml 2>/dev/null; then
          echo "❌ 生产CORS配置包含localhost"
          ERRORS=$((ERRORS + 1))
        fi
        if grep -q "http://" backend/src/main/resources/application-prod.yml 2>/dev/null | grep -v "#"; then
          echo "⚠️  生产CORS配置包含HTTP协议源"
          ERRORS=$((ERRORS + 1))
        fi

        # 2. 检查生产配置是否使用弱JWT密钥
        if grep -q "ThisIsA_LocalJwtSecret" backend/src/main/resources/application-prod.yml 2>/dev/null; then
          echo "❌ 生产环境使用开发JWT密钥"
          ERRORS=$((ERRORS + 1))
        fi

        # 3. 检查生产配置是否使用弱数据库密码
        if grep -q "changeme" backend/src/main/resources/application-prod.yml 2>/dev/null; then
          echo "❌ 生产环境使用弱数据库密码"
          ERRORS=$((ERRORS + 1))
        fi

        # 4. 检查生产环境是否开启微信Mock
        if grep -q "mock-enabled: true" backend/src/main/resources/application-prod.yml 2>/dev/null; then
          echo "❌ 生产环境开启了微信Mock模式"
          ERRORS=$((ERRORS + 1))
        fi

        # 5. 检查前端是否有localhost硬编码（排除配置文件和构建脚本）
        FOUND_LOCALHOST=$(grep -rn "localhost:5173\|localhost:8080\|localhost:8088" \
          frontend/src/ --include="*.ts" --include="*.tsx" 2>/dev/null | grep -v "vite.config\|.env\|node_modules" || true)
        if [ -n "$FOUND_LOCALHOST" ]; then
          echo "⚠️  前端源码中发现localhost硬编码:"
          echo "$FOUND_LOCALHOST"
          ERRORS=$((ERRORS + 1))
        fi

        # 6. 检查回调URL占位符
        if grep -q "你的域名" backend/src/main/resources/application-prod.yml 2>/dev/null; then
          echo "⚠️  生产配置中存在'你的域名'占位符"
        fi

        # 7. 检查启动探针宽限期（P0：INC-20260612-001 —— 探针秒判导致容器反复重启）
        #
        # 2026-09-24 修正：本项原来查的是 `cloudbaserc.json` 的 initialDelaySeconds，
        # 那是**微信云托管时代**的配置。生产环境 2026-09-17 已迁到自建轻量服务器
        # （Docker Compose + Caddy），cloudbaserc.json 已成历史遗留文件，
        # 继续拿它当门禁有两个问题：① 守着不生效的配置 ② 一旦清理掉该文件 CI 就会红。
        # 真正的等价保护现在是 compose 里的 `start_period`（应用启动约 40~90s，需留足宽限），
        # 所以检查目标改为它 —— 保护不变，指向真正生效的地方。
        echo ""
        echo "🔍 检查后端启动探针宽限期（deploy/lighthouse/docker-compose.yml start_period）..."
        COMPOSE_FILE="deploy/lighthouse/docker-compose.yml"
        if [ ! -f "$COMPOSE_FILE" ]; then
          echo "⚠️  未找到 $COMPOSE_FILE，跳过该项（不阻断）"
        else
          START_PERIOD=$(grep -oE 'start_period:[[:space:]]*[0-9]+s' "$COMPOSE_FILE" | grep -oE '[0-9]+' | head -1)
          if [ -z "$START_PERIOD" ]; then
            echo "⚠️  compose 未显式设置 start_period（应用启动约 40~90s，建议 ≥200s，不阻断）"
          elif [ "$START_PERIOD" -lt 200 ]; then
            echo "❌ start_period=${START_PERIOD}s 太小（应用启动需 90s+，建议 ≥300s，防容器被误判不健康而反复重启）"
            ERRORS=$((ERRORS + 1))
          else
            echo "✅ start_period=${START_PERIOD}s"
          fi
        fi

        # 8. 检查前端是否有生产环境不应有的console.log
        BARE_CONSOLE=$(grep -rn "console\.log" frontend/src/ --include="*.ts" --include="*.tsx" 2>/dev/null \
          | grep -v "isDev\|import.meta.env.DEV\|logger\|errorHandling\|wrap(\|//.*console\|console\.log(res\|console\.log(stats\|console\.log(config" || true)
        if [ -n "$BARE_CONSOLE" ]; then
          CONSOLE_COUNT=$(echo "$BARE_CONSOLE" | wc -l)
          echo "⚠️  前端源码中发现 ${CONSOLE_COUNT} 处未守卫的console.log（生产构建会自动移除，建议清理）"
        fi

        if [ $ERRORS -gt 0 ]; then
          echo ""
          echo "❌ 安全扫描发现 ${ERRORS} 个问题，请修复后重新提交"
          exit 1
        fi

        echo "✅ 安全扫描通过"

  backend-test:
    name: 后端测试
    runs-on: ubuntu-latest
    needs: [quality-gate]

    steps:
    - name: 检出代码
      uses: actions/checkout@v6
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: 设置 JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    - name: 后端编译 + Checkstyle 代码规范检查
      working-directory: ./backend
      run: |
        mvn clean compile checkstyle:check -q

    - name: 运行后端单元测试 + Jacoco覆盖率报告
      working-directory: ./backend
      run: |
        mvn test jacoco:report \
          -Dspring.profiles.active=test \
          -DexcludedGroups=integration \
          -Dsurefire.failIfNoSpecifiedTests=false

    - name: 输出测试统计
      working-directory: ./backend
      run: |
        TEST_COUNT=$(find target/surefire-reports -name "*.xml" 2>/dev/null | wc -l)
        if [ "$TEST_COUNT" -gt 0 ]; then
          echo "✅ 共找到 ${TEST_COUNT} 个测试报告"
          grep -h "testcase" target/surefire-reports/*.xml 2>/dev/null | wc -l | xargs echo "✅ 测试用例总数:"
        else
          echo "⚠️  当前没有测试用例（surefire-reports 为空）"
        fi

    - name: JaCoCo 覆盖率报告（不阻断，仅输出当前覆盖率）
      working-directory: ./backend
      run: |
        echo "📊 JaCoCo 覆盖率报告"
        if [ -f target/site/jacoco/jacoco.csv ]; then
          echo "GROUP,INSTRUCTION_MISSED,INSTRUCTION_COVERED,BRANCH_MISSED,BRANCH_COVERED"
          head -1 target/site/jacoco/jacoco.csv
          TOTAL_MISS=$(awk -F',' 'NR>1 {miss+=$4} END {print miss}' target/site/jacoco/jacoco.csv)
          TOTAL_COVER=$(awk -F',' 'NR>1 {cover+=$5} END {print cover}' target/site/jacoco/jacoco.csv)
          if [ -n "$TOTAL_MISS" ] && [ -n "$TOTAL_COVER" ] && [ "$((TOTAL_MISS + TOTAL_COVER))" -gt 0 ]; then
            PCT=$(awk "BEGIN {printf \"%.1f\", ($TOTAL_COVER / ($TOTAL_MISS + $TOTAL_COVER)) * 100}")
            echo ""
            echo "📊 总指令覆盖率: ${PCT}%（覆盖 $TOTAL_COVER / 未覆盖 $TOTAL_MISS）"
            if (( $(echo "$PCT < 30" | bc -l) )); then
              echo "⚠️  覆盖率低于 30%，建议补充核心业务路径单元测试"
            else
              echo "✅ 覆盖率达标（≥30%）"
            fi
          fi
        else
          echo "⚠️  未找到 jacoco.csv，跳过覆盖率统计"
        fi

  frontend-lint:
    name: 前端代码规范检查 (ESLint + TypeScript)
    runs-on: ubuntu-latest
    needs: [quality-gate]

    steps:
    - name: 检出代码
      uses: actions/checkout@v6
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: 设置 Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'frontend/package-lock.json'

    - name: 安装依赖
      working-directory: ./frontend
      run: npm install --legacy-peer-deps

    - name: ESLint 代码规范检查
      working-directory: ./frontend
      run: npm run lint

    - name: TypeScript 类型检查
      working-directory: ./frontend
      run: npx tsc --noEmit

    # D-474：前端测试已入库（原被 .gitignore 排除，447 个测试 CI 完全没跑），
    # 这里作为门禁执行，防止断言悄悄过期（本次就发现 2 个过期断言）。
    - name: 前端单元测试（Vitest，门禁）
      working-directory: ./frontend
      run: npm test

    - name: UI 规范检查（字号/圆角/间距档位，不阻断，仅报告）
      continue-on-error: true
      run: |
        echo "📐 开始 UI 规范检查..."
        node frontend/scripts/check-ui-tokens.mjs 2>&1 | head -60 || true
        echo "ℹ️  UI 规范检查报告已生成（规范档位见 docs/前端UI工整度审查-2026-09-13.md）"

    - name: 内联样式基线检查（不阻断，仅报告）
      continue-on-error: true
      run: |
        echo "📏 开始内联样式检查..."
        node frontend/scripts/check-inline-style.mjs 2>&1 | head -20 || true
        echo "ℹ️  内联样式基线已锁定，新增 style={{}} 会被报告"

    - name: 死代码检测（ts-prune，不阻断，仅生成报告）
      continue-on-error: true
      working-directory: ./frontend
      run: |
        echo "🧹 开始死代码检测..."
        npx ts-prune 2>&1 | head -100 || true
        echo "ℹ️  死代码检测报告已生成（未使用的导出不会阻断 CI，请定期清理）"

    - name: 循环依赖检测（madge，不阻断，仅生成报告）
      continue-on-error: true
      working-directory: ./frontend
      run: |
        echo "🔄 开始循环依赖检测..."
        npx madge --circular --extensions ts,tsx src/ 2>&1 | head -50 || true
        echo "ℹ️  循环依赖检测报告已生成"

  frontend-build:
    name: 前端构建
    runs-on: ubuntu-latest
    needs: [quality-gate, frontend-lint]

    steps:
    - name: 检出代码
      uses: actions/checkout@v6
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: 设置 Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'frontend/package-lock.json'

    - name: 安装依赖
      working-directory: ./frontend
      run: npm install --legacy-peer-deps

    - name: 运行构建
      working-directory: ./frontend
      run: npm run build

    - name: 上传构建产物
      uses: actions/upload-artifact@v7
      with:
        name: frontend-dist
        path: frontend/dist
        retention-days: 7

  create-release-tag:
    name: 创建发布标签
    runs-on: ubuntu-latest
    # ★ 2026-08-20 加 postdeploy-smoke-test：
    # 冒烟失败的版本不允许打发布标签（旧逻辑部署成功就打标签，掩盖带病版本）
    needs: [backend-test, frontend-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write

    steps:
    - name: 检出代码
      uses: actions/checkout@v6
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0

    - name: 创建版本标签
      run: |
        CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
        if echo "$CHANGED_FILES" | grep -q "^\.github/workflows/"; then
          echo "跳过打标签: 本次提交包含 workflow 文件变更，GITHUB_TOKEN 无 workflows 权限"
          exit 0
        fi
        VERSION=$(grep -m1 '<version>' backend/pom.xml | sed 's/.*<version>\(.*\)<\/version>.*/\1/' | tr -d '[:space:]')
        TAG="v${VERSION}-$(date +%Y%m%d-%H%M%S)"
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git tag "$TAG"
        git push origin "$TAG"
        echo "已创建标签: $TAG"

  notify:
    name: 通知结果
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    if: always()

    steps:
    - name: 检查整体结果
      run: |
        BACKEND="${{ needs.backend-test.result }}"
        FRONTEND="${{ needs.frontend-build.result }}"

        echo "后端测试: $BACKEND"
        echo "前端构建: $FRONTEND"

        # ★ 2026-08-20 事故教训：CI 红了没人看 → 云端跑旧代码 → 用户当测试员
        # 任何环节失败都让整个 workflow 显示红叉，强迫推送者确认
        FAILED=0
        for R in "$BACKEND" "$FRONTEND"; do
          if [[ "$R" == "failure" || "$R" == "cancelled" ]]; then
            FAILED=1
          fi
        done

        if [[ "$FAILED" == "1" ]]; then
          echo ""
          echo "╔══════════════════════════════════════════════╗"
          echo "║  ❌ 流水线存在失败环节 — 云端可能不是最新代码  ║"
          echo "╠══════════════════════════════════════════════╣"
          echo "║  后端编译失败     → 生产不更新 → 旧代码       ║"
          echo "║  前端构建失败     → 生产不更新 → 旧代码       ║"
          echo "║  请到 Actions 页面查看失败详情并修复后重推     ║"
          echo "╚══════════════════════════════════════════════╝"
          exit 1
        fi
        echo "✅ 流水线全绿，云端已是最新版本"
