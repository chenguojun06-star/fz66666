name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# 2026-09-17：生产环境已迁移至轻量服务器（deploy/lighthouse/）
# 服务器 autodeploy 机器人每 2 分钟自动拉取 main 并重建变动服务；
# 原「部署到微信云托管/冒烟测试」job 已移除（详见 git 历史与 deploy/lighthouse/README.md）
jobs:
  quality-gate:
    name: 质量门禁（Entity-Flyway + SQL校验 + 安全扫描）
    runs-on: ubuntu-latest

    steps:
    - name: 检出代码（含上一次提交，diff 对比用）
      uses: actions/checkout@v6
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 2

    - name: 检查新增 @TableField 是否有 Flyway 迁移脚本
      run: python3 scripts/check-entity-flyway.py

    - name: 校验 Flyway 迁移脚本
      run: python3 scripts/check-flyway-sql.py --diff

    - name: 校验新增迁移的列依赖（拦截引用不存在列的事故）
      run: python3 scripts/check-flyway-column-deps.py

    # 本项目有两条"结构真相源"：Flyway 迁移 + DbColumnRepairRunner 的启动自愈清单
    # （DbTableDefinitions 74 张表 / DbColumnDefinitions 1138 条补列）。
    # 自愈器原先每次动手只打 log.warn，散落在启动日志里没人看，
    # 于是 Flyway 漂移被它悄悄盖住（2026-10-14 已把日志提到 ERROR 并汇总一行）。
    # 本步骤在构建期堵住"继续往自愈清单加条目"的口子。
    - name: 自愈清单新增条目必须有 Flyway 迁移
      run: python3 scripts/check-db-repair-vs-flyway.py

    # 2026-10-14 新增。此前线上接连踩同一个坑：原生 SQL 引用了生产库不存在的列，
    # 每次都是抛 Unknown column 后被 catch 成 debug/warn 吞掉，功能静默失效数月。
    # 实测已命中的：AuditLogCleanupJob.create_time（日志清理 6 个月没删过数据）、
    # PayrollSettlementMapper.settlement_time（工资打款必 500）、
    # AiSelfEvolutionService 共 7 个列（AI 自进化取不到样本）、
    # SelfDrillOrchestrator.t_tenant.delete_flag（自演练一个租户都不跑）、
    # PatrolEvidenceEnricher.order_no/progress_stage（AI 巡检无证据）。
    # 本步骤拿生产库真实列快照离线核对，不连库。
    # 8 处引用不存在列的原生 SQL 缺陷能藏半年，根因不是 SQL 写错，
    # 而是"抛异常被 catch 住、只打 log.debug"—— 生产日志级别下完全看不见。
    # 存量 32 处暂不动，但不允许再新增。
    - name: 禁止新增「catch 里只打 log.debug」的静默吞异常
      run: python3 scripts/check-silent-catch.py

    # 存量 177 处暂不动，但不允许再新增。
    # 收银台整页白屏就是从这来的：api.get 返回 {code,data} 信封，
    # service 把信封原样 return，调用方当数组塞给 antd Table。
    - name: 禁止新增 service 层信封泄漏
      run: python3 scripts/check-api-envelope-leak.py

    # D-851：存量 156 处（AI 能力库/预留接口/待判断），只允许减少不允许新增。
    # 「做了没接」是本项目最贵的病：巡检器空壳每日空跑、库存流水表完整但出库
    # 从不写、FreeInboundModal 挂载无按钮、helper 注入了却零调用——全部编译
    # 通过、单测通过，只在生产报障后才靠逆向排查发现。
    - name: 禁止新增「写了没接线」的方法（baseline 只减不增）
      run: python3 scripts/check-unwired.py --check

    # D-876：TDZ 高危前向引用守护。2026-10-20 顾客点「报价单打印」白屏，
    # 根因是 .map() 回调（同步执行）引用了同作用域更晚才声明的 const，
    # 抛 ReferenceError: Cannot access 'y' before initialization。
    # ESLint 现成的 no-use-before-define 会把 166 处安全形态全报出来，
    # 噪音淹没真问题；本脚本只报「同步执行位置上的前向引用」这一类。
    - name: TDZ 高危前向引用检查（同步位置引用后声明的 let/const）
      run: node scripts/check-tdz-sync.cjs

    - name: 原生 SQL 列名核对（拿生产库真实列快照比对）
      run: |
        echo "🔍 核对原生 SQL 里的列名是否真的存在于数据库..."
        python3 scripts/check-native-sql-columns.py
        echo "✅ 原生 SQL 列名核对通过"
        echo "提示：迁移上线后记得跑 scripts/check-native-sql-columns.py --refresh 更新列快照"

    - name: 检查小程序 eventBus 订阅（防止操作后不刷新）
      run: node scripts/check-eventbus-subscription.js

    - name: 顾客端店铺页交互守护（切图 / 放大 / 选色出尺码）
      run: |
        echo "🔍 校验顾客端店铺详情页交互..."
        python3 scripts/check-shop-c-page.py
        echo "✅ 顾客端店铺页交互守护通过"

    - name: 多租户隔离审计（P0铁律：Entity/Mapper 必须带 tenant_id）
      run: |
        echo "🔍 开始多租户隔离审计..."
        python3 scripts/audit-tenant-id.py
        echo "✅ 多租户隔离审计通过"

    - name: 依赖版本 EOL 检查（ratchet：存量告警，新增阻断）
      run: |
        echo "🔍 检查关键依赖是否已 EOL..."
        python3 scripts/check-dependency-eol.py
        echo "ℹ️  存量 EOL 见 dependency-eol-baseline.properties（修复一项请调低基线）"

    - name: 依赖版本生命周期报告（不阻断）
      continue-on-error: true
      run: |
        echo "📋 生成依赖版本报告..."
        python3 scripts/check-dependency-eol.py --report > dependency-eol-report.md || true
        cat dependency-eol-report.md

    - name: 前端硬编码颜色审计（不阻断，仅生成报告）
      continue-on-error: true
      run: |
        echo "🎨 开始前端硬编码颜色审计..."
        python3 scripts/audit-frontend-colors.py || true
        echo "ℹ️  颜色审计报告已生成（历史遗留硬编码不会阻断 CI，新增硬编码请及时清理）"

    - name: 生产配置安全扫描
      run: |
        echo "🔍 开始生产配置安全扫描..."
        ERRORS=0

        # 1. 检查生产CORS是否包含localhost或http
        if grep -q "localhost" backend/src/main/resources/application-prod.yml 2>/dev/null; then
          echo "❌ 生产CORS配置包含localhost"
          ERRORS=$((ERRORS + 1))
        fi
        if grep -q "http://" backend/src/main/resources/application-prod.yml 2>/dev/null | grep -v "#"; then
          echo "⚠️  生产CORS配置包含HTTP协议源"
          ERRORS=$((ERRORS + 1))
        fi

        # 2. 检查生产配置是否使用弱JWT密钥
        if grep -q "ThisIsA_LocalJwtSecret" backend/src/main/resources/application-prod.yml 2>/dev/null; then
          echo "❌ 生产环境使用开发JWT密钥"
          ERRORS=$((ERRORS + 1))
        fi

        # 3. 检查生产配置是否使用弱数据库密码
        if grep -q "changeme" backend/src/main/resources/application-prod.yml 2>/dev/null; then
          echo "❌ 生产环境使用弱数据库密码"
          ERRORS=$((ERRORS + 1))
        fi

        # 4. 检查生产环境是否开启微信Mock
        if grep -q "mock-enabled: true" backend/src/main/resources/application-prod.yml 2>/dev/null; then
          echo "❌ 生产环境开启了微信Mock模式"
          ERRORS=$((ERRORS + 1))
        fi

        # 5. 检查前端是否有localhost硬编码（排除配置文件和构建脚本）
        FOUND_LOCALHOST=$(grep -rn "localhost:5173\|localhost:8080\|localhost:8088" \
          frontend/src/ --include="*.ts" --include="*.tsx" 2>/dev/null | grep -v "vite.config\|.env\|node_modules" || true)
        if [ -n "$FOUND_LOCALHOST" ]; then
          echo "⚠️  前端源码中发现localhost硬编码:"
          echo "$FOUND_LOCALHOST"
          ERRORS=$((ERRORS + 1))
        fi

        # 6. 检查回调URL占位符
        if grep -q "你的域名" backend/src/main/resources/application-prod.yml 2>/dev/null; then
          echo "⚠️  生产配置中存在'你的域名'占位符"
        fi

        # 7. 检查启动探针宽限期（P0：INC-20260612-001 —— 探针秒判导致容器反复重启）
        #
        # 2026-09-24 修正：本项原来查的是 `cloudbaserc.json` 的 initialDelaySeconds，
        # 那是**微信云托管时代**的配置。生产环境 2026-09-17 已迁到自建轻量服务器
        # （Docker Compose + Caddy），cloudbaserc.json 已成历史遗留文件，
        # 继续拿它当门禁有两个问题：① 守着不生效的配置 ② 一旦清理掉该文件 CI 就会红。
        # 真正的等价保护现在是 compose 里的 `start_period`（应用启动约 40~90s，需留足宽限），
        # 所以检查目标改为它 —— 保护不变，指向真正生效的地方。
        echo ""
        echo "🔍 检查后端启动探针宽限期（deploy/lighthouse/docker-compose.yml start_period）..."
        COMPOSE_FILE="deploy/lighthouse/docker-compose.yml"
        if [ ! -f "$COMPOSE_FILE" ]; then
          echo "⚠️  未找到 $COMPOSE_FILE，跳过该项（不阻断）"
        else
          START_PERIOD=$(grep -oE 'start_period:[[:space:]]*[0-9]+s' "$COMPOSE_FILE" | grep -oE '[0-9]+' | head -1)
          if [ -z "$START_PERIOD" ]; then
            echo "⚠️  compose 未显式设置 start_period（应用启动约 40~90s，建议 ≥200s，不阻断）"
          elif [ "$START_PERIOD" -lt 200 ]; then
            echo "❌ start_period=${START_PERIOD}s 太小（应用启动需 90s+，建议 ≥300s，防容器被误判不健康而反复重启）"
            ERRORS=$((ERRORS + 1))
          else
            echo "✅ start_period=${START_PERIOD}s"
          fi
        fi

        # 8. 检查前端是否有生产环境不应有的console.log
        BARE_CONSOLE=$(grep -rn "console\.log" frontend/src/ --include="*.ts" --include="*.tsx" 2>/dev/null \
          | grep -v "isDev\|import.meta.env.DEV\|logger\|errorHandling\|wrap(\|//.*console\|console\.log(res\|console\.log(stats\|console\.log(config" || true)
        if [ -n "$BARE_CONSOLE" ]; then
          CONSOLE_COUNT=$(echo "$BARE_CONSOLE" | wc -l)
          echo "⚠️  前端源码中发现 ${CONSOLE_COUNT} 处未守卫的console.log（生产构建会自动移除，建议清理）"
        fi

        if [ $ERRORS -gt 0 ]; then
          echo ""
          echo "❌ 安全扫描发现 ${ERRORS} 个问题，请修复后重新提交"
          exit 1
        fi

        echo "✅ 安全扫描通过"

  backend-test:
    name: 后端测试
    runs-on: ubuntu-latest
    needs: [quality-gate]

    steps:
    - name: 检出代码
      uses: actions/checkout@v6
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: 设置 JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    - name: 后端编译 + Checkstyle 代码规范检查
      working-directory: ./backend
      run: |
        mvn clean compile checkstyle:check -q

    - name: 运行后端单元测试 + Jacoco覆盖率报告
      working-directory: ./backend
      run: |
        mvn test jacoco:report \
          -Dspring.profiles.active=test \
          -DexcludedGroups=integration \
          -Dsurefire.failIfNoSpecifiedTests=false

    - name: 输出测试统计
      working-directory: ./backend
      run: |
        TEST_COUNT=$(find target/surefire-reports -name "*.xml" 2>/dev/null | wc -l)
        if [ "$TEST_COUNT" -gt 0 ]; then
          echo "✅ 共找到 ${TEST_COUNT} 个测试报告"
          grep -h "testcase" target/surefire-reports/*.xml 2>/dev/null | wc -l | xargs echo "✅ 测试用例总数:"
        else
          echo "⚠️  当前没有测试用例（surefire-reports 为空）"
        fi

    - name: JaCoCo 覆盖率报告（不阻断，仅输出当前覆盖率）
      working-directory: ./backend
      run: |
        echo "📊 JaCoCo 覆盖率报告"
        if [ -f target/site/jacoco/jacoco.csv ]; then
          echo "GROUP,INSTRUCTION_MISSED,INSTRUCTION_COVERED,BRANCH_MISSED,BRANCH_COVERED"
          head -1 target/site/jacoco/jacoco.csv
          TOTAL_MISS=$(awk -F',' 'NR>1 {miss+=$4} END {print miss}' target/site/jacoco/jacoco.csv)
          TOTAL_COVER=$(awk -F',' 'NR>1 {cover+=$5} END {print cover}' target/site/jacoco/jacoco.csv)
          if [ -n "$TOTAL_MISS" ] && [ -n "$TOTAL_COVER" ] && [ "$((TOTAL_MISS + TOTAL_COVER))" -gt 0 ]; then
            PCT=$(awk "BEGIN {printf \"%.1f\", ($TOTAL_COVER / ($TOTAL_MISS + $TOTAL_COVER)) * 100}")
            echo ""
            echo "📊 总指令覆盖率: ${PCT}%（覆盖 $TOTAL_COVER / 未覆盖 $TOTAL_MISS）"
            if (( $(echo "$PCT < 30" | bc -l) )); then
              echo "⚠️  覆盖率低于 30%，建议补充核心业务路径单元测试"
            else
              echo "✅ 覆盖率达标（≥30%）"
            fi
          fi
        else
          echo "⚠️  未找到 jacoco.csv，跳过覆盖率统计"
        fi

  frontend-lint:
    name: 前端代码规范检查 (ESLint + TypeScript)
    runs-on: ubuntu-latest
    needs: [quality-gate]

    steps:
    - name: 检出代码
      uses: actions/checkout@v6
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: 设置 Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'frontend/package-lock.json'

    - name: 安装依赖
      working-directory: ./frontend
      run: npm install --legacy-peer-deps

    - name: ESLint 代码规范检查
      working-directory: ./frontend
      run: npm run lint

    - name: TypeScript 类型检查
      working-directory: ./frontend
      run: npx tsc --noEmit

    # D-474：前端测试已入库（原被 .gitignore 排除，447 个测试 CI 完全没跑），
    # 这里作为门禁执行，防止断言悄悄过期（本次就发现 2 个过期断言）。
    - name: 前端单元测试（Vitest，门禁）
      working-directory: ./frontend
      run: npm test

    - name: UI 规范检查（字号/圆角/间距档位，不阻断，仅报告）
      continue-on-error: true
      run: |
        echo "📐 开始 UI 规范检查..."
        node frontend/scripts/check-ui-tokens.mjs 2>&1 | head -60 || true
        echo "ℹ️  UI 规范检查报告已生成（规范档位见 docs/前端UI工整度审查-2026-09-13.md）"

    - name: 内联样式基线检查（不阻断，仅报告）
      continue-on-error: true
      run: |
        echo "📏 开始内联样式检查..."
        node frontend/scripts/check-inline-style.mjs 2>&1 | head -20 || true
        echo "ℹ️  内联样式基线已锁定，新增 style={{}} 会被报告"

    - name: 死代码检测（ts-prune，不阻断，仅生成报告）
      continue-on-error: true
      working-directory: ./frontend
      run: |
        echo "🧹 开始死代码检测..."
        npx ts-prune 2>&1 | head -100 || true
        echo "ℹ️  死代码检测报告已生成（未使用的导出不会阻断 CI，请定期清理）"

    # D-676：循环依赖已清零（D-673），从「仅报告」升级为门禁，防止架构回退。
    # 与本地 pre-push 用同一个脚本，保证口径一致。
    - name: 循环依赖检测（madge，门禁）
      working-directory: ./frontend
      run: python3 ../scripts/check-frontend-circular.py

  frontend-build:
    name: 前端构建
    runs-on: ubuntu-latest
    needs: [quality-gate, frontend-lint]

    steps:
    - name: 检出代码
      uses: actions/checkout@v6
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: 设置 Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'frontend/package-lock.json'

    - name: 安装依赖
      working-directory: ./frontend
      run: npm install --legacy-peer-deps

    - name: 运行构建
      working-directory: ./frontend
      run: npm run build

    - name: 上传构建产物
      uses: actions/upload-artifact@v7
      with:
        name: frontend-dist
        path: frontend/dist
        retention-days: 7

  miniprogram-test:
    name: 小程序单元测试
    runs-on: ubuntu-latest
    needs: [quality-gate]

    steps:
    - name: 检出代码
      uses: actions/checkout@v6
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: 设置 Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20'

    # 2026-10-10：小程序测试已入库（原被 .gitignore 排除，46 个测试纯靠本机手动跑）。
    # 实测测试只依赖 node:test / node:assert 内置模块，storage.js 用的 wx.* 由
    # 测试自己注入 global.wx mock，因此**无需 npm install**，直接跑即可。
    - name: 小程序单元测试（node:test，门禁）
      working-directory: ./miniprogram
      run: npm run 测试

  create-release-tag:
    name: 创建发布标签
    runs-on: ubuntu-latest
    # ★ 2026-08-20 加 postdeploy-smoke-test：
    # 冒烟失败的版本不允许打发布标签（旧逻辑部署成功就打标签，掩盖带病版本）
    needs: [backend-test, frontend-build, miniprogram-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write

    steps:
    - name: 检出代码
      uses: actions/checkout@v6
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0

    - name: 创建版本标签
      run: |
        CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
        if echo "$CHANGED_FILES" | grep -q "^\.github/workflows/"; then
          echo "跳过打标签: 本次提交包含 workflow 文件变更，GITHUB_TOKEN 无 workflows 权限"
          exit 0
        fi
        VERSION=$(grep -m1 '<version>' backend/pom.xml | sed 's/.*<version>\(.*\)<\/version>.*/\1/' | tr -d '[:space:]')
        TAG="v${VERSION}-$(date +%Y%m%d-%H%M%S)"
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git tag "$TAG"
        git push origin "$TAG"
        echo "已创建标签: $TAG"

  notify:
    name: 通知结果
    runs-on: ubuntu-latest
    # ★ D-828 补缺（2026-10-21 盘点发现）：needs 原先只有 3 个 job，
    #   quality-gate / frontend-lint 红时本 job 竟显示"全绿"——假绿比红更危险。
    #   今天真实事故：4 个测试类红了一整天 15 个 run 无人处理。
    needs: [quality-gate, backend-test, frontend-lint, frontend-build, miniprogram-test]
    if: always()

    steps:
    - name: 检出代码（notify-ci.sh 用）
      uses: actions/checkout@v6
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: 检查整体结果
      run: |
        QG="${{ needs.quality-gate.result }}"
        BACKEND="${{ needs.backend-test.result }}"
        FLINT="${{ needs.frontend-lint.result }}"
        FRONTEND="${{ needs.frontend-build.result }}"
        MINIPROGRAM="${{ needs.miniprogram-test.result }}"

        echo "质量门禁: $QG"
        echo "后端测试: $BACKEND"
        echo "前端lint: $FLINT"
        echo "前端构建: $FRONTEND"
        echo "小程序测试: $MINIPROGRAM"

        # ★ 2026-08-20 事故教训：CI 红了没人看 → 云端跑旧代码 → 用户当测试员
        # 任何环节失败都让整个 workflow 显示红叉，强迫推送者确认
        # ★ D-828：5 个 job 全查（此前漏 quality-gate/frontend-lint，假绿）
        FAILED=0
        for PAIR in "质量门禁:$QG" "后端测试:$BACKEND" "前端lint:$FLINT" "前端构建:$FRONTEND" "小程序测试:$MINIPROGRAM"; do
          NAME="${PAIR%%:*}"
          R="${PAIR##*:}"
          if [[ "$R" == "failure" || "$R" == "cancelled" ]]; then
            FAILED=1
            echo "FAILED_JOB=$NAME"
          fi
        done

        if [[ "$FAILED" == "1" ]]; then
          echo ""
          echo "╔══════════════════════════════════════════════╗"
          echo "║  ❌ 流水线存在失败环节 — 云端可能不是最新代码  ║"
          echo "╠══════════════════════════════════════════════╣"
          echo "║  质量门禁失败     → 门控空转 → 腐烂静默发生   ║"
          echo "║  后端测试失败     → 带病上线风险              ║"
          echo "║  前端lint失败     → 类型/规范债务累积         ║"
          echo "║  前端构建失败     → 生产不更新 → 旧代码       ║"
          echo "║  小程序测试失败   → 门控空转 → 腐烂静默发生   ║"
          echo "║  ⚠️ autodeploy 不看 CI：红提交也会上生产      ║"
          echo "║  请到 Actions 页面查看失败详情并修复后重推     ║"
          echo "╚══════════════════════════════════════════════╝"
          exit 1
        fi
        echo "✅ 流水线全绿，云端已是最新版本"

    # ★ D-828：主动推送失败通知（2026-10-21 事故：红叉只在 GitHub 页面，
    #   连红 15 个 run 一整天无人处理）。配置 NOTIFY_WEBHOOK secret 后生效；
    #   未配置时 notify-ci.sh 静默 no-op，不挡 CI。
    - name: 推送失败通知（企业微信/Server酱，需 NOTIFY_WEBHOOK secret）
      if: failure()
      env:
        CI_NOTIFY_WEBHOOK: ${{ secrets.NOTIFY_WEBHOOK }}
      run: |
        bash scripts/notify-ci.sh "❌ **CI 流水线失败**（服装66666）
        分支：\`${{ github.ref_name }}\`
        提交：\`${GITHUB_SHA:0:9}\` —— ${{ github.event.head_commit.message }}
        查看：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        ⚠️ 提醒：autodeploy 独立于 CI，红色提交也会部署上生产，请尽快修复后重推"

