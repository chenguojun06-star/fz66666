# autodeploy 部署日志轮转（D-702）
#
# 背景：deploy/lighthouse/autodeploy.sh 由 cron 每 2 分钟调用一次，输出全部追加到
#   /opt/fz66666/autodeploy.log，且**没有任何轮转机制**。
# 实测该文件已 60MB（截至 2026-10-02），且随部署频次单调增长，不回收。
#
# 保留策略：保留 5 份、每份 20MB → 最多占用约 100MB。
# 保留份数按「够查最近几次部署」来定：日常 autodeploy 两天一次，
# 5 份约覆盖最近两周的部署记录，足够排查回滚问题。
#
# 用法（服务器上执行一次即可）：
#   sudo cp docs/deploy-lighthouse-logrotate.conf /etc/logrotate.d/autodeploy
#   sudo logrotate -d /etc/logrotate.d/autodeploy   # 先干跑验证，不实际执行
#   sudo logrotate -f /etc/logrotate.d/autodeploy   # 确认无误后强制执行一次
#
# 注意：logrotate 需要以 root 身份、且文件属主匹配 below 用户才会执行。
# 若 autodeploy.log 属主不是 ubuntu，请按实际情况调整下面的 `su` 行。

/opt/fz66666/autodeploy.log {
    size 20M
    rotate 5
    # 压缩历史日志。延迟一个 cycle 压缩，给正在排查的人留出直接可读的原始文件。
    delaycompress
    missingok
    notifempty
    # 属主属组需与实际创建日志的用户一致，否则轮转会静默跳过
    su ubuntu ubuntu
    # 轮转后权限继承，避免脚本继续以只追加方式写入新文件时报错
    create 0644 ubuntu ubuntu
}
