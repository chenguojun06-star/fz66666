# =====================================================================
# 轻量服务器一体化部署（D-386 迁移方案）
# 一台 4核8G 轻量服务器承载：MySQL + Redis + Qdrant + backend + frontend + CloudBeaver + Caddy(HTTPS边缘)
# 用法见同目录 README.md；所有密码/密钥放同目录 .env（不入库）
# =====================================================================

services:

  # ── HTTPS 边缘（自动申请/续期 Let's Encrypt 证书）──
  caddy:
    image: caddy:2-alpine
    # D-465：2核4G 不升配方案 —— 给每个服务加内存上限，防单个服务失控拖垮整机
    # （D-453 事故根因就是构件与运行抢内存；上限值按实测占用放宽，非实际用量）
    mem_limit: 128m
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

  # ── PC 管理端前端（静态 + /api /ws 反代由 Caddy 承担，此容器只出静态）──
  frontend:
    build:
      context: ../../frontend
      args:
        # GIT_COMMIT 由 autodeploy.sh 写入同目录 .env，登录页版本水印据此显示当前 commit
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    mem_limit: 96m
    restart: unless-stopped
    environment:
      BACKEND_URL: "http://backend:8088"
    expose:
      - "80"
    depends_on:
      - backend

  # ── Spring Boot 后端 ──
  backend:
    build: ../../backend
    restart: unless-stopped
    env_file:
      - .env.backend          # 从云托管控制台整份复制，再按 README 改 DB/Redis/Qdrant 三处指向
    environment:
      PORT: "8088"
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: "6379"
      APP_DB_HOST: mysql
      APP_DB_PORT: "3306"
      QDRANT_URL: "http://qdrant:6333"
      # D-453：4G 内存机上 -Xmx3g 与 OS+MySQL+构建抢内存（事故根因之一），降到 1536m；当前实测 RSS 1.2G 足够
      # D-465：再降一档到 1280m 并封顶元空间（元空间不设限会随类加载持续增长）
      # 回滚指征：若后端出现 OOM 重启（docker compose logs backend | grep -i oom），调回 -Xmx1536m
      JAVA_OPTS: "-Xmx1280m -Xms384m -XX:MaxMetaspaceSize=256m"
    mem_limit: 2048m
    expose:
      - "8088"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8088/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s   # 给足启动时间（根治云托管探针秒判的坑）

  # ── MySQL 8（生产数据迁移进这里）──
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: fashion_supplychain
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max_allowed_packet=256M
      # D-465：开发阶段数据量小（整库 438MB），关掉性能_schema 省约 100MB；
      # buffer pool 显式设 256M（够装热数据），避免 MySQL8 默认策略在 4G 机上贪内存
      - --performance-schema=OFF
      - --innodb-buffer-pool-size=256M
      - --table-open-cache=400
    mem_limit: 1024m
    volumes:
      - mysql-data:/var/lib/mysql
    expose:
      - "3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12

  # ── phpMyAdmin（D-465：Caddy 从未路由到它，db 域名指向 CloudBeaver → 常驻纯属白吃内存）──
  # 配置保留备查，改为 profile 按需：sudo docker compose --profile dbtools up -d phpmyadmin
  phpmyadmin:
    image: phpmyadmin:5.2-alpine
    profiles: ["dbtools"]
    mem_limit: 128m
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      UPLOAD_LIMIT: 512M
    expose:
      - "80"
    depends_on:
      mysql:
        condition: service_healthy

  # ── CloudBeaver（DBeaver 官方 Web 版；D-461 修复：conf 目录不能只读挂载——首启要自己写 cloudbeaver.conf）──
  cloudbeaver:
    image: dbeaver/cloudbeaver:latest
    # D-465：查库工具不在业务链路上，却常驻吃掉几百 MB。改为按需：
    #   启动：sudo docker compose --profile dbtools up -d cloudbeaver
    #   用完：sudo docker compose stop cloudbeaver
    # 未运行时 db.webyszl.cn 由 Caddy 返回友好提示页（不是裸 502）。
    profiles: ["dbtools"]
    mem_limit: 768m
    restart: unless-stopped
    volumes:
      - cloudbeaver-data:/opt/cloudbeaver/workspace
      - cloudbeaver-conf:/opt/cloudbeaver/conf
    expose:
      - "8978"
    depends_on:
      mysql:
        condition: service_healthy

  # ── Redis 7 ──
  redis:
    image: redis:7-alpine
    mem_limit: 192m
    restart: unless-stopped
    # D-465：不设上限时 Redis 只增不减（缓存键无 TTL 会一路吃满），开发阶段 128mb 足够
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
    expose:
      - "6379"

  # ── Qdrant 向量库（服务器本地磁盘 = 永久持久化，不再随发版清零）──
  qdrant:
    image: qdrant/qdrant:latest
    mem_limit: 512m
    restart: unless-stopped
    volumes:
      - qdrant-data:/qdrant/storage
    expose:
      - "6333"

volumes:
  mysql-data:
  redis-data:
  qdrant-data:
  caddy-data:
  caddy-config:
  cloudbeaver-conf:
  cloudbeaver-data:
